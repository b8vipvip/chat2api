<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>chat2api</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>chat2api</h1>
    <div id="versionInfo" class="version-info">Chrome Bridge · 读取版本中…</div>
    <div id="status" class="status">读取状态中…</div>
    <label>服务地址<input id="serverUrl" placeholder="https://chat2api.mv3.cn" autocomplete="off"></label>
    <label>配对码<input id="pairingCode" type="password" placeholder="CHAT2API_PAIRING_CODE" autocomplete="off"></label>
    <label>扩展名称<input id="extensionName" placeholder="My Chrome" autocomplete="off"></label>
    <button id="pair">配对并连接</button>
    <button id="connect" class="secondary">重新连接</button>
    <hr>
    <div id="binding">尚未绑定 ChatGPT 标签页</div>
    <button id="bind" class="secondary">绑定当前 ChatGPT 标签页</button>
    <button id="discoverModels" class="secondary">刷新模型状态（不打开菜单）</button>
    <div id="models" class="model-list">尚未读取模型状态</div>
    <button id="unbind" class="secondary">取消绑定</button>
    <hr>
    <div>运行诊断</div>
    <div class="model-list">运行日志会静默自动保存在扩展的 chrome.storage.local；同 API Key 按调用 Run 聚合，120 秒空闲后封账。下面按钮只用于手动导出查看，不会触发自动下载。</div>
    <button id="downloadRuntimeLog" class="secondary">下载运行日志汇总</button>
    <button id="clearRuntimeLog" class="secondary">清空运行日志缓存</button>
    <pre id="message"></pre>
  </main>
  <script src="popup.js"></script>
  <script src="popup_logging.js"></script>
</body>
</html>
