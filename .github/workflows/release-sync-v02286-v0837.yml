name: One-shot release sync v0.22.86 v0.8.37

on:
  push:
    branches:
      - release/qnbot-recovery-v02286-v0837

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/qnbot-recovery-v02286-v0837
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Synchronize non-workflow release contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          SERVER = "0.22.86"
          BUNDLE = "0.8.37"

          runtime_path = Path("app/runtime_contract.py")
          runtime = runtime_path.read_text(encoding="utf-8")
          constants = {
              "SERVER_RUNTIME_VERSION": SERVER,
              "PREVIOUS_SERVER_RUNTIME_VERSION": "0.22.85",
              "PREVIOUS_PREVIOUS_SERVER_RUNTIME_VERSION": "0.22.84",
              "PREVIOUS_PREVIOUS_PREVIOUS_SERVER_RUNTIME_VERSION": "0.22.83",
              "PREVIOUS_PREVIOUS_PREVIOUS_PREVIOUS_SERVER_RUNTIME_VERSION": "0.22.82",
              "CHROME_BRIDGE_BUNDLE_VERSION": BUNDLE,
          }
          for name, value in constants.items():
              runtime, count = re.subn(
                  rf'^{name} = "[^"]+"$',
                  f'{name} = "{value}"',
                  runtime,
                  count=1,
                  flags=re.M,
              )
              if count != 1:
                  raise SystemExit(f"missing runtime contract constant: {name}")

          feature_suffix = "qnbot-request-id-namespace-v136-route-recovery-v136-release-v02286"
          runtime, count = re.subn(
              r'^(RUNTIME_FEATURE_REVISION = ")([^"]+)(")$',
              lambda m: m.group(1) + (m.group(2) if feature_suffix in m.group(2) else m.group(2) + "-" + feature_suffix) + m.group(3),
              runtime,
              count=1,
              flags=re.M,
          )
          if count != 1:
              raise SystemExit("missing RUNTIME_FEATURE_REVISION")

          build_suffix = "qnbot-route-recovery-v136-request-id-namespace-v136-release-v0837"
          runtime, count = re.subn(
              r'^(\s*"build_revision": ")([^"]+)(",)$',
              lambda m: m.group(1) + (m.group(2) if build_suffix in m.group(2) else m.group(2) + "-" + build_suffix) + m.group(3),
              runtime,
              count=1,
              flags=re.M,
          )
          if count != 1:
              raise SystemExit("missing chrome bridge build_revision")

          feature_needle = '            "persistent_worker_window_pool_canonical_v135": True,\n'
          if '"qnbot_stale_route_recovery_v136": True,' not in runtime:
              if feature_needle not in runtime:
                  raise SystemExit("missing persistent pool feature insertion point")
              runtime = runtime.replace(
                  feature_needle,
                  feature_needle
                  + '            "qnbot_stale_route_recovery_v136": True,\n'
                  + '            "request_id_namespace_v136": True,\n',
                  1,
              )
          runtime_path.write_text(runtime, encoding="utf-8")

          bundle_files = (
              "chrome_extension/manifest.json",
              "chrome_extension/background_runtime_preflight_v48.js",
              "chrome_extension/content_bundle_marker_v48.js",
              "chrome_extension/content_bundle_marker_v71.js",
              "chrome_extension/content_runtime_contract_v48.js",
              "chrome_extension/content_runtime_contract_v71.js",
          )
          for filename in bundle_files:
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              if "0.8.36" not in text:
                  raise SystemExit(f"expected old bundle marker missing: {filename}")
              path.write_text(text.replace("0.8.36", BUNDLE), encoding="utf-8")

          for path in Path("tests").rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".mjs", ".js"}:
                  continue
              text = path.read_text(encoding="utf-8")
              updated = text.replace("0.22.85", SERVER).replace("0.8.36", BUNDLE)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          release_test = Path("tests/test_qnbot_recovery_release_v02286_v0837.py")
          release_test.write_text('''from __future__ import annotations\n\nimport json\nfrom pathlib import Path\n\nfrom fastapi import FastAPI\n\nfrom app.runtime_contract import CHROME_BRIDGE_BUNDLE_VERSION, SERVER_RUNTIME_VERSION, version_contract_payload\n\nROOT = Path(__file__).resolve().parents[1]\n\ndef read(path: str) -> str:\n    return (ROOT / path).read_text(encoding="utf-8")\n\ndef test_v02286_v0837_qnbot_recovery_release_contract() -> None:\n    manifest = json.loads(read("chrome_extension/manifest.json"))\n    payload = version_contract_payload(FastAPI(version=SERVER_RUNTIME_VERSION))\n    assert SERVER_RUNTIME_VERSION == "0.22.86"\n    assert CHROME_BRIDGE_BUNDLE_VERSION == "0.8.37"\n    assert manifest["version"] == "0.8.37"\n    assert "release-v02286" in payload["server"]["feature_revision"]\n    assert "release-v0837" in payload["chrome_bridge"]["build_revision"]\n    assert payload["features"]["qnbot_stale_route_recovery_v136"] is True\n    assert payload["features"]["request_id_namespace_v136"] is True\n\ndef test_v0837_worker_bundle_loads_route_recovery_v136() -> None:\n    entry = read("chrome_extension/background_entry.js")\n    recovery = read("chrome_extension/conversation_route_recovery_v136.js")\n    assert "conversation_route_recovery_v136.js" in entry\n    assert "server-authority-stale-inflight-v136" in recovery\n    assert "server-cancel-control-v136" in recovery\n    for path in (\n        "chrome_extension/background_runtime_preflight_v48.js",\n        "chrome_extension/content_bundle_marker_v48.js",\n        "chrome_extension/content_bundle_marker_v71.js",\n        "chrome_extension/content_runtime_contract_v48.js",\n        "chrome_extension/content_runtime_contract_v71.js",\n    ):\n        assert "0.8.37" in read(path), path\n\ndef test_v02286_installs_request_id_namespace_v136() -> None:\n    entry = read("app/entry.py")\n    namespace = read("app/request_id_namespace_v136_patch.py")\n    assert "install_request_id_namespace_v136_patch(app)" in entry\n    assert '"/v1/responses": ("resp_req_", "responses")' in namespace\n    assert '"/v1/chat/completions": ("req_", "chat")' in namespace\n    assert "x-chat2api-trace-id" in namespace.lower()\n''', encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/runtime_contract.py chrome_extension tests
          git diff --cached --check
          git commit -m "release: prepare chat2api 0.22.86 Worker bundle 0.8.37"
          git push origin HEAD:release/qnbot-recovery-v02286-v0837
