name: Temporary v0.22.48 runtime version observability fix

on:
  push:
    branches:
      - fix/runtime-version-observability-v80-20260903

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/runtime-version-observability-v80-20260903
          fetch-depth: 0
      - name: Apply runtime identity ownership fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/v21_3_patch.py')
          text = p.read_text(encoding='utf-8')
          old = '''            if isinstance(payload, dict):\n                payload["version"] = PATCH_VERSION\n                if "server_version" in payload or path.endswith("/log"):\n                    payload["server_version"] = PATCH_VERSION\n'''
          new = '''            # v21.3 owns only the historical admin bundle. Runtime identity is\n            # owned by runtime_contract and must never be rewritten to this patch\n            # version in modern admin/diagnostic responses.\n'''
          if old not in text:
              raise SystemExit('app/v21_3_patch.py: stale runtime stamping block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('app/runtime_contract.py')
          text = p.read_text(encoding='utf-8')
          if 'SERVER_RUNTIME_VERSION = "0.22.47"' not in text:
              raise SystemExit('runtime 0.22.47 anchor missing')
          text = text.replace('SERVER_RUNTIME_VERSION = "0.22.47"', 'SERVER_RUNTIME_VERSION = "0.22.48"', 1)
          text = text.replace('-release-v02247"', '-runtime-version-observability-v80-release-v02248"', 1)
          anchor = '            "submission_liveness_v79": True,\n'
          if anchor not in text:
              raise SystemExit('runtime feature anchor missing')
          text = text.replace(anchor, anchor + '            "runtime_version_observability_v80": True,\n', 1)
          p.write_text(text, encoding='utf-8')

          for p in Path('tests').glob('*'):
              if not p.is_file() or p.suffix not in {'.py', '.mjs', '.js'}:
                  continue
              text = p.read_text(encoding='utf-8')
              text = text.replace('SERVER_RUNTIME_VERSION = "0.22.47"', 'SERVER_RUNTIME_VERSION = "0.22.48"')
              text = text.replace('SERVER_RUNTIME_VERSION == "0.22.47"', 'SERVER_RUNTIME_VERSION == "0.22.48"')
              text = text.replace('assert "0.22.47" in result.stdout', 'assert "0.22.48" in result.stdout')
              p.write_text(text, encoding='utf-8')

          Path('tests/test_runtime_version_observability_v80.py').write_text('''from pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\n\n\ndef read(path: str) -> str:\n    return (ROOT / path).read_text(encoding="utf-8")\n\n\ndef test_historical_v213_admin_patch_no_longer_overwrites_runtime_identity() -> None:\n    source = read("app/v21_3_patch.py")\n    assert 'payload["version"] = PATCH_VERSION' not in source\n    assert 'payload["server_version"] = PATCH_VERSION' not in source\n    assert "Runtime identity is" in source\n    assert "owned by runtime_contract" in source\n\n\ndef test_v02248_runtime_contract_owns_current_identity_without_bundle_bump() -> None:\n    runtime = read("app/runtime_contract.py")\n    manifest = read("chrome_extension/manifest.json")\n    assert 'SERVER_RUNTIME_VERSION = "0.22.48"' in runtime\n    assert 'CHROME_BRIDGE_VERSION = "0.8.1"' in runtime\n    assert 'CHROME_BRIDGE_BUNDLE_VERSION = "0.8.19"' in runtime\n    assert '"version": "0.8.19"' in manifest\n    assert '"runtime_version_observability_v80": True' in runtime\n''', encoding='utf-8')

          Path('docs/releases/v0.22.48.md').write_text('''# v0.22.48 / Worker Bundle 0.8.19\n\n本版本修复请求诊断与管理员 JSON 中错误的 Server Version 标识。\n\n- 历史 `v21_3_patch` 不再把所有管理员/诊断 JSON 的 `version` / `server_version` 强制覆盖为 `0.21.3`。\n- Server Runtime 身份由 `runtime_contract` 单一拥有，正式版本为 `0.22.48`。\n- Worker Bundle 没有代码变更，继续为 `0.8.19`，Bridge 协议继续为 `0.8.1`。\n- 该修复只纠正诊断/可观测性版本身份，不改变 v0.22.47 已修复的 active-request lease、上传 settle 与 submission liveness 行为。\n''', encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/tmp-v02248-runtime-version-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix stale runtime version stamping; release v0.22.48"
          git push origin HEAD:fix/runtime-version-observability-v80-20260903
