name: Login-ready timeout map v137

on:
  push:
    branches:
      - fix/login-ready-admission-v137

permissions:
  contents: read

jobs:
  map-timeouts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/login-ready-admission-v137
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]' pytest-timeout
      - name: Map remaining timeout tests
        env:
          PYTHONUNBUFFERED: '1'
        run: pytest -vv -s --timeout=10 --maxfail=20
