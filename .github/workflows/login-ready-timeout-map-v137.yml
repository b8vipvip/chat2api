name: Login-ready timeout map v137

on:
  push:
    branches:
      - fix/login-ready-admission-v137

permissions:
  contents: write

jobs:
  map-timeouts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/login-ready-admission-v137
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Patch legacy Worker fixtures to be explicitly ChatGPT-ready
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if expected is not None and count != expected:
                  raise SystemExit(f'{path}: expected {expected} replacements, found {count}: {old!r}')
              if count == 0:
                  raise SystemExit(f'{path}: pattern not found: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')
              print(f'{path}: replaced {count}')

          ready = '{"chatgpt_login_state": "ready", "chatgpt_login_composer_ready": True}'
          for path, version in [
              ('tests/test_v12.py', '0.7.0'),
              ('tests/test_v13.py', '0.7.0'),
              ('tests/test_v15.py', '0.7.3'),
              ('tests/test_v7.py', '0.6.5'),
              ('tests/test_voice_v6.py', '0.7.0'),
          ]:
              replace(
                  path,
                  f'json={{"name": "Chrome", "version": "{version}"}},',
                  f'json={{"name": "Chrome", "version": "{version}", "metadata": {ready}}},',
                  expected=1,
              )

          replace(
              'tests/test_v17.py',
              '"metadata": {"runtime_id": "extension-runtime", "device_id": device_id},',
              '"metadata": {"runtime_id": "extension-runtime", "device_id": device_id, "chatgpt_login_state": "ready", "chatgpt_login_composer_ready": True},',
              expected=1,
          )

          replace(
              'tests/test_v2_features.py',
              'json={"name": "Chrome", "version": "0.4.0"})',
              'json={"name": "Chrome", "version": "0.4.0", "metadata": {"chatgpt_login_state": "ready", "chatgpt_login_composer_ready": True}})',
              expected=1,
          )
          replace(
              'tests/test_v2_features.py',
              '"metadata": {"models":',
              '"metadata": {"chatgpt_login_state": "ready", "chatgpt_login_composer_ready": True, "models":',
              expected=3,
          )

          replace(
              'tests/test_worker_limit_alignment.py',
              'await registry.register("A", "Chrome", "0.8.7", {})',
              'await registry.register("A", "Chrome", "0.8.7", {"chatgpt_login_state": "ready", "chatgpt_login_composer_ready": True})',
              expected=1,
          )
          PY
          git diff --check
          git diff -- tests/test_v12.py tests/test_v13.py tests/test_v15.py tests/test_v17.py tests/test_v2_features.py tests/test_v7.py tests/test_voice_v6.py tests/test_worker_limit_alignment.py
      - name: Commit fixture updates
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No fixture changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_v12.py tests/test_v13.py tests/test_v15.py tests/test_v17.py tests/test_v2_features.py tests/test_v7.py tests/test_voice_v6.py tests/test_worker_limit_alignment.py
          git commit -m 'test: mark remaining legacy Worker fixtures ChatGPT-ready'
          git push origin HEAD:fix/login-ready-admission-v137
      - name: Install dependencies
        run: python -m pip install -e '.[dev]' pytest-timeout
      - name: Map remaining timeout tests
        env:
          PYTHONUNBUFFERED: '1'
        run: pytest -vv -s --timeout=10 --maxfail=20
