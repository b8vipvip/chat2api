name: Temporary v0.22.106 production smoke alignment

on:
  push:
    branches:
      - release/v0.22.106-standby-target-sync

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.22.106-standby-target-sync
          fetch-depth: 0
      - name: Stage production smoke workflow as ordinary blob
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/production-image-smoke.yml')
          data = path.read_text(encoding='utf-8')
          count = data.count('0.22.105')
          if count != 3:
              raise SystemExit(f'expected exactly 3 v0.22.105 smoke assertions, found {count}')
          Path('production-image-smoke.v022106.patched.yml').write_text(
              data.replace('0.22.105', '0.22.106'), encoding='utf-8'
          )
          print('staged patched production smoke blob')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add production-image-smoke.v022106.patched.yml
          git commit -m "chore(release): stage v0.22.106 production smoke blob"
          git push origin HEAD:release/v0.22.106-standby-target-sync
