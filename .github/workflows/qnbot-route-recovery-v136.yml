name: One-shot qnbot route recovery v136

on:
  push:
    branches:
      - fix/qnbot-route-recovery-v136

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/qnbot-route-recovery-v136
          fetch-depth: 0
      - name: Wire qnbot recovery patches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          background = Path("chrome_extension/background_entry.js")
          text = background.read_text(encoding="utf-8")
          marker = '  "background_window_refresh_v129.js",\n'
          if '"conversation_route_recovery_v136.js"' not in text:
              if marker not in text:
                  raise SystemExit("background entry insertion point missing")
              text = text.replace(
                  marker,
                  marker
                  + '  // Recover persisted per-API route ownership after a server timeout/cancel.\n'
                  + '  // Loaded last so it wraps the final resolver/control-handler chain.\n'
                  + '  "conversation_route_recovery_v136.js",\n',
                  1,
              )
              background.write_text(text, encoding="utf-8")

          entry = Path("app/entry.py")
          text = entry.read_text(encoding="utf-8")
          import_marker = 'from .responses_console_v110_patch import install_responses_console_v110_patch\n'
          if 'from .request_id_namespace_v136_patch import install_request_id_namespace_v136_patch' not in text:
              if import_marker not in text:
                  raise SystemExit("entry import insertion point missing")
              text = text.replace(
                  import_marker,
                  import_marker + 'from .request_id_namespace_v136_patch import install_request_id_namespace_v136_patch\n',
                  1,
              )
          install_marker = 'install_responses_console_v110_patch(app)\ninstall_request_history_v94_patch(app)\n'
          if 'install_request_id_namespace_v136_patch(app)' not in text:
              if install_marker not in text:
                  raise SystemExit("entry install insertion point missing")
              text = text.replace(
                  install_marker,
                  'install_responses_console_v110_patch(app)\n'
                  '# Final public API ingress boundary: keep internal broker request IDs protocol-native\n'
                  '# and attach a trace ID without buffering streaming Responses/Chat output.\n'
                  'install_request_id_namespace_v136_patch(app)\n'
                  'install_request_history_v94_patch(app)\n',
                  1,
              )
          entry.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/entry.py chrome_extension/background_entry.js
          if git diff --cached --quiet; then
            echo "qnbot recovery wiring already applied"
            exit 0
          fi
          git diff --cached --check
          git commit -m "fix: wire qnbot route recovery v136"
          git push origin HEAD:fix/qnbot-route-recovery-v136
