name: v0.22.88 admin UI sync

on:
  workflow_dispatch:
  push:
    branches:
      - fix/admin-window-identity-worker-config-v138

permissions:
  contents: write

concurrency:
  group: v02288-admin-ui-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/admin-window-identity-worker-config-v138
          fetch-depth: 0
      - name: Apply v138 transformations
        run: python .github/scripts/apply_v138_admin_ui.py
      - name: Syntax checks
        run: |
          node --check app/admin_worker_identity_v131.js
          node --check app/admin_worker_limits_clipboard_v121.js
          node --check app/admin_window_manager_v88.js
          python -m py_compile app/request_window_observability_v117_patch.py app/runtime_contract.py tests/test_admin_ui_polish_v138_release_v02288.py
      - name: Commit generated changes
        run: |
          if git diff --quiet -- app tests .github/workflows/production-image-smoke.yml; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app tests .github/workflows/production-image-smoke.yml
          git commit -m 'fix: refine Worker controls and window identity v138'
          git push origin HEAD:fix/admin-window-identity-worker-config-v138
