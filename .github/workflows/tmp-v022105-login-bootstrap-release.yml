name: Temporary v0.22.105 smoke alignment

on:
  push:
    branches:
      - release/v0.22.105-login-bootstrap

permissions:
  contents: write
  actions: write

jobs:
  align-smoke:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.22.105-login-bootstrap
          fetch-depth: 0
          token: ${{ secrets.GPTAUTO_EXECUTOR_TOKEN || github.token }}
      - name: Align production smoke contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/production-image-smoke.yml')
          data = path.read_text(encoding='utf-8')
          count = data.count('0.22.104')
          if count < 2:
              raise SystemExit(f'expected v0.22.104 smoke assertions, found {count}')
          path.write_text(data.replace('0.22.104', '0.22.105'), encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/production-image-smoke.yml
          git diff --cached --check
          git commit -m "release: align production smoke to v0.22.105"
          git push origin HEAD:release/v0.22.105-login-bootstrap
