name: Temporary v0.22.105 login bootstrap release

on:
  push:
    branches:
      - release/v0.22.105-login-bootstrap

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.22.105-login-bootstrap
          fetch-depth: 0
      - name: Apply v0.22.105 patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python .github/tmp-v022105-patch.py
          node --check chrome_extension/conversation_persistent_pool_v132.js
          node --check chrome_extension/background_login_v27.js
          python -m py_compile app/runtime_contract.py
          if [[ -f scripts/check_workflow_allowlist.py ]]; then
            python scripts/check_workflow_allowlist.py
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add . ':!.github/workflows/tmp-v022105-login-bootstrap-release.yml' ':!.github/tmp-v022105-patch.py'
          git diff --cached --check
          git diff --cached --quiet && { echo 'No patch produced'; exit 1; }
          git commit -m "release: v0.22.105 login bootstrap authority"
          git push origin HEAD:release/v0.22.105-login-bootstrap
