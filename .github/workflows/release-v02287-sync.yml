name: Release v0.22.87 sync

on:
  push:
    branches:
      - release/login-ready-v02287

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/login-ready-v02287
          fetch-depth: 0
      - name: Prepare server-only v0.22.87 release contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          runtime = Path('app/runtime_contract.py')
          text = runtime.read_text(encoding='utf-8')
          if 'SERVER_RUNTIME_VERSION = "0.22.87"' in text:
              print('v0.22.87 runtime contract already synchronized')
          else:
              replacements = [
                  ('SERVER_RUNTIME_VERSION = "0.22.86"', 'SERVER_RUNTIME_VERSION = "0.22.87"'),
                  ('PREVIOUS_SERVER_RUNTIME_VERSION = "0.22.85"', 'PREVIOUS_SERVER_RUNTIME_VERSION = "0.22.86"'),
                  ('PREVIOUS_PREVIOUS_SERVER_RUNTIME_VERSION = "0.22.84"', 'PREVIOUS_PREVIOUS_SERVER_RUNTIME_VERSION = "0.22.85"'),
                  ('PREVIOUS_PREVIOUS_PREVIOUS_SERVER_RUNTIME_VERSION = "0.22.83"', 'PREVIOUS_PREVIOUS_PREVIOUS_SERVER_RUNTIME_VERSION = "0.22.84"'),
                  ('PREVIOUS_PREVIOUS_PREVIOUS_PREVIOUS_SERVER_RUNTIME_VERSION = "0.22.82"', 'PREVIOUS_PREVIOUS_PREVIOUS_PREVIOUS_SERVER_RUNTIME_VERSION = "0.22.83"'),
              ]
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'missing expected runtime marker: {old}')
                  text = text.replace(old, new, 1)
              lines = text.splitlines()
              for index, line in enumerate(lines):
                  if line.startswith('RUNTIME_FEATURE_REVISION = '):
                      if 'release-v02286' not in line:
                          raise SystemExit('release-v02286 feature revision marker missing')
                      if 'release-v02287' not in line:
                          lines[index] = line[:-1] + '-chatgpt-login-ready-admission-v137-window-manager-filter-v137-release-v02287"'
                      break
              else:
                  raise SystemExit('RUNTIME_FEATURE_REVISION line missing')
              runtime.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          for path in Path('tests').rglob('*.py'):
              source = path.read_text(encoding='utf-8')
              updated = source.replace('SERVER_RUNTIME_VERSION == "0.22.86"', 'SERVER_RUNTIME_VERSION == "0.22.87"')
              updated = updated.replace('SERVER_RUNTIME_VERSION = "0.22.86"', 'SERVER_RUNTIME_VERSION = "0.22.87"')
              if updated != source:
                  path.write_text(updated, encoding='utf-8')

          release_test = Path('tests/test_login_ready_release_v02287.py')
          release_test.write_text('''from __future__ import annotations\n\nfrom fastapi import FastAPI\n\nfrom app.runtime_contract import CHROME_BRIDGE_BUNDLE_VERSION, SERVER_RUNTIME_VERSION, version_contract_payload\n\n\ndef test_v02287_login_ready_release_contract() -> None:\n    payload = version_contract_payload(FastAPI(version=SERVER_RUNTIME_VERSION))\n    assert SERVER_RUNTIME_VERSION == "0.22.87"\n    assert CHROME_BRIDGE_BUNDLE_VERSION == "0.8.37"\n    assert payload["server"]["runtime_aligned"] is True\n    assert "chatgpt-login-ready-admission-v137" in payload["server"]["feature_revision"]\n    assert "window-manager-filter-v137" in payload["server"]["feature_revision"]\n    assert "release-v02287" in payload["server"]["feature_revision"]\n    assert payload["features"]["chatgpt_login_ready_admission_v137"] is True\n    assert payload["features"]["window_manager_login_ready_filter_v137"] is True\n\n\ndef test_v02287_is_server_only_and_keeps_worker_bundle_0837() -> None:\n    payload = version_contract_payload(FastAPI(version=SERVER_RUNTIME_VERSION))\n    assert payload["chrome_bridge"]["bundle_version"] == "0.8.37"\n    assert "release-v0837" in payload["chrome_bridge"]["build_revision"]\n''', encoding='utf-8')
          PY
          if git diff --quiet -- app/runtime_contract.py tests; then
            echo 'No release sync changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/runtime_contract.py tests
          git commit -m 'release: prepare chat2api 0.22.87 login-ready admission'
          git push origin HEAD:release/login-ready-v02287
