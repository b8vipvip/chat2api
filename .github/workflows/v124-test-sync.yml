name: v124 test sync
on:
  push:
    branches: [feat/linux-device-single-authority-v124-20260911]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/linux-device-single-authority-v124-20260911
      - name: Sync assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_release_v02246_contract.py'); t=p.read_text(); old='assert features["linux_worker_device_console_v122"] is True'; assert t.count(old)==1; t=t.replace(old,'assert features["linux_worker_device_console_v122"] is False\n    assert features["linux_worker_console_v123"] is False\n    assert features["linux_worker_device_authority_v124"] is True\n    assert features["linux_worker_extension_autopair_v124"] is True'); p.write_text(t)
          p=Path('tests/test_worker_presentation_v64.py'); t=p.read_text(); old='    assert "autonomous MutationObservers" in source'; assert t.count(old)==1; t=t.replace(old,'    assert "install_linux_worker_device_authority_v124_patch(app)" in source\n    assert "install_linux_worker_device_console_v122_patch" not in source\n    assert "install_linux_worker_console_v123_patch" not in source'); p.write_text(t)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_release_v02246_contract.py tests/test_worker_presentation_v64.py
          git commit -m 'test: align assertions with Linux device authority v124'
          git push origin HEAD:feat/linux-device-single-authority-v124-20260911
