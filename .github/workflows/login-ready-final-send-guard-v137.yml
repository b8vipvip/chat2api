name: One-shot final ChatGPT login send guard v137

on:
  push:
    branches:
      - fix/login-ready-admission-v137

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/login-ready-admission-v137
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Apply final login send guard
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_login_ready_final_send_guard_v137.py
          python -m py_compile app/registry.py
          pytest -q tests/test_login_ready_admission_v137.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/registry.py tests/test_login_ready_admission_v137.py
          if git diff --cached --quiet; then
            echo "final login send guard already applied"
            exit 0
          fi
          git commit -m "fix: block generation dispatch after ChatGPT logout"
          git push origin HEAD:fix/login-ready-admission-v137
