name: v127 push validated source

on:
  push:
    branches:
      - feat/device-controller-shared-config-v127-20260912

permissions:
  contents: write

jobs:
  push-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/device-controller-shared-config-v127-20260912
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Replay validated v127 transformations
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          def execute(workflow: str, name: str) -> None:
              lines=Path(workflow).read_text(encoding='utf-8').splitlines()
              marker=f'      - name: {name}'
              start=lines.index(marker)
              run=next(i for i in range(start+1,len(lines)) if lines[i]=='        run: |')
              out=[]
              for line in lines[run+1:]:
                  if line.startswith('      - name: '): break
                  if line.startswith('          '): out.append(line[10:])
                  elif line.strip(): raise SystemExit(f'unexpected indentation: {line!r}')
                  else: out.append('')
              result=subprocess.run(['bash','-e','-c','\n'.join(out)+'\n'],text=True,check=False)
              if result.returncode: raise SystemExit(result.returncode)

          execute('.github/workflows/v127-retry2.yml','Replay v127 finalized transformations')
          execute('.github/workflows/v127-retry2.yml','Align final two snapshots')
          PY
      - name: Validate exact source snapshot
        run: |
          python -m pip install -q -e '.[dev]'
          python -m compileall -q app scripts tests
          bash -n scripts/bootstrap_linux_worker.sh
          bash -n scripts/linux_worker_device_controller_helper.sh
          node --check app/admin_linux_device_authority_v124.js
          pytest -q
      - name: Commit source excluding workflow files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app scripts tests Dockerfile .dockerignore
          git commit -m 'feat: finalize v127 shared device controller'
          git push origin HEAD:feat/device-controller-shared-config-v127-20260912
