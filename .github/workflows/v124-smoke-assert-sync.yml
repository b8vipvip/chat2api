name: v124 smoke assert sync
on:
  push:
    branches: [fix/linux-device-v124-runtime-install-20260911]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/linux-device-v124-runtime-install-20260911
      - name: Fix exact production smoke assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/production-image-smoke.yml')
          t=p.read_text(encoding='utf-8')
          old='          assert "worker_enrollment" not in presentation\n'
          new='          assert '\''"worker_enrollment",'\'' not in presentation\n'
          assert t.count(old)==1
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/production-image-smoke.yml
          git commit -m 'ci: check v124 readiness requirement precisely'
          git push origin HEAD:fix/linux-device-v124-runtime-install-20260911
