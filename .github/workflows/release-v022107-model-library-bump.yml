name: Release v0.22.107 model library bump

on:
  push:
    branches:
      - release/v0.22.107-model-library

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'release: align v0.22.107')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: release/v0.22.107-model-library
      - name: Align release contract
        shell: bash
        run: |
          set -euo pipefail
          git grep -Il -z '0.22.106' -- ':!*.png' ':!*.jpg' ':!*.jpeg' ':!*.gif' ':!*.zip' | xargs -0 -r sed -i 's/0\.22\.106/0.22.107/g'
          if git diff --quiet; then
            echo 'already aligned'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: align v0.22.107 model library runtime'
          git push origin HEAD:release/v0.22.107-model-library
