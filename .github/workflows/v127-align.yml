name: v127 align regression snapshots

on:
  push:
    branches:
      - feat/device-controller-shared-config-v127-20260912

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/device-controller-shared-config-v127-20260912
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Replay finalized source transformations
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          lines = Path('.github/workflows/v127-finalize.yml').read_text(encoding='utf-8').splitlines()

          def extract(name: str) -> str:
              marker = f'      - name: {name}'
              start = lines.index(marker)
              run = next(i for i in range(start + 1, len(lines)) if lines[i] == '        run: |')
              out = []
              for line in lines[run + 1:]:
                  if line.startswith('      - name: '):
                      break
                  if line.startswith('          '):
                      out.append(line[10:])
                  elif line.strip():
                      raise SystemExit(f'unexpected workflow indentation in {name}: {line!r}')
                  else:
                      out.append('')
              return '\n'.join(out) + '\n'

          for name in ('Finalize single-controller architecture', 'Rewrite production smoke for v127'):
              script = extract(name)
              completed = subprocess.run(['bash', '-e', '-c', script], text=True, check=False)
              if completed.returncode:
                  raise SystemExit(completed.returncode)
          PY
      - name: Align historical tests to v127 release contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Version snapshots that intentionally follow the latest formal runtime.
          version_files = [
              'tests/test_capacity_runtime_v22_24.py',
              'tests/test_release_v02246_contract.py',
              'tests/test_user_console_v104.py',
              'tests/test_v02254_worker_lifecycle_affinity_prompt_v86.py',
              'tests/test_v02273_strict_api_fifo.py',
          ]
          for name in version_files:
              path=Path(name); text=path.read_text(encoding='utf-8')
              text=text.replace('"0.22.82"','"0.22.83"')
              path.write_text(text,encoding='utf-8')

          for name in (
              'tests/test_linux_worker_bridge_binding_v22_3.py',
              'tests/test_linux_worker_proxy_login_gate_v22_8.py',
              'tests/test_linux_worker_remote_login_v22_2.py',
          ):
              path=Path(name); text=path.read_text(encoding='utf-8')
              text=text.replace('agent_version:"0.3.8"','agent_version:"0.3.9"')
              path.write_text(text,encoding='utf-8')

          path=Path('tests/test_linux_device_v124_runtime_activation.py'); text=path.read_text(encoding='utf-8')
          text=text.replace('install = installs.create(worker_name)','install = installs.create(device_name)')
          path.write_text(text,encoding='utf-8')

          path=Path('tests/test_linux_worker_console_v123.py'); text=path.read_text(encoding='utf-8')
          text=text.replace('assert \'"install_kind": "device" if slot == 1 else "worker_slot"\' in source','assert \'"install_kind": "device"\' in source\n    assert \'"device_controller_revision": 127\' in source')
          path.write_text(text,encoding='utf-8')

          path=Path('tests/test_linux_worker_device_console_v122.py'); text=path.read_text(encoding='utf-8')
          old='''def test_v124_no_longer_groups_devices_by_hostname_or_physical_key_guessing():\n    source = (ROOT / "app" / "linux_worker_device_authority_v124_patch.py").read_text(encoding="utf-8")\n    assert "_physical_key" not in source\n    assert "hostname" not in source\n    assert '\"device_id\": device_id' in source\n    assert '\"parent_device_id\": parent_device_id' in source\n    assert '\"device_authority_revision\": PATCH_REVISION' in source\n\n\ndef test_slot_installer_stays_isolated_and_reports_progress():\n    authority = (ROOT / "app" / "linux_worker_device_authority_v124_patch.py").read_text(encoding="utf-8")\n    wrapper = (ROOT / "scripts" / "linux_worker_slot_install_reported.sh").read_text(encoding="utf-8")\n    dockerfile = (ROOT / "Dockerfile").read_text(encoding="utf-8")\n    assert "linux_worker_slot_install_reported.sh" in authority\n    assert "/opt/chat2api-worker/scripts/linux_worker_slot_install.sh" in wrapper\n    assert "/api/workers/install-progress" in wrapper\n    assert 'report "installed" "complete"' in wrapper\n    assert "linux_worker_slot_install_reported.sh" in dockerfile\n    shell = subprocess.run(["bash", "-n", str(ROOT / "scripts" / "linux_worker_slot_install_reported.sh")], cwd=ROOT, capture_output=True, text=True, check=False, timeout=10)\n    assert shell.returncode == 0, shell.stderr\n'''
          new='''def test_v124_no_longer_groups_devices_by_hostname_or_physical_key_guessing():\n    source = (ROOT / "app" / "linux_worker_device_authority_v124_patch.py").read_text(encoding="utf-8")\n    assert "_physical_key" not in source\n    grouping = source.split("def _device_rows", 1)[1].split("def _create_controller_child", 1)[0]\n    assert "hostname" not in grouping\n    assert '\"device_id\": device_id' in source\n    assert '\"install_kind\": \"device\"' in source\n    assert '\"device_authority_revision\": PATCH_REVISION' in source\n\n\ndef test_retired_slot_installers_are_not_runtime_authorities_or_packaged():\n    authority = (ROOT / "app" / "linux_worker_device_authority_v124_patch.py").read_text(encoding="utf-8")\n    dockerfile = (ROOT / "Dockerfile").read_text(encoding="utf-8")\n    helper = (ROOT / "scripts" / "linux_worker_device_controller_helper.sh").read_text(encoding="utf-8")\n    assert "linux_worker_slot_install" not in authority\n    assert "slot_installations" not in authority\n    assert "linux_worker_slot_agent.py" not in dockerfile\n    assert "linux_worker_slot_install.sh" not in dockerfile\n    assert "linux_worker_slot_install_reported.sh" not in dockerfile\n    assert "provision) provision" in helper\n    assert "chat2api-xray.service" in helper\n    shell = subprocess.run(["bash", "-n", str(ROOT / "scripts" / "linux_worker_device_controller_helper.sh")], cwd=ROOT, capture_output=True, text=True, check=False, timeout=10)\n    assert shell.returncode == 0, shell.stderr\n'''
          if old not in text: raise SystemExit('device console historical block not found')
          path.write_text(text.replace(old,new,1),encoding='utf-8')

          path=Path('tests/test_linux_worker_initialize_v43.py'); text=path.read_text(encoding='utf-8')
          text=text.replace('assert "scripts/linux_worker_agent_v43.py" in patched','assert "scripts/linux_worker_device_controller.py" in patched',1)
          path.write_text(text,encoding='utf-8')

          path=Path('tests/test_linux_worker_online_upgrade_v22_25.py'); text=path.read_text(encoding='utf-8')
          text=text.replace('assert "${WORKER_DIR}/scripts/linux_worker_agent_v44.py" in patched','assert "${WORKER_DIR}/scripts/linux_worker_device_controller.py" in patched',1)
          text=text.replace('TARGET_AGENT_VERSION = "0.3.8"','TARGET_AGENT_VERSION = "0.3.9"')
          path.write_text(text,encoding='utf-8')

          path=Path('tests/test_linux_worker_isolated_manager_v126.py'); text=path.read_text(encoding='utf-8')
          start=text.index('def test_v126_release_contract()')
          text=text[:start]+'''def test_v127_release_contract() -> None:\n    runtime = source("app/runtime_contract.py")\n    manifest = source("chrome_extension/manifest.json")\n    controller = source("scripts/linux_worker_device_controller.py")\n    assert 'SERVER_RUNTIME_VERSION = "0.22.83"' in runtime\n    assert 'CHROME_BRIDGE_BUNDLE_VERSION = "0.8.35"' in runtime\n    assert '\"linux_worker_isolated_management_v126\": False' in runtime\n    assert '\"linux_worker_slot_isolated_ops_v126\": False' in runtime\n    assert '\"linux_worker_device_controller_agent_v127\": True' in runtime\n    assert '\"linux_worker_shared_device_pairing_v127\": True' in runtime\n    assert '\"linux_worker_shared_device_proxy_v127\": True' in runtime\n    assert '\"linux_worker_profile_only_isolation_v127\": True' in runtime\n    assert '\"version\": \"0.8.35\"' in manifest\n    assert 'AGENT_VERSION = "0.3.9"' in controller\n'''
          path.write_text(text,encoding='utf-8')

          # The old per-slot Agent architecture is no longer a runtime option.
          Path('tests/test_same_host_worker_slots.py').write_text('''from pathlib import Path\nimport subprocess\n\nROOT = Path(__file__).resolve().parents[1]\n\n\ndef test_device_controller_owns_one_socket_and_multiplexes_logical_workers():\n    controller=(ROOT/'scripts/linux_worker_device_controller.py').read_text(encoding='utf-8')\n    server=(ROOT/'app/linux_worker_patch.py').read_text(encoding='utf-8')\n    assert 'async with websockets.connect(config["websocket_url"]' in controller\n    assert '\"type\": \"worker.heartbeat\"' in controller\n    assert 'target_worker_id' in controller\n    assert 'controller_worker_id' in server\n    assert 'payload = {\"type\": \"command\"' in server\n\n\ndef test_extra_workers_share_proxy_and_only_get_profile_chrome_resources():\n    helper=(ROOT/'scripts/linux_worker_device_controller_helper.sh').read_text(encoding='utf-8')\n    docker=(ROOT/'Dockerfile').read_text(encoding='utf-8')\n    assert 'PROFILE_DIR="/home/chat2api/.config/chat2api-chrome-worker-$(printf \'%02d\' "$SLOT")"' in helper\n    assert 'PROXY_PORT=10808' in helper\n    assert 'DISPLAY_NUM=$((98 + SLOT))' in helper\n    assert 'CDP_PORT=$((9221 + SLOT))' in helper\n    assert 'Requires=chat2api-xray.service' in helper\n    assert 'chat2api-worker-agent-slot' not in helper\n    assert 'chat2api-xray-slot' not in helper\n    assert 'linux_worker_slot_agent.py' not in docker\n    assert 'linux_worker_slot_install.sh' not in docker\n    assert 'linux_worker_slot_chrome_launcher.sh' in docker\n\n\ndef test_controller_helper_syntax():\n    result=subprocess.run(['bash','-n',str(ROOT/'scripts/linux_worker_device_controller_helper.sh')],capture_output=True,text=True,check=False)\n    assert result.returncode==0,result.stderr\n''',encoding='utf-8')
          PY
      - name: Full validation
        run: |
          python -m pip install -q -e '.[dev]'
          python -m compileall -q app scripts
          bash -n scripts/bootstrap_linux_worker.sh
          bash -n scripts/linux_worker_device_controller_helper.sh
          node --check app/admin_linux_device_authority_v124.js
          pytest -q
      - name: Commit v127 source and aligned tests
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app scripts tests Dockerfile .dockerignore .github/workflows/production-image-smoke.yml
          git commit -m 'feat: finalize v127 shared device controller'
          git push origin HEAD:feat/device-controller-shared-config-v127-20260912
