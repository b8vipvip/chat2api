name: Fix v0.22.101 CI contracts

on:
  push:
    branches:
      - fix/v0.22.101-request-terminal-windows-ui

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v0.22.101-request-terminal-windows-ui
          fetch-depth: 0
      - name: Migrate runtime and regression contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path_name: str, old: str, new: str, expected_min: int = 1) -> None:
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count < expected_min:
                  raise SystemExit(f'{path_name}: expected at least {expected_min} occurrence(s) of {old!r}, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')
              print(f'{path_name}: replaced {count} x {old!r}')

          # v55 is a compatibility-family key. v57 is the current implementation,
          # so both current and legacy runtime contracts must accept >=55.
          replace('chrome_extension/content_runtime_contract_v48.js', 'Number(networkRecovery?.version || 0) === 55', 'Number(networkRecovery?.version || 0) >= 55', 2)
          replace('chrome_extension/content_runtime_contract_v48.js', 'conversation-sse-evidence-v56-parser-v63', 'conversation-sse-evidence-v57-parser-v63')
          replace('chrome_extension/content_runtime_contract_v71.js', 'implementation reports version 56', 'implementation reports version 57')
          replace('chrome_extension/content_runtime_contract_v71.js', 'conversation-sse-evidence-v56-parser-v63', 'conversation-sse-evidence-v57-parser-v63')

          # Network evidence contract moved from v56 to v57 while retaining the
          # content_network_stream_recovery_v55.js compatibility filename.
          network_tests = [
              'tests/test_network_stream_progress_v54.py',
              'tests/test_response_progress_v22_34.py',
              'tests/test_response_stream_tool_isolation_v48.py',
              'tests/test_runtime_preflight_contract_v147.py',
              'tests/test_runtime_preflight_destructive_guard_v147.py',
              'tests/test_runtime_preflight_network_compat_v147.py',
              'tests/test_terminal_text_authority_v144.py',
          ]
          for name in network_tests:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace('v56', 'v57').replace('version: 56', 'version: 57').replace('version 56', 'version 57')
              path.write_text(text, encoding='utf-8')

          replace('tests/test_runtime_lifecycle_multimodal_v79.py', 'submission_liveness_revision: 79', 'submission_liveness_revision: 80')
          replace('tests/test_v02249_linux_response_lifecycle.py', 'response_terminal_settle_revision: 81', 'response_terminal_settle_revision: 82')
          replace('tests/test_window_affinity_submit_v87.py', 'dispatchEnter(findComposer())', 'dispatchEnter(composerHoldingPrompt(active) || active.promptComposer || findComposer())')

          # Windows popup was intentionally simplified. Keep tests focused on the
          # new read-only/status surface and assert removed control semantics stay removed.
          path = Path('tests/test_extension_network_linux_v26.py')
          text = path.read_text(encoding='utf-8')
          old = '''    for token in (\n        'linux: "Linux"',\n        'status === "external"',\n        'status === "china-mainland"',\n        "已允许主动预热",\n        "禁止主动预热",\n    ):\n        assert token in popup\n'''
          new = '''    for token in (\n        'linux: "Linux"',\n        'status === "external"',\n        'status === "china-mainland"',\n        "Windows Worker",\n        "窗口自动管理",\n    ):\n        assert token in popup\n    assert "已允许主动预热" not in popup\n    assert "禁止主动预热" not in popup\n'''
          if old not in text:
              raise SystemExit('popup network-state test block changed unexpectedly')
          path.write_text(text.replace(old, new), encoding='utf-8')

          replace('tests/test_login_readiness_v27.py', 'ChatGPT：已登录，可用', '已登录 · Composer 可用')
          replace('tests/test_login_readiness_v27.py', 'ChatGPT：需要登录', '需要登录 · 请在可见 ChatGPT 窗口完成认证')
          replace('tests/test_login_readiness_v27.py', 'Composer 已确认', 'Composer 已确认可用')
          replace('tests/test_page_smoke_v22.py', '运行页面 Smoke Test（只读）', '运行只读页面诊断')
          replace('tests/test_v10.py', 'assert \'id="clearRuntimeLog"\' in html', 'assert \'id="clearRuntimeLog"\' not in html')
          replace('tests/test_v14.py', 'assert "Chrome Bridge · v" in script', 'assert "platformLabel(settings)" in script')

          # Ensure the migration itself encodes the intended production invariants.
          v48 = Path('chrome_extension/content_runtime_contract_v48.js').read_text(encoding='utf-8')
          v71 = Path('chrome_extension/content_runtime_contract_v71.js').read_text(encoding='utf-8')
          request = Path('chrome_extension/content_request_v6.js').read_text(encoding='utf-8')
          assert 'Number(networkRecovery?.version || 0) >= 55' in v48
          assert 'conversation-sse-evidence-v57-parser-v63' in v48
          assert 'conversation-sse-evidence-v57-parser-v63' in v71
          assert 'submission_liveness_revision: 80' in request
          assert 'response_terminal_settle_revision: 82' in request
          assert 'dispatchEnter(composerHoldingPrompt(active) || active.promptComposer || findComposer())' in request
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add chrome_extension tests
          git diff --cached --check
          git commit -m "fix: align v0.22.101 runtime and regression contracts"
          git push origin HEAD:fix/v0.22.101-request-terminal-windows-ui
