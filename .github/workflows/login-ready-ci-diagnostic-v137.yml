name: Login-ready CI diagnostic v137

on:
  push:
    branches:
      - fix/login-ready-admission-v137

permissions:
  contents: read

jobs:
  pytest-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/login-ready-admission-v137
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run pytest fail-fast verbose
        run: pytest -vv --maxfail=1
