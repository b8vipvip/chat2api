name: Release version contract sync

on:
  push:
    branches:
      - release/v02291-v0840

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Synchronize release contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          text_suffixes = {'.py', '.js', '.mjs', '.json', '.yml', '.yaml', '.md', '.toml', '.sh', '.ps1', '.txt'}
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.name == 'release-version-sync.yml':
                  continue
              if path.suffix.lower() not in text_suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text.replace('0.8.39', '0.8.40').replace('0.22.90', '0.22.91')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          runtime = Path('app/runtime_contract.py')
          text = runtime.read_text(encoding='utf-8')
          text = text.replace('PREVIOUS_SERVER_RUNTIME_VERSION = "0.22.89"', 'PREVIOUS_SERVER_RUNTIME_VERSION = "0.22.90"')
          text = text.replace('PREVIOUS_PREVIOUS_SERVER_RUNTIME_VERSION = "0.22.88"', 'PREVIOUS_PREVIOUS_SERVER_RUNTIME_VERSION = "0.22.89"')
          text = text.replace('PREVIOUS_PREVIOUS_PREVIOUS_SERVER_RUNTIME_VERSION = "0.22.87"', 'PREVIOUS_PREVIOUS_PREVIOUS_SERVER_RUNTIME_VERSION = "0.22.88"')
          text = text.replace('qnbot-orphan-owner-recovery-v140-release-v02291"', 'qnbot-orphan-owner-recovery-v140-bot2-responses-continuation-v141-worker-observability-v142-responses-terminal-integrity-v142-release-v02291"')
          text = text.replace('qnbot-orphan-owner-recovery-v140-release-v0840"', 'qnbot-orphan-owner-recovery-v140-bot2-responses-continuation-v141-worker-observability-v142-responses-terminal-integrity-v142-release-v0840"')
          anchor = '            "responses_tool_stream_v118": True,\n'
          if '"responses_tool_continuation_v141"' not in text:
              text = text.replace(anchor, anchor + '            "responses_tool_continuation_v141": True,\n            "responses_terminal_integrity_v142": True,\n')
          anchor2 = '            "window_observer_v90": True,\n'
          if '"window_observer_terminal_clear_v90"' not in text:
              text = text.replace(anchor2, anchor2 + '            "window_observer_terminal_clear_v90": True,\n')
          anchor3 = '            "linux_worker_shared_device_proxy_v127": True,\n'
          if '"request_device_identity_sibling_v142"' not in text:
              text = text.replace(anchor3, anchor3 + '            "request_device_identity_sibling_v142": True,\n')
          runtime.write_text(text, encoding='utf-8')

          smoke = Path('.github/workflows/production-image-smoke.yml')
          text = smoke.read_text(encoding='utf-8')
          marker = '          assert payload[\'features\'][\'qnbot_orphan_owner_recovery_v140\'] is True\n'
          if "responses_tool_continuation_v141" not in text:
              text = text.replace(marker, marker + "          assert payload['features']['responses_tool_continuation_v141'] is True\n          assert payload['features']['responses_terminal_integrity_v142'] is True\n          assert payload['features']['window_observer_terminal_clear_v90'] is True\n          assert payload['features']['request_device_identity_sibling_v142'] is True\n")
          smoke.write_text(text, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A ':!.github/workflows/release-version-sync.yml'
          git diff --cached --quiet && exit 0
          git commit -m "release: chat2api v0.22.91 worker v0.8.40"
          git push origin HEAD:release/v02291-v0840
