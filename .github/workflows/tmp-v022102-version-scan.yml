name: Temporary v0.22.102 version scan

on:
  push:
    branches:
      - release/v0.22.102
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List active 0.22.101 references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          roots = [Path('app'), Path('chrome_extension'), Path('tests'), Path('.github/workflows')]
          ignored = {Path('.github/workflows/tmp-v022102-version-scan.yml')}
          hits = 0
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(p for p in root.rglob('*') if p.is_file()):
                  if path in ignored:
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  for lineno, line in enumerate(text.splitlines(), 1):
                      if '0.22.101' in line:
                          hits += 1
                          print(f'{path}:{lineno}:{line.strip()}')
          print(f'TOTAL_HITS={hits}')
          PY
