name: v124 apply

on:
  push:
    branches:
      - feat/linux-device-single-authority-v124-20260911

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/linux-device-single-authority-v124-20260911
          fetch-depth: 0
      - name: Reuse the reviewed v124 transform
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/v124-finalize.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = text.index(marker) + len(marker)
          end = text.index("\n          PY", start)
          lines = text[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          exec(compile(script, '<v124-finalize>', 'exec'), {})
          PY
      - name: Validate parsers
        run: |
          python -m py_compile app/linux_worker_device_authority_v124_patch.py app/worker_presentation_v64_patch.py scripts/linux_worker_extension_pair.py
          node --check app/admin_linux_device_authority_v124.js
          bash -n scripts/bootstrap_linux_worker.sh
          bash -n scripts/linux_worker_slot_install.sh
      - name: Commit finalized contract
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app chrome_extension scripts Dockerfile .dockerignore tests
          git commit -m 'release: finalize Linux device authority v124 contract'
          git push origin HEAD:feat/linux-device-single-authority-v124-20260911
