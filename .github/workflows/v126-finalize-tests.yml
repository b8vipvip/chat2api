name: v126 finalize release snapshot tests

on:
  push:
    branches:
      - feat/linux-worker-isolated-manager-v126-20260912

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/linux-worker-isolated-manager-v126-20260912
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Align historical snapshot assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'tests/test_linux_worker_bridge_binding_v22_3.py': [
                  ('agent_version:"0.3.2"', 'agent_version:"0.3.8"'),
              ],
              'tests/test_linux_worker_proxy_login_gate_v22_8.py': [
                  ('agent_version:"0.3.2"', 'agent_version:"0.3.8"'),
              ],
              'tests/test_linux_worker_remote_login_v22_2.py': [
                  ('agent_version:"0.3.2"', 'agent_version:"0.3.8"'),
              ],
              'tests/test_linux_worker_console_v123.py': [
                  ("    assert '管理设备 Worker' in source\n", "    assert '管理设备 Worker' not in source\n    assert '<th>Worker版本</th>' in source\n    assert 'data-manage-device' in source\n"),
              ],
          }
          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'{name}: expected token not found: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Validate full suite
        run: |
          python -m pip install -q -e '.[dev]'
          node tests/runtime_preflight_refresh_v71.mjs
          pytest -q
      - name: Commit aligned tests
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_linux_worker_bridge_binding_v22_3.py tests/test_linux_worker_proxy_login_gate_v22_8.py tests/test_linux_worker_remote_login_v22_2.py tests/test_linux_worker_console_v123.py
          git diff --cached --quiet && exit 0
          git commit -m 'test: align v126 release snapshots'
          git push origin HEAD:feat/linux-worker-isolated-manager-v126-20260912
