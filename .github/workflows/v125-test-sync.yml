name: v125 runtime assertion sync

on:
  push:
    branches:
      - fix/linux-device-https-origin-v125-20260912

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/linux-device-https-origin-v125-20260912
      - name: Update only current-runtime assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              'tests/test_capacity_queue_v57.py',
              'tests/test_generation_backend_health_v54.py',
              'tests/test_release_proxy_health_v22_38.py',
              'tests/test_request_hygiene_worker_toggle_v46.py',
              'tests/test_runtime_lifecycle_multimodal_v79.py',
              'tests/test_single_response_observer_v53.py',
              'tests/test_v02249_linux_response_lifecycle.py',
              'tests/test_worker_lifecycle_retry_quarantine_v50.py',
          ]
          old = 'SERVER_RUNTIME_VERSION = "0.22.76"'
          new = 'SERVER_RUNTIME_VERSION = "0.22.81"'
          changed = 0
          for name in files:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{name}: expected exactly one stale current-runtime assertion, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              changed += 1
          if changed != 8:
              raise SystemExit(f'expected 8 files, changed {changed}')
          PY
      - name: Commit assertion sync
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_capacity_queue_v57.py tests/test_generation_backend_health_v54.py tests/test_release_proxy_health_v22_38.py tests/test_request_hygiene_worker_toggle_v46.py tests/test_runtime_lifecycle_multimodal_v79.py tests/test_single_response_observer_v53.py tests/test_v02249_linux_response_lifecycle.py tests/test_worker_lifecycle_retry_quarantine_v50.py
          git commit -m 'test: align runtime assertions with 0.22.81'
          git push origin HEAD:fix/linux-device-https-origin-v125-20260912
