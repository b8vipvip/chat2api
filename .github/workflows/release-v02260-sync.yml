name: Release v0.22.60 assertion sync

on:
  push:
    branches:
      - release/v0.22.60-upload-quota-v91

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[release-v02260-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v0.22.60-upload-quota-v91
      - name: Align runtime and Worker release surfaces
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          direct = [
              Path('app/runtime_contract.py'),
              Path('chrome_extension/manifest.json'),
              Path('chrome_extension/content_bundle_marker_v48.js'),
              Path('chrome_extension/background_runtime_preflight_v48.js'),
              Path('chrome_extension/content_runtime_contract_v48.js'),
          ]
          for path in direct:
              text = path.read_text(encoding='utf-8')
              text = text.replace('0.22.59', '0.22.60')
              text = text.replace('0.8.27', '0.8.28')
              if path.name == 'runtime_contract.py':
                  text = text.replace('admin-navigation-bounded-v90-release-v02260', 'admin-navigation-bounded-v90-file-upload-quota-v91-release-v02260')
                  text = text.replace('admin-navigation-bounded-v90-release-v02259', 'admin-navigation-bounded-v90-file-upload-quota-v91-release-v02260')
              path.write_text(text, encoding='utf-8')

          # Current-version assertions are contracts rather than history. Keep
          # them aligned without rewriting changelog/docs describing old releases.
          for path in Path('tests').glob('*.py'):
              text = path.read_text(encoding='utf-8')
              if '0.22.59' in text or '0.8.27' in text:
                  path.write_text(text.replace('0.22.59', '0.22.60').replace('0.8.27', '0.8.28'), encoding='utf-8')
          PY
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/release-v02260-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'release: align v0.22.60 Worker 0.8.28 assertions [release-v02260-sync]'
          git push origin HEAD:release/v0.22.60-upload-quota-v91
