name: Temporary v0.22.50 contract alignment

on:
  push:
    branches:
      - fix/worker-window-vision-download-v82-20260903

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/worker-window-vision-download-v82-20260903
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Align release contracts and runtime identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Version contracts are already aligned by the previous successful pass.
          # Keep this pass narrowly focused on the last historical middleware that
          # can still overwrite modern diagnostic runtime identity.
          v211_path = Path("app/v21_1_patch.py")
          v211 = v211_path.read_text(encoding="utf-8")
          old = '''            if isinstance(payload, dict):
                          payload["version"] = PATCH_VERSION
                          if "server_version" in payload or path.endswith("/log"):
                              payload["server_version"] = PATCH_VERSION
                          if path == "/api/admin/overview":
          '''
          new = '''            if isinstance(payload, dict):
                          # v21.1 owns concurrency compatibility only. Runtime identity is
                          # owned by runtime_contract and must never be rewritten to 0.21.1.
                          if path == "/api/admin/overview":
          '''
          if old not in v211:
              raise SystemExit("expected v21.1 stale runtime stamp block not found")
          v211_path.write_text(v211.replace(old, new, 1), encoding="utf-8")

          regression_path = Path("tests/test_v02250_attachment_window_telemetry.py")
          regression = regression_path.read_text(encoding="utf-8")
          marker = '    assert \'payload["server_version"] = SERVER_RUNTIME_VERSION\' in runtime_source\n'
          addition = '    assert \'payload["server_version"] = PATCH_VERSION\' not in text("app/v21_1_patch.py")\n'
          if addition not in regression:
              if marker not in regression:
                  raise SystemExit("v0.22.50 runtime ownership assertion marker not found")
              regression = regression.replace(marker, marker + addition, 1)
              regression_path.write_text(regression, encoding="utf-8")
          PY
      - name: Full test suite
        run: pytest -q
      - name: Commit aligned contracts
        shell: bash
        run: |
          if git diff --quiet -- app/v21_1_patch.py tests/test_v02250_attachment_window_telemetry.py; then
            echo 'No alignment changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/v21_1_patch.py tests/test_v02250_attachment_window_telemetry.py
          git commit -m 'Stop v21.1 from stamping modern runtime identity'
          git push origin HEAD:fix/worker-window-vision-download-v82-20260903
