name: Temporary v0.22.47 stale test fix

on:
  push:
    branches:
      - fix/runtime-lifecycle-multimodal-v79-20260903

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/runtime-lifecycle-multimodal-v79-20260903
          fetch-depth: 0
      - name: Align remaining release assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          patches = {
              'tests/test_response_stream_tool_isolation_v48.py': [
                  ('payload["chrome_bridge"]["bundle_version"] == "0.8.18"', 'payload["chrome_bridge"]["bundle_version"] == "0.8.19"'),
              ],
              'tests/runtime_preflight_refresh_v71.mjs': [
                  ('loading.state.last?.marker?.bundle, "0.8.18"', 'loading.state.last?.marker?.bundle, "0.8.19"'),
              ],
          }
          for filename, pairs in patches.items():
              p = Path(filename)
              text = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'{filename}: missing {old!r}')
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/tmp-v02247-stale-test-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Align remaining v0.22.47 release assertions"
          git push origin HEAD:fix/runtime-lifecycle-multimodal-v79-20260903
