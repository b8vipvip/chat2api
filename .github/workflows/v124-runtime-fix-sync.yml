name: v124 runtime fix sync

on:
  push:
    branches: [fix/linux-device-v124-runtime-install-20260911]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/linux-device-v124-runtime-install-20260911
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bump server runtime and test snapshots
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('app/runtime_contract.py')
          text = runtime.read_text(encoding='utf-8')
          old = '''SERVER_RUNTIME_VERSION = "0.22.79"
          PREVIOUS_SERVER_RUNTIME_VERSION = "0.22.78"
          PREVIOUS_PREVIOUS_SERVER_RUNTIME_VERSION = "0.22.77"
          PREVIOUS_PREVIOUS_PREVIOUS_SERVER_RUNTIME_VERSION = "0.22.76"
          PREVIOUS_PREVIOUS_PREVIOUS_PREVIOUS_SERVER_RUNTIME_VERSION = "0.22.75"'''.replace('          ', '')
          new = '''SERVER_RUNTIME_VERSION = "0.22.80"
          PREVIOUS_SERVER_RUNTIME_VERSION = "0.22.79"
          PREVIOUS_PREVIOUS_SERVER_RUNTIME_VERSION = "0.22.78"
          PREVIOUS_PREVIOUS_PREVIOUS_SERVER_RUNTIME_VERSION = "0.22.77"
          PREVIOUS_PREVIOUS_PREVIOUS_PREVIOUS_SERVER_RUNTIME_VERSION = "0.22.76"'''.replace('          ', '')
          assert text.count(old) == 1
          text = text.replace(old, new)
          marker = 'release-v02279"'
          assert text.count(marker) == 1
          text = text.replace(marker, 'release-v02279-v124-runtime-activation-fix-release-v02280"')
          runtime.write_text(text, encoding='utf-8')

          for path in Path('tests').rglob('*'):
              if not path.is_file() or path.suffix not in {'.py', '.js', '.mjs'}:
                  continue
              value = path.read_text(encoding='utf-8')
              if '0.22.79' in value:
                  path.write_text(value.replace('0.22.79', '0.22.80'), encoding='utf-8')
          PY
      - name: Validate focused fix
        run: |
          python -m pip install -r requirements.txt pytest >/dev/null
          python -m py_compile app/linux_worker_device_authority_v124_patch.py app/worker_presentation_v64_patch.py
          python -m pytest -q tests/test_linux_device_v124_runtime_activation.py tests/test_linux_worker_console_v123.py tests/test_linux_worker_device_console_v122.py
      - name: Commit sync
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/runtime_contract.py tests
          git commit -m 'release: bump v124 runtime activation fix to 0.22.80'
          git push origin HEAD:fix/linux-device-v124-runtime-install-20260911
