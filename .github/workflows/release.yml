name: Release

on:
  workflow_run:
    workflows:
      - CI
      - Production image smoke
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Validated main commit to release; defaults to current main'
        required: false
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: chat2api-release-validated
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve candidate source commit
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            sha="$WORKFLOW_SHA"
          elif [[ -n "$INPUT_SHA" ]]; then
            sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$INPUT_SHA" --jq '.sha')"
          else
            sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          fi

          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          compare="$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...$main_sha")"
          status="$(jq -r '.status' <<<"$compare")"
          if [[ "$status" != "ahead" && "$status" != "identical" ]]; then
            echo "Release candidate $sha is not an ancestor of current main $main_sha (status=$status)." >&2
            exit 1
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Release candidate: $sha"

      - name: Verify both post-merge validations
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Validate by immutable candidate SHA, not by trigger type. GPTAuto
          # Reconcile may have to dispatch these gates explicitly after a merge
          # performed with GITHUB_TOKEN, while a normal human merge may produce
          # push-triggered runs. Both are valid evidence when head_sha == SHA.
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=100")"
          ci="$(jq -r '[.workflow_runs[] | select(.name=="CI")] | sort_by(.run_started_at // .created_at, .id) | reverse | .[0] | if . == null then "missing" else (.status + ":" + (.conclusion // "")) end' <<<"$runs")"
          smoke="$(jq -r '[.workflow_runs[] | select(.name=="Production image smoke")] | sort_by(.run_started_at // .created_at, .id) | reverse | .[0] | if . == null then "missing" else (.status + ":" + (.conclusion // "")) end' <<<"$runs")"
          echo "validation snapshot: CI=${ci} | Production image smoke=${smoke}"

          for result in "$ci" "$smoke"; do
            case "$result" in
              completed:success|missing|queued:|in_progress:|waiting:|pending:|requested:)
                ;;
              completed:*)
                echo "required post-merge validation failed: ${result}" >&2
                exit 1
                ;;
            esac
          done

          if [[ "$ci" == "completed:success" && "$smoke" == "completed:success" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Both required validations passed for ${SHA}."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "The peer validation is not complete yet; this event-driven run exits without waiting."
          fi

      - name: Checkout validated source
        if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 0

      - name: Resolve and validate release versions
        if: steps.gate.outputs.ready == 'true'
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          from pathlib import Path

          runtime = Path("app/runtime_contract.py").read_text(encoding="utf-8")
          package = Path("app/__init__.py").read_text(encoding="utf-8")
          project = Path("pyproject.toml").read_text(encoding="utf-8")
          manifest = json.loads(Path("chrome_extension/manifest.json").read_text(encoding="utf-8"))
          marker = Path("chrome_extension/content_bundle_marker_v48.js").read_text(encoding="utf-8")
          preflight = Path("chrome_extension/background_runtime_preflight_v48.js").read_text(encoding="utf-8")
          contract = Path("chrome_extension/content_runtime_contract_v48.js").read_text(encoding="utf-8")

          def one(pattern: str, text: str, label: str) -> str:
              match = re.search(pattern, text)
              if not match:
                  raise SystemExit(f"missing {label}")
              return match.group(1)

          server = one(r'SERVER_RUNTIME_VERSION = "([^"]+)"', runtime, "server runtime")
          bundle = one(r'CHROME_BRIDGE_BUNDLE_VERSION = "([^"]+)"', runtime, "bundle runtime")
          package_version = one(r'__version__ = "([^"]+)"', package, "package version")
          project_version = one(r'version = "([^"]+)"', project, "project version")

          if manifest.get("version") != bundle:
              raise SystemExit(f"manifest {manifest.get('version')} != runtime bundle {bundle}")
          for label, text in (("marker", marker), ("preflight", preflight), ("contract", contract)):
              if bundle not in text:
                  raise SystemExit(f"{label} does not advertise bundle {bundle}")
          if package_version != project_version:
              raise SystemExit(f"package {package_version} != pyproject {project_version}")

          print(f"server={server}")
          print(f"bundle={bundle}")
          print(f"package={package_version}")
          print(f"tag=v{server}")
          PY

      - name: Check whether release already exists
        if: steps.gate.outputs.ready == 'true'
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.gate.outputs.ready == 'true' && steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SERVER: ${{ steps.version.outputs.server }}
          BUNDLE: ${{ steps.version.outputs.bundle }}
          PACKAGE: ${{ steps.version.outputs.package }}
          SOURCE_SHA: ${{ steps.candidate.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<EOF
          ## chat2api ${SERVER}

          - Server Runtime: ${SERVER}
          - Chrome Worker Bundle: ${BUNDLE}
          - Python package: ${PACKAGE}
          - Source commit: ${SOURCE_SHA}

          This release is created automatically from the validated `main` runtime contract. GitHub-generated notes below contain the merged changes since the previous release.
          EOF
          gh release create "$TAG" \
            --target "$SOURCE_SHA" \
            --title "chat2api v${SERVER}" \
            --notes-file /tmp/release-notes.md \
            --generate-notes

      - name: Release already exists
        if: steps.gate.outputs.ready == 'true' && steps.existing.outputs.exists == 'true'
        run: echo "${{ steps.version.outputs.tag }} already exists; no duplicate release created."

      - name: Peer validation still pending
        if: steps.gate.outputs.ready != 'true'
        run: echo "No runner polling is needed; the peer workflow completion will trigger Release again."
