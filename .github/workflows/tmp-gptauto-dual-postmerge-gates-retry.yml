name: Temporary GPTAuto dual post-merge gates retry

on:
  push:
    branches:
      - fix/gptauto-dual-postmerge-gates

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gptauto-dual-postmerge-gates
          fetch-depth: 0
      - name: Stage patched Reconcile as non-workflow blob
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          cp .github/workflows/gptauto-reconcile.yml gptauto-reconcile.patched.yml
          git checkout -- .github/workflows/gptauto-reconcile.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gptauto-reconcile.patched.yml
          git commit -m "chore: stage patched Reconcile blob"
          git push origin HEAD:fix/gptauto-dual-postmerge-gates
