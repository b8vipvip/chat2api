name: v125 Linux installer HTTPS hotfix

on:
  push:
    branches:
      - fix/linux-device-https-origin-v125-20260912

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/linux-device-https-origin-v125-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply hotfix transform
        run: python scripts/apply_v125_hotfix.py
      - name: Validate syntax
        run: python -m py_compile app/linux_worker_device_authority_v124_patch.py app/runtime_contract.py
      - name: Commit hotfix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/linux_worker_device_authority_v124_patch.py app/runtime_contract.py .github/workflows/production-image-smoke.yml tests
          git commit -m 'fix: generate Linux install commands with public HTTPS origin'
          git push origin HEAD:fix/linux-device-https-origin-v125-20260912
