name: Temporary v0.22.47 runtime lifecycle fix

on:
  push:
    branches:
      - fix/runtime-lifecycle-multimodal-v79-20260903

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/runtime-lifecycle-multimodal-v79-20260903
          fetch-depth: 0
      - name: Apply deterministic lifecycle patch
        run: python scripts/tmp_v02247_fix.py
      - name: Commit fixes and remove temporary migration files
        shell: bash
        run: |
          rm -f .github/workflows/tmp-v02247-runtime-lifecycle-fix.yml
          rm -f scripts/tmp_v02247_fix.py
          rm -f .chat2api-v02247-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix active request lifecycle and multimodal settlement; release v0.22.47"
          git push origin HEAD:fix/runtime-lifecycle-multimodal-v79-20260903
