name: Temporary v0.22.47 runtime lifecycle fix

on:
  push:
    branches:
      - fix/runtime-lifecycle-multimodal-v79-20260903

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/runtime-lifecycle-multimodal-v79-20260903
          fetch-depth: 0
      - name: Apply lifecycle and multimodal fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Server-side disable lease: never collapse windows or cut transport
          # while the broker still owns live requests for this Worker.
          path = Path('app/worker_disable_authority_patch.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('PATCH_VERSION = "0.22.42"', 'PATCH_VERSION = "0.22.47"', 1)
          anchor = '''    async def collapse_managed_windows(client_id: str) -> dict[str, Any]:\n'''
          insert = '''    def active_request_ids(client_id: str) -> list[str]:\n        broker = getattr(app.state, "broker", None)\n        if broker is None:\n            return []\n        active_by_client = getattr(broker, "client_active_requests", None)\n        if isinstance(active_by_client, dict):\n            active = active_by_client.get(client_id)\n            if isinstance(active, dict):\n                return [str(request_id) for request_id in active.keys()]\n            if isinstance(active, (set, list, tuple)):\n                return [str(request_id) for request_id in active]\n        request_map = getattr(broker, "client_requests", None)\n        request_id = request_map.get(client_id) if isinstance(request_map, dict) else None\n        if request_id and request_id in getattr(broker, "requests", {}):\n            return [str(request_id)]\n        return []\n\n    def require_disable_lease(client_id: str) -> None:\n        active = active_request_ids(client_id)\n        if not active:\n            return\n        logger.warning(\n            "Worker disable blocked by active-request lease client=%s active_requests=%s",\n            client_id,\n            active,\n        )\n        raise HTTPException(\n            409,\n            {\n                "message": "Worker still has active requests; disable is blocked until every request reaches a terminal event",\n                "code": "worker_active_request_lease",\n                "active_request_count": len(active),\n                "active_request_ids": active[:20],\n                "retryable": True,\n            },\n        )\n\n    async def collapse_managed_windows(client_id: str) -> dict[str, Any]:\n        require_disable_lease(client_id)\n'''
          if anchor not in text:
              raise SystemExit('worker_disable_authority_patch.py: collapse anchor missing')
          text = text.replace(anchor, insert, 1)
          old = '''    async def disable_client(client_id: str) -> dict[str, Any]:\n        client_id = str(client_id or "")\n        if client_id not in registry.clients:\n            raise HTTPException(404, "Unknown extension ID")\n        control = await collapse_managed_windows(client_id)\n'''
          new = '''    async def disable_client(client_id: str) -> dict[str, Any]:\n        client_id = str(client_id or "")\n        if client_id not in registry.clients:\n            raise HTTPException(404, "Unknown extension ID")\n        require_disable_lease(client_id)\n        control = await collapse_managed_windows(client_id)\n'''
          if old not in text:
              raise SystemExit('worker_disable_authority_patch.py: disable anchor missing')
          text = text.replace(old, new, 1)
          text = text.replace('''        "persist_worker_switch": persist_worker_switch,\n''', '''        "persist_worker_switch": persist_worker_switch,\n        "active_request_ids": active_request_ids,\n        "require_disable_lease": require_disable_lease,\n''', 1)
          path.write_text(text, encoding='utf-8')

          # 2) Extension-side defence in depth.
          path = Path('chrome_extension/background_worker_master_switch_v61.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace('''  const ROUTER_KEY = "__CHAT2API_CONVERSATION_ROUTING_V1__";\n  const WARM_KEY = "__CHAT2API_CONVERSATION_WARM_POOL_V2__";\n''', '''  const ROUTER_KEY = "__CHAT2API_CONVERSATION_ROUTING_V1__";\n  const DISPATCH_KEY = "__CHAT2API_CONVERSATION_DISPATCH_V1__";\n  const WARM_KEY = "__CHAT2API_CONVERSATION_WARM_POOL_V2__";\n''', 1)
          anchor = '''  async function handleDisable(message) {\n    try {\n'''
          insert = '''  function activeRequestLease() {\n    const dispatch = globalThis[DISPATCH_KEY];\n    const requestTabs = dispatch?.requestTabs;\n    if (!(requestTabs instanceof Map) || requestTabs.size <= 0) return { count: 0, ids: [] };\n    return { count: requestTabs.size, ids: [...requestTabs.keys()].map(String).slice(0, 20) };\n  }\n\n  async function handleDisable(message) {\n    try {\n      const lease = activeRequestLease();\n      if (lease.count > 0) {\n        return emitResult(message, false, {\n          blocked: true,\n          retryable: true,\n          active_request_count: lease.count,\n          active_request_ids: lease.ids,\n          lease_revision: 79,\n        }, "Worker has active requests; disable is blocked until terminal completion");\n      }\n'''
          if anchor not in text:
              raise SystemExit('background_worker_master_switch_v61.js: handleDisable anchor missing')
          text = text.replace(anchor, insert, 1)
          text = text.replace('''        worker_master_switch_revision: 62,\n''', '''        worker_master_switch_revision: 62,\n        active_request_disable_lease_revision: 79,\n''', 1)
          path.write_text(text, encoding='utf-8')

          # 3) A cleared composer is weak evidence, not submission confirmation.
          path = Path('chrome_extension/content_request_v6.js')
          text = path.read_text(encoding='utf-8')
          old = '''    const user = currentUserTurn(active);\n    if (user) return { reason: "current-user-turn-visible", composerCleared: composerText(findComposer()).length === 0, generating: false, current };\n    if (!composerText(findComposer())) return { reason: "composer-cleared", composerCleared: true, generating: false, current };\n    return null;\n'''
          new = '''    const user = currentUserTurn(active);\n    if (user) return { reason: "current-user-turn-visible", composerCleared: composerText(findComposer()).length === 0, generating: false, current };\n    // A cleared composer is only weak evidence: ChatGPT may consume the draft\n    // while an attachment is still settling or while submission is rejected.\n    // Never promote that UI mutation to a successful API submission by itself.\n    return null;\n'''
          if old not in text:
              raise SystemExit('content_request_v6.js: weak composer confirmation anchor missing')
          text = text.replace(old, new, 1)
          old = '''    const confirmed = await waitAfterSend(active, "late", 20000);\n    if (confirmed) return confirmed;\n    throw new Error("ChatGPT prompt left the composer after send, but submission could not be confirmed; duplicate send was suppressed");\n'''
          new = '''    const lateBudget = active.attachmentCount > 0 ? 45000 : 20000;\n    const confirmed = await waitAfterSend(active, "late", lateBudget);\n    if (confirmed) return confirmed;\n    throw new Error("ChatGPT cleared the composer but did not expose an accepted user turn, generation state, or response; duplicate send was suppressed");\n'''
          if old not in text:
              raise SystemExit('content_request_v6.js: settle anchor missing')
          text = text.replace(old, new, 1)
          old = '''      options: message.options || {},\n      cancelled: false,\n'''
          new = '''      options: message.options || {},\n      attachmentCount: Array.isArray(message.attachments) ? message.attachments.length : 0,\n      cancelled: false,\n'''
          if old not in text:
              raise SystemExit('content_request_v6.js: active options anchor missing')
          text = text.replace(old, new, 1)
          text = text.replace('''          historical_hydration_ignored: true,\n''', '''          historical_hydration_ignored: true,\n          submission_liveness_revision: 79,\n          submission_attachment_count: active.attachmentCount,\n''', 1)
          path.write_text(text, encoding='utf-8')

          # 4) Attachment preview/chip is not enough; wait for upload processing
          # to be continuously idle before calling the attachment verified.
          path = Path('chrome_extension/content_multimodal_v78.js')
          text = path.read_text(encoding='utf-8')
          anchor = '''  async function waitForUpload(file, before, tracker, timeoutMs, strongSignal = false) {\n'''
          helper = '''  async function waitForUploadSettled(file, before, initialReason, timeoutMs = 30000, stableMs = 1600) {\n    const deadline = Date.now() + timeoutMs;\n    let stableSince = 0;\n    let lastSeen = before;\n    while (Date.now() < deadline) {\n      const error = uploadErrorFor(file.name);\n      if (error) throw new Error(`${file.name}: ${error}`);\n      const seen = fileVisible(file, before);\n      lastSeen = seen.now;\n      if (!seen.ok || uploadBusy()) {\n        stableSince = 0;\n        await delay(150);\n        continue;\n      }\n      if (!stableSince) stableSince = Date.now();\n      if (Date.now() - stableSince >= stableMs) {\n        return {\n          ok: true,\n          reason: initialReason || seen.reason,\n          lastSeen,\n          upload_settled: true,\n          upload_settle_ms: Date.now() - stableSince,\n          upload_settle_revision: 79,\n        };\n      }\n      await delay(150);\n    }\n    throw new Error(`${file.name}: attachment appeared in ChatGPT but upload/processing did not settle before timeout`);\n  }\n\n  async function waitForUpload(file, before, tracker, timeoutMs, strongSignal = false) {\n'''
          if anchor not in text:
              raise SystemExit('content_multimodal_v78.js: waitForUpload anchor missing')
          text = text.replace(anchor, helper, 1)
          old = '''      if (seen.ok) {\n        await delay(550);\n        const late = uploadErrorFor(file.name);\n        if (late) throw new Error(`${file.name}: ${late}`);\n        return { ok: true, reason: seen.reason, lastSeen, duplicate, duplicateClosed, signal: true };\n      }\n'''
          new = '''      if (seen.ok) {\n        const settled = await waitForUploadSettled(file, before, seen.reason);\n        return { ...settled, duplicate, duplicateClosed, signal: true };\n      }\n'''
          if old not in text:
              raise SystemExit('content_multimodal_v78.js: early verified anchor missing')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # 5) Formal patch release boundary.
          path = Path('app/runtime_contract.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('SERVER_RUNTIME_VERSION = "0.22.46"', 'SERVER_RUNTIME_VERSION = "0.22.47"', 1)
          text = text.replace('CHROME_BRIDGE_BUNDLE_VERSION = "0.8.18"', 'CHROME_BRIDGE_BUNDLE_VERSION = "0.8.19"', 1)
          text = text.replace('capacity-native-v37-bundle-0818-', 'capacity-native-v37-bundle-0819-', 1)
          text = text.replace('-multimodal-main-world-v78-release-v02246"', '-multimodal-main-world-v78-active-request-disable-lease-v79-multimodal-upload-settle-v79-submission-liveness-v79-release-v02247"', 1)
          text = text.replace('-multimodal-main-world-v78-release-v0818"', '-multimodal-main-world-v78-active-request-disable-lease-v79-multimodal-upload-settle-v79-submission-liveness-v79-release-v0819"', 1)
          feature_anchor = '''            "multimodal_main_world_v78": True,\n'''
          if feature_anchor not in text:
              raise SystemExit('runtime_contract.py: feature anchor missing')
          text = text.replace(feature_anchor, feature_anchor + '''            "active_request_disable_lease_v79": True,\n            "multimodal_upload_settle_v79": True,\n            "submission_liveness_v79": True,\n''', 1)
          path.write_text(text, encoding='utf-8')

          replacements = {
              'chrome_extension/manifest.json': [('"version": "0.8.18"', '"version": "0.8.19"')],
              'chrome_extension/content_bundle_marker_v48.js': [('bundle: "0.8.18"', 'bundle: "0.8.19"')],
              'chrome_extension/content_bundle_marker_v71.js': [('bundle: "0.8.18"', 'bundle: "0.8.19"')],
              'chrome_extension/background_runtime_preflight_v48.js': [('REQUIRED_BUNDLE = "0.8.18"', 'REQUIRED_BUNDLE = "0.8.19"')],
              'chrome_extension/content_runtime_contract_v48.js': [('REQUIRED_BUNDLE = "0.8.18"', 'REQUIRED_BUNDLE = "0.8.19"')],
              'chrome_extension/content_runtime_contract_v71.js': [('REQUIRED_BUNDLE = "0.8.18"', 'REQUIRED_BUNDLE = "0.8.19"')],
          }
          for filename, pairs in replacements.items():
              p = Path(filename)
              content = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  if old not in content:
                      raise SystemExit(f'{filename}: missing {old!r}')
                  content = content.replace(old, new)
              p.write_text(content, encoding='utf-8')

          # Align exact release assertions in test files; protocol 0.8.1 remains unchanged.
          for p in Path('tests').glob('*'):
              if not p.is_file() or p.suffix not in {'.py', '.mjs', '.js'}:
                  continue
              content = p.read_text(encoding='utf-8')
              content = content.replace('SERVER_RUNTIME_VERSION = "0.22.46"', 'SERVER_RUNTIME_VERSION = "0.22.47"')
              content = content.replace('SERVER_RUNTIME_VERSION == "0.22.46"', 'SERVER_RUNTIME_VERSION == "0.22.47"')
              content = content.replace('manifest["version"] == "0.8.18"', 'manifest["version"] == "0.8.19"')
              content = content.replace('CHROME_BRIDGE_BUNDLE_VERSION == "0.8.18"', 'CHROME_BRIDGE_BUNDLE_VERSION == "0.8.19"')
              content = content.replace('CHROME_BRIDGE_BUNDLE_VERSION = "0.8.18"', 'CHROME_BRIDGE_BUNDLE_VERSION = "0.8.19"')
              content = content.replace('REQUIRED_BUNDLE = "0.8.18"', 'REQUIRED_BUNDLE = "0.8.19"')
              content = content.replace('bundle: "0.8.18"', 'bundle: "0.8.19"')
              content = content.replace('"version": "0.8.18"', '"version": "0.8.19"')
              p.write_text(content, encoding='utf-8')

          Path('tests/test_runtime_lifecycle_multimodal_v79.py').write_text(r'''from pathlib import Path


ROOT = Path(__file__).resolve().parents[1]


def read(path: str) -> str:
    return (ROOT / path).read_text(encoding="utf-8")


def test_worker_disable_is_blocked_while_broker_owns_active_requests() -> None:
    server = read("app/worker_disable_authority_patch.py")
    extension = read("chrome_extension/background_worker_master_switch_v61.js")
    assert "def active_request_ids(client_id: str)" in server
    assert "require_disable_lease(client_id)" in server
    assert "worker_active_request_lease" in server
    assert "activeRequestLease()" in extension
    assert "active_request_disable_lease_revision: 79" in extension
    assert "Worker has active requests; disable is blocked" in extension


def test_composer_clear_is_not_submission_confirmation() -> None:
    request = read("chrome_extension/content_request_v6.js")
    assert 'reason: "composer-cleared"' not in request
    assert "active.attachmentCount > 0 ? 45000 : 20000" in request
    assert "submission_liveness_revision: 79" in request
    assert "did not expose an accepted user turn, generation state, or response" in request


def test_multimodal_waits_for_upload_processing_to_settle() -> None:
    multimodal = read("chrome_extension/content_multimodal_v78.js")
    assert "waitForUploadSettled" in multimodal
    assert "upload_settle_revision: 79" in multimodal
    assert "uploadBusy()" in multimodal
    assert "upload/processing did not settle before timeout" in multimodal
    assert "await delay(550)" not in multimodal


def test_v02247_release_contract() -> None:
    runtime = read("app/runtime_contract.py")
    manifest = read("chrome_extension/manifest.json")
    assert 'SERVER_RUNTIME_VERSION = "0.22.47"' in runtime
    assert 'CHROME_BRIDGE_VERSION = "0.8.1"' in runtime
    assert 'CHROME_BRIDGE_BUNDLE_VERSION = "0.8.19"' in runtime
    assert '"version": "0.8.19"' in manifest
    assert '"active_request_disable_lease_v79": True' in runtime
    assert '"multimodal_upload_settle_v79": True' in runtime
    assert '"submission_liveness_v79": True' in runtime
''', encoding='utf-8')

          Path('docs/releases/v0.22.47.md').write_text('''# v0.22.47 / Worker Bundle 0.8.19\n\n本版本修复 0.22.46 / 0.8.18 实机日志暴露的请求生命周期问题。\n\n- Worker 管理禁用现在持有 active-request lease：只要 Broker 仍有活动请求，就禁止关闭 Worker WebSocket 或折叠其浏览器窗口，并返回可重试的 409；扩展端也增加第二层活动请求保护。\n- 多模态附件不再以“出现附件 chip/预览”直接认定上传完成，而是等待 ChatGPT 上传/处理状态消失并稳定后才允许提交。\n- request-v6 不再把“composer 被清空”当成提交成功；必须观察到当前用户消息、生成状态或新助手消息。附件请求使用更长的提交存活确认预算。\n- 生命周期规则同样保护视觉理解、文件理解、长文本、图片生成和语音链路：活动请求必须直到 completed/error/cancelled 终态才允许执行 Worker disable。\n''', encoding='utf-8')
          PY
      - name: Commit fixes and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/tmp-v02247-runtime-lifecycle-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix active request lifecycle and multimodal settlement; release v0.22.47"
          git push origin HEAD:fix/runtime-lifecycle-multimodal-v79-20260903
