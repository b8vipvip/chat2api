name: Temporary standby online integrity patch

on:
  push:
    branches:
      - fix/v022104-standby-online-integrity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v022104-standby-online-integrity
          fetch-depth: 0
      - name: Apply single-authority 15-second online integrity watchdog
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('chrome_extension/conversation_persistent_pool_v132.js')
          data = path.read_text(encoding='utf-8')

          old = '''  const REPAIR_ALARM = "chat2api-persistent-window-pool-v132";\n  const NEW_CHAT_URL = "https://chatgpt.com/";'''
          new = '''  const REPAIR_ALARM = "chat2api-persistent-window-pool-v132";\n  // Online integrity is only a trigger. All physical create/close decisions stay\n  // exclusively inside reconcileNow(), preserving one terminal lifecycle owner.\n  const ONLINE_INTEGRITY_INTERVAL_MS = 15 * 1000;\n  const ONLINE_BINDING_KEYS = Object.freeze(["serverUrl", "clientId", "clientToken", "socketState"]);\n  const NEW_CHAT_URL = "https://chatgpt.com/";'''
          if old not in data:
              raise SystemExit('constant anchor not found')
          data = data.replace(old, new, 1)

          old = '''    closed: 0,\n  };'''
          new = '''    closed: 0,\n    onlineIntegrityTimer: null,\n    onlineIntegrityChecks: 0,\n    onlineIntegrityEligible: false,\n    onlineIntegrityLastCheckAt: 0,\n    onlineIntegrityLastReason: "",\n  };'''
          if old not in data:
              raise SystemExit('state anchor not found')
          data = data.replace(old, new, 1)

          old = '''      transient_login_state_preserves_standby_target: true,\n      route_idle_lease_ms: 5 * 60 * 1000,'''
          new = '''      transient_login_state_preserves_standby_target: true,\n      online_integrity_interval_ms: ONLINE_INTEGRITY_INTERVAL_MS,\n      online_integrity_bound_online_only: true,\n      online_integrity_single_authority: true,\n      online_integrity_checks: state.onlineIntegrityChecks,\n      online_integrity_eligible: state.onlineIntegrityEligible,\n      online_integrity_last_check_at: state.onlineIntegrityLastCheckAt || null,\n      online_integrity_last_reason: state.onlineIntegrityLastReason || "",\n      route_idle_lease_ms: 5 * 60 * 1000,'''
          if old not in data:
              raise SystemExit('snapshot anchor not found')
          data = data.replace(old, new, 1)

          old = '''  async function setTarget(requestedTarget, source = "explicit") {'''
          new = '''  async function workerOnlineEligibility() {\n    const stored = await chrome.storage.local.get({\n      serverUrl: "",\n      clientId: "",\n      clientToken: "",\n      socketState: "disconnected",\n    }).catch(() => ({}));\n    const bound = Boolean(\n      String(stored?.serverUrl || "").trim() &&\n      String(stored?.clientId || "").trim() &&\n      String(stored?.clientToken || "").trim()\n    );\n    const online = String(stored?.socketState || "") === "connected";\n    return { bound, online, eligible: bound && online };\n  }\n\n  async function onlineIntegrityTick(reason = "online-integrity-15s") {\n    const eligibility = await workerOnlineEligibility();\n    state.onlineIntegrityChecks += 1;\n    state.onlineIntegrityEligible = eligibility.eligible;\n    state.onlineIntegrityLastCheckAt = Date.now();\n    state.onlineIntegrityLastReason = String(reason || "online-integrity-15s").slice(0, 80);\n    if (!eligibility.eligible) return { ok: true, skipped: true, ...eligibility };\n\n    // IMPORTANT: the watchdog never creates, removes, or counts toward a second\n    // lifecycle policy. It only enters the existing serialized reconcile path.\n    // reconcileNow() remains the sole terminal authority for exact standby count.\n    const result = await reconcile(reason);\n    return { ok: true, skipped: false, ...eligibility, result };\n  }\n\n  function ensureOnlineIntegrityWatchdog() {\n    if (state.onlineIntegrityTimer) return;\n    state.onlineIntegrityTimer = setInterval(() => {\n      onlineIntegrityTick("online-integrity-15s").catch(() => {});\n    }, ONLINE_INTEGRITY_INTERVAL_MS);\n  }\n\n  async function setTarget(requestedTarget, source = "explicit") {'''
          if old not in data:
              raise SystemExit('setTarget anchor not found')
          data = data.replace(old, new, 1)

          old = '''  chrome.storage.onChanged.addListener((changes, areaName) => {\n    if (areaName !== "local") return;\n    if (changes[DISABLED_KEY] || changes[LOGIN_STATE_KEY] || changes[LOGIN_COMPOSER_KEY] || changes[INIT_TAB_KEY]) {\n      scheduleReconcile("state-change", 200);\n    }'''
          new = '''  chrome.storage.onChanged.addListener((changes, areaName) => {\n    if (areaName !== "local") return;\n    if (changes[DISABLED_KEY] || changes[LOGIN_STATE_KEY] || changes[LOGIN_COMPOSER_KEY] || changes[INIT_TAB_KEY]) {\n      scheduleReconcile("state-change", 200);\n    }\n    if (ONLINE_BINDING_KEYS.some(key => Boolean(changes[key]))) {\n      const becameOnline = changes.socketState?.newValue === "connected";\n      onlineIntegrityTick(becameOnline ? "worker-online-immediate" : "worker-binding-state-change").catch(() => {});\n    }'''
          if old not in data:
              raise SystemExit('storage listener anchor not found')
          data = data.replace(old, new, 1)

          old = '''  state.loginStatus = loginStatus;\n\n  ensureLoaded().then(() => scheduleReconcile("startup", 500)).catch(() => {});'''
          new = '''  state.loginStatus = loginStatus;\n  state.workerOnlineEligibility = workerOnlineEligibility;\n  state.onlineIntegrityTick = onlineIntegrityTick;\n\n  ensureOnlineIntegrityWatchdog();\n  // First service-worker activation performs an immediate eligibility check.\n  // A later websocket transition to `connected` is also checked immediately by\n  // the storage listener above; subsequent bound+online checks run every 15s.\n  ensureLoaded().then(() => onlineIntegrityTick("startup-immediate")).catch(() => {});'''
          if old not in data:
              raise SystemExit('startup anchor not found')
          data = data.replace(old, new, 1)

          path.write_text(data, encoding='utf-8')

          test = Path('tests/test_persistent_window_pool_v132.py')
          t = test.read_text(encoding='utf-8')
          marker = '''\ndef test_saved_conversation_is_validated_after_slot_reassignment_without_losing_lease_ownership() -> None:\n'''
          addition = r'''\n\ndef test_bound_online_worker_checks_standby_integrity_every_15_seconds_and_immediately() -> None:\n    source = text("chrome_extension/conversation_persistent_pool_v132.js")\n    assert 'const ONLINE_INTEGRITY_INTERVAL_MS = 15 * 1000;' in source\n    assert '["serverUrl", "clientId", "clientToken", "socketState"]' in source\n    assert 'String(stored?.socketState || "") === "connected"' in source\n    assert 'return { bound, online, eligible: bound && online };' in source\n    assert 'setInterval(() =>' in source\n    assert 'onlineIntegrityTick("online-integrity-15s")' in source\n    assert 'changes.socketState?.newValue === "connected"' in source\n    assert '"worker-online-immediate"' in source\n    assert 'onlineIntegrityTick("startup-immediate")' in source\n    assert 'online_integrity_interval_ms: ONLINE_INTEGRITY_INTERVAL_MS' in source\n\n\ndef test_online_integrity_is_trigger_only_and_persistent_pool_remains_single_terminal_authority() -> None:\n    source = text("chrome_extension/conversation_persistent_pool_v132.js")\n    start = source.index('async function onlineIntegrityTick(')\n    end = source.index('async function setTarget(', start)\n    watchdog = source[start:end]\n    assert 'await reconcile(reason)' in watchdog\n    assert 'createStandby(' not in watchdog\n    assert 'closeWindow(' not in watchdog\n    assert 'chrome.windows.create' not in watchdog\n    assert 'chrome.windows.remove' not in watchdog\n    assert 'window_decision_authority: "persistent-window-pool-v132"' in source\n    assert 'online_integrity_single_authority: true' in source\n    assert 'if (state.reconcilePromise) return state.reconcilePromise;' in source\n\n\ndef test_linux_and_windows_browser_workers_share_the_same_extension_window_authority() -> None:\n    launcher = text("scripts/linux_worker_chrome_launcher.sh")\n    pool = text("chrome_extension/conversation_persistent_pool_v132.js")\n    agent = text("scripts/linux_worker_agent.py")\n    assert 'EXTENSION_DIR="${CHAT2API_EXTENSION_DIR:-/opt/chat2api-worker/chrome_extension}"' in launcher\n    assert '--disable-extensions-except="$EXTENSION_DIR"' in launcher\n    assert '--load-extension="$EXTENSION_DIR"' in launcher\n    assert 'window_decision_authority: "persistent-window-pool-v132"' in pool\n    # Linux transport may heartbeat independently, but it must not duplicate the\n    # browser-window create/close lifecycle owned by the shared Chrome extension.\n    assert 'chrome.windows.create' not in agent\n    assert 'chrome.windows.remove' not in agent\n'''
          if marker not in t:
              raise SystemExit('test insertion anchor not found')
          t = t.replace(marker, addition + marker, 1)
          test.write_text(t, encoding='utf-8')
          PY

          node --check chrome_extension/conversation_persistent_pool_v132.js
          python -m pytest -q tests/test_persistent_window_pool_v132.py

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add chrome_extension/conversation_persistent_pool_v132.js tests/test_persistent_window_pool_v132.py
          git commit -m "fix(worker): enforce 15-second standby integrity with single authority"
          git push origin HEAD:fix/v022104-standby-online-integrity
