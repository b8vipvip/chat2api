name: v0.22.54 test contract sync

on:
  push:
    branches:
      - fix/worker-lifecycle-affinity-prompt-v86-20260904

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/worker-lifecycle-affinity-prompt-v86-20260904
      - name: Advance historical current-release assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          for pattern in ("tests/*.py", "tests/*.mjs"):
              for path in Path(".").glob(pattern):
                  source = path.read_text(encoding="utf-8")
                  updated = source.replace("0.22.53", "0.22.54").replace("0.8.23", "0.8.24")
                  if path.name == "test_worker_lifecycle_retry_quarantine_v50.py":
                      updated = updated.replace("completed-controller-did-not-settle-v50", "success_recycle: false")
                  if updated != source:
                      path.write_text(updated, encoding="utf-8")
          PY
          if git diff --quiet -- tests; then
            echo "Release assertions already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "test: advance historical release assertions to v0.22.54"
          git push origin HEAD:fix/worker-lifecycle-affinity-prompt-v86-20260904
