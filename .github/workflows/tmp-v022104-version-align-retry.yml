name: Temporary v0.22.104 version alignment retry

on:
  push:
    branches:
      - release/v0.22.104-standby-online-integrity

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.22.104-standby-online-integrity
          fetch-depth: 0
      - name: Align non-workflow release contract to v0.22.104
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          names = subprocess.check_output(
              ['git', 'diff', '--name-only', 'v0.22.102..v0.22.103'],
              text=True,
          ).splitlines()
          workflow = '.github/workflows/production-image-smoke.yml'
          changed = []
          for name in names:
              if name == workflow:
                  continue
              path = Path(name)
              if not path.is_file():
                  continue
              data = path.read_text(encoding='utf-8')
              if '0.22.103' not in data:
                  continue
              path.write_text(data.replace('0.22.103', '0.22.104'), encoding='utf-8')
              changed.append(name)
          if len(changed) != 66:
              raise SystemExit(f'expected 66 non-workflow release files, changed {len(changed)}')
          print(f'aligned {len(changed)} non-workflow files')
          PY
          node --check chrome_extension/conversation_persistent_pool_v132.js
          python -m py_compile app/runtime_contract.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app chrome_extension tests
          git commit -m "release: align runtime contract to v0.22.104"
          git push origin HEAD:release/v0.22.104-standby-online-integrity
