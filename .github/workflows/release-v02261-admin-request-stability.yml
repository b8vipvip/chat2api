name: Release v0.22.61 admin request stability sync

on:
  push:
    branches:
      - release/v0.22.61-admin-request-stability-v92

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[release-v02261-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/v0.22.61-admin-request-stability-v92
          fetch-depth: 0
      - name: Align runtime and release assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('app/runtime_contract.py')
          text = runtime.read_text(encoding='utf-8')
          if 'SERVER_RUNTIME_VERSION = "0.22.60"' not in text:
              raise SystemExit('expected 0.22.60 runtime version not found')
          text = text.replace('SERVER_RUNTIME_VERSION = "0.22.60"', 'SERVER_RUNTIME_VERSION = "0.22.61"', 1)
          text = text.replace('admin-navigation-bounded-v90-file-upload-quota-v91-release-v02260', 'admin-navigation-bounded-v90-file-upload-quota-v91-admin-request-stability-v92-release-v02261', 1)
          feature_anchor = '            "admin_navigation_bounded_v90": True,\n'
          if '"admin_request_stability_v92"' not in text:
              if feature_anchor not in text:
                  raise SystemExit('admin navigation feature anchor not found')
              text = text.replace(feature_anchor, feature_anchor + '            "admin_request_stability_v92": True,\n', 1)
          runtime.write_text(text, encoding='utf-8')

          # Release-contract tests intentionally assert the current server runtime.
          # Update only test files that explicitly mention the just-released value;
          # historical source/docs outside tests remain untouched.
          touched = []
          for path in Path('tests').glob('test_*.py'):
              source = path.read_text(encoding='utf-8')
              if '0.22.60' not in source:
                  continue
              updated = source.replace('0.22.60', '0.22.61')
              if updated != source:
                  path.write_text(updated, encoding='utf-8')
                  touched.append(str(path))
          print('updated release tests:', *touched, sep='\n- ')
          PY
      - name: Remove one-shot workflow and commit
        run: |
          rm -f .github/workflows/release-v02261-admin-request-stability.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/runtime_contract.py tests .github/workflows/release-v02261-admin-request-stability.yml
          git commit -m 'release: align v0.22.61 admin request stability assertions [release-v02261-sync]'
          git push origin HEAD:release/v0.22.61-admin-request-stability-v92
