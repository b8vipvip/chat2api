name: One-shot ChatGPT login-ready admission v137

on:
  push:
    branches:
      - fix/login-ready-admission-v137

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/login-ready-admission-v137
          fetch-depth: 0
      - name: Apply login-ready admission patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_login_ready_admission_v137.py
          python -m py_compile app/login_readiness.py app/registry.py app/model_capability_routing_patch.py app/window_manager_v88_patch.py
          node --check app/admin_window_manager_v88.js
          pytest -q tests/test_login_ready_admission_v137.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/login_readiness.py app/registry.py app/model_capability_routing_patch.py app/window_manager_v88_patch.py app/admin_window_manager_v88.js app/runtime_contract.py tests/test_login_ready_admission_v137.py
          if git diff --cached --quiet; then
            echo "login-ready admission patch already applied"
            exit 0
          fi
          git commit -m "fix: gate API routing on ChatGPT login readiness"
          git push origin HEAD:fix/login-ready-admission-v137
