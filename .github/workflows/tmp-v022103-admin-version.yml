name: Temporary v0.22.103 admin asset alignment

on:
  push:
    branches:
      - release/v0.22.103-standby-retention-hotfix

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.22.103-standby-retention-hotfix
          fetch-depth: 0
      - name: Align canonical Worker-list asset version
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/admin_extension_columns.js')
          data = path.read_text(encoding='utf-8')
          old = '0.22.102-worker-list-v152'
          new = '0.22.103-worker-list-v152'
          if old not in data:
              raise SystemExit('Expected old Worker-list asset version was not found')
          path.write_text(data.replace(old, new), encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/admin_extension_columns.js
          git commit -m "release: align v0.22.103 Worker-list asset"
          git push origin HEAD:release/v0.22.103-standby-retention-hotfix
