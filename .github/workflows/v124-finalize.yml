name: v124 finalize

on:
  push:
    branches:
      - feat/linux-device-single-authority-v124-20260911

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/linux-device-single-authority-v124-20260911
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v124 runtime and installer changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if count is not None and actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {actual}: {old[:80]}')
              if actual == 0:
                  raise SystemExit(f'{path}: pattern missing: {old[:80]}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          backend = 'app/linux_worker_device_authority_v124_patch.py'
          replace(backend,
              '        pairings = await app.state.registry.list_pairing_codes()\n        proxies = app.state.linux_worker_proxy_catalog.list()\n',
              '        await app.state.pairings.ensure_loaded()\n        pairings = app.state.pairings.list_public()\n        proxies = app.state.linux_worker_proxy_catalog.list()\n', 1)
          replace(backend, '"prefix": str(item.get("code_prefix") or ""),', '"prefix": str(item.get("prefix") or ""),', 1)
          replace(backend, '"paired": bool(item.get("client_id")),', '"paired": bool(item.get("bound_client_id")),', 1)
          replace(backend,
              '    def create_install(request: Request, *, pairing: dict[str, Any], proxy: dict[str, Any], slot: int, parent_device_id: str = "") -> dict[str, Any]:',
              '    def create_install(request: Request, *, pairing: dict[str, Any], pairing_code: str, proxy: dict[str, Any], slot: int, parent_device_id: str = "") -> dict[str, Any]:', 1)
          replace(backend,
              'f"sudo bash -s -- --server {shlex.quote(server)} --enroll-code {shlex.quote(enrollment[\'code\'])}"',
              'f"sudo bash -s -- --server {shlex.quote(server)} --enroll-code {shlex.quote(enrollment[\'code\'])} --pairing-code {shlex.quote(pairing_code)} --device-name {shlex.quote(device_name)}"', 1)
          replace(backend,
              'f"--server {shlex.quote(server)} --enroll-code {shlex.quote(enrollment[\'code\'])} --slot {slot}"',
              'f"--server {shlex.quote(server)} --enroll-code {shlex.quote(enrollment[\'code\'])} --slot {slot} --pairing-code {shlex.quote(pairing_code)} --device-name {shlex.quote(device_name)}"', 1)
          replace(backend,
              '        return create_install(request, pairing=pairing, proxy=proxy, slot=1)',
              '        pairing_code, _ = await app.state.pairings.reveal_or_rotate(pairing_id)\n        return create_install(request, pairing=pairing, pairing_code=pairing_code, proxy=proxy, slot=1)', 1)
          replace(backend,
              '        return create_install(request, pairing=pairing, proxy=proxy, slot=slot, parent_device_id=device_id)',
              '        pairing_code, _ = await app.state.pairings.reveal_or_rotate(pairing_id)\n        return create_install(request, pairing=pairing, pairing_code=pairing_code, proxy=proxy, slot=slot, parent_device_id=device_id)', 1)
          replace(backend,
              'await app.state.send_linux_worker_command(worker_id, "apply_proxy", {"share_link": share_link}, 90)',
              'await app.state.send_linux_worker_command(worker_id, "apply_proxy_config", {"share_link": share_link}, wait=True, timeout=90)', 1)

          bootstrap = 'scripts/bootstrap_linux_worker.sh'
          replace(bootstrap, 'ENROLL_CODE=""\nUPGRADE_ONLY=0', 'ENROLL_CODE=""\nPAIRING_CODE=""\nEXTENSION_NAME="Linux Worker"\nUPGRADE_ONLY=0', 1)
          replace(bootstrap, '    --enroll-code) ENROLL_CODE="$2"; shift 2;;\n    --upgrade)', '    --enroll-code) ENROLL_CODE="$2"; shift 2;;\n    --pairing-code) PAIRING_CODE="$2"; shift 2;;\n    --device-name) EXTENSION_NAME="$2"; shift 2;;\n    --upgrade)', 1)
          replace(bootstrap,
              'chown root:chat2api /etc/chat2api-worker/worker.json\nchmod 640 /etc/chat2api-worker/worker.json\ninstall -d -o chat2api -g chat2api -m 700 "$PROFILE_DIR"',
              '''if [[ -n "$PAIRING_CODE" ]]; then\n  identity_tmp="$(mktemp)"\n  jq --arg pairing "$PAIRING_CODE" --arg name "$EXTENSION_NAME" '. + {extension_pairing_code:$pairing,extension_name:$name}' /etc/chat2api-worker/worker.json >"$identity_tmp"\n  install -o root -g chat2api -m 640 "$identity_tmp" /etc/chat2api-worker/worker.json\n  rm -f "$identity_tmp"\nfi\nchown root:chat2api /etc/chat2api-worker/worker.json\nchmod 640 /etc/chat2api-worker/worker.json\ninstall -d -o chat2api -g chat2api -m 700 "$PROFILE_DIR"''', 1)
          replace(bootstrap,
              'fi\n\nINSTALL_SUCCESS=1\nreport_progress "installed" "complete" "Worker 安装完成，Chrome Bridge 将自动加载并自动配对"',
              '''fi\n\nif [[ -n "$PAIRING_CODE" ]]; then\n  set_stage "extension-pairing" "使用所选设备码自动配对 Chrome Bridge"\n  if ! "$WORKER_DIR/../chat2api-worker-venv/bin/python" "$WORKER_DIR/scripts/linux_worker_extension_pair.py" --config /etc/chat2api-worker/worker.json --cdp-url http://127.0.0.1:9222; then\n    LAST_MESSAGE="Chrome Bridge 自动配对失败"\n    exit 1\n  fi\nfi\n\nINSTALL_SUCCESS=1\nreport_progress "installed" "complete" "Worker 安装完成，Chrome Bridge 已自动加载并配对"''', 1)

          slot = 'scripts/linux_worker_slot_install.sh'
          replace(slot, 'ENROLL_CODE=""\nSLOT=""', 'ENROLL_CODE=""\nPAIRING_CODE=""\nEXTENSION_NAME="Linux Worker"\nSLOT=""', 1)
          replace(slot, '    --enroll-code) ENROLL_CODE="$2"; shift 2;;\n    --slot)', '    --enroll-code) ENROLL_CODE="$2"; shift 2;;\n    --pairing-code) PAIRING_CODE="$2"; shift 2;;\n    --device-name) EXTENSION_NAME="$2"; shift 2;;\n    --slot)', 1)
          replace(slot,
              "jq -e 'type == \"object\" and (.worker_id|type==\"string\" and length>0) and (.worker_token|type==\"string\" and length>0) and (.websocket_url|type==\"string\" and length>0)' \"$CONFIG_DIR/worker.json\" >/dev/null\n",
              """jq -e 'type == \"object\" and (.worker_id|type==\"string\" and length>0) and (.worker_token|type==\"string\" and length>0) and (.websocket_url|type==\"string\" and length>0)' \"$CONFIG_DIR/worker.json\" >/dev/null\nif [[ -n \"$PAIRING_CODE\" ]]; then\n  identity_tmp=\"$(mktemp)\"\n  jq --arg pairing \"$PAIRING_CODE\" --arg name \"$EXTENSION_NAME\" '. + {extension_pairing_code:$pairing,extension_name:$name}' \"$CONFIG_DIR/worker.json\" >\"$identity_tmp\"\n  install -o root -g chat2api -m 640 \"$identity_tmp\" \"$CONFIG_DIR/worker.json\"\n  rm -f \"$identity_tmp\"\nfi\n""", 1)
          replace(slot,
              '(( ready == 1 )) || { echo "Worker slot ${SLOT} did not become healthy" >&2; exit 1; }\n\necho "=== chat2api same-host Worker slot installed ==="',
              '''(( ready == 1 )) || { echo "Worker slot ${SLOT} did not become healthy" >&2; exit 1; }\nif [[ -n "$PAIRING_CODE" ]]; then\n  "$VENV_DIR/bin/python" "$WORKER_DIR/scripts/linux_worker_extension_pair.py" --config "$CONFIG_DIR/worker.json" --cdp-url "http://127.0.0.1:${CDP_PORT}" || { echo "Worker slot ${SLOT} extension auto-pair failed" >&2; exit 1; }\nfi\n\necho "=== chat2api same-host Worker slot installed ==="''', 1)

          replace('Dockerfile',
              'scripts/linux_worker_agent.py scripts/linux_worker_agent_v43.py scripts/linux_worker_agent_v44.py scripts/linux_worker_proxy.py',
              'scripts/linux_worker_agent.py scripts/linux_worker_agent_v43.py scripts/linux_worker_agent_v44.py scripts/linux_worker_extension_pair.py scripts/linux_worker_proxy.py', 1)
          replace('.dockerignore', '!scripts/linux_worker_agent_v44.py\n', '!scripts/linux_worker_agent_v44.py\n!scripts/linux_worker_extension_pair.py\n', 1)

          runtime = Path('app/runtime_contract.py')
          text = runtime.read_text(encoding='utf-8')
          text = text.replace('SERVER_RUNTIME_VERSION = "0.22.78"\nPREVIOUS_SERVER_RUNTIME_VERSION = "0.22.77"\nPREVIOUS_PREVIOUS_SERVER_RUNTIME_VERSION = "0.22.76"\nPREVIOUS_PREVIOUS_PREVIOUS_SERVER_RUNTIME_VERSION = "0.22.75"\nPREVIOUS_PREVIOUS_PREVIOUS_PREVIOUS_SERVER_RUNTIME_VERSION = "0.22.74"',
                              'SERVER_RUNTIME_VERSION = "0.22.79"\nPREVIOUS_SERVER_RUNTIME_VERSION = "0.22.78"\nPREVIOUS_PREVIOUS_SERVER_RUNTIME_VERSION = "0.22.77"\nPREVIOUS_PREVIOUS_PREVIOUS_SERVER_RUNTIME_VERSION = "0.22.76"\nPREVIOUS_PREVIOUS_PREVIOUS_PREVIOUS_SERVER_RUNTIME_VERSION = "0.22.75"')
          text = text.replace('CHROME_BRIDGE_BUNDLE_VERSION = "0.8.33"', 'CHROME_BRIDGE_BUNDLE_VERSION = "0.8.34"')
          text = text.replace('release-v02278"', 'release-v02278-linux-device-single-authority-v124-extension-autopair-v1-release-v02279"')
          text = text.replace('release-v0833",', 'release-v0833-linux-device-authority-v124-extension-autopair-v1-release-v0834",')
          text = text.replace('"linux_worker_device_console_v122": True,', '"linux_worker_device_console_v122": False,')
          text = text.replace('"linux_worker_console_v123": True,', '"linux_worker_console_v123": False,')
          marker = '            "linux_worker_console_v123": False,\n'
          assert marker in text
          text = text.replace(marker, marker + '            "linux_worker_device_authority_v124": True,\n            "linux_worker_extension_autopair_v124": True,\n', 1)
          runtime.write_text(text, encoding='utf-8')

          version_files = [
              'chrome_extension/manifest.json',
              'chrome_extension/content_bundle_marker_v48.js',
              'chrome_extension/content_bundle_marker_v71.js',
              'chrome_extension/content_runtime_contract_v48.js',
              'chrome_extension/content_runtime_contract_v71.js',
              'chrome_extension/background_runtime_preflight_v48.js',
          ]
          for name in version_files:
              p=Path(name); t=p.read_text(encoding='utf-8');
              if '0.8.33' not in t: raise SystemExit(f'{name}: 0.8.33 missing')
              p.write_text(t.replace('0.8.33','0.8.34'),encoding='utf-8')

          for p in Path('tests').rglob('*'):
              if not p.is_file() or p.suffix not in {'.py','.mjs','.js'}: continue
              t=p.read_text(encoding='utf-8')
              t=t.replace('0.22.78','0.22.79').replace('0.8.33','0.8.34')
              t=t.replace('payload["features"]["linux_worker_device_console_v122"] is True','payload["features"]["linux_worker_device_console_v122"] is False')
              t=t.replace('payload["features"]["linux_worker_console_v123"] is True','payload["features"]["linux_worker_console_v123"] is False')
              p.write_text(t,encoding='utf-8')
          PY
      - name: Validate syntax and focused tests
        run: |
          python -m py_compile app/linux_worker_device_authority_v124_patch.py app/worker_presentation_v64_patch.py scripts/linux_worker_extension_pair.py
          node --check app/admin_linux_device_authority_v124.js
          bash -n scripts/bootstrap_linux_worker.sh
          bash -n scripts/linux_worker_slot_install.sh
          python -m pytest -q tests/test_linux_worker_console_v123.py tests/test_linux_worker_device_console_v122.py
      - name: Commit finalized contract
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app chrome_extension scripts Dockerfile .dockerignore tests
          git commit -m 'release: finalize Linux device authority v124 contract'
          git push origin HEAD:feat/linux-device-single-authority-v124-20260911
