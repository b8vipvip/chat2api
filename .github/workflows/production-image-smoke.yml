name: Production image smoke

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements.txt'
      - 'app/**'
      - 'chrome_extension/**'
      - 'scripts/bootstrap_linux_worker.sh'
      - 'scripts/linux_worker_*.py'
      - 'scripts/linux_worker_*.sh'
      - 'scripts/linux_extension_autoreload.sh'
      - '.github/workflows/production-image-smoke.yml'
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: DOCKER_BUILDKIT=1 docker build --progress=plain -t chat2api-production-smoke .
      - name: Verify Linux device authority and Worker bundle
        run: |
          docker run --rm --entrypoint python chat2api-production-smoke -c '
          import hashlib, json, tarfile
          from pathlib import Path
          bootstrap = Path("/app/scripts/bootstrap_linux_worker.sh")
          bundle = Path("/app/bootstrap/linux-worker-bundle.tar.gz")
          digest = Path("/app/bootstrap/linux-worker-bundle.sha256").read_text().strip()
          assert hashlib.sha256(bundle.read_bytes()).hexdigest() == digest
          assert "--pairing-code" in bootstrap.read_text()
          assert "linux_worker_extension_pair.py" in bootstrap.read_text()
          with tarfile.open(bundle, "r:gz") as archive:
              names = set(archive.getnames())
              required = {
                  "chrome_extension/manifest.json",
                  "chrome_extension/background_entry.js",
                  "chrome_extension/conversation_routing.js",
                  "chrome_extension/background_window_observer_v90.js",
                  "chrome_extension/background_window_limit_v121.js",
                  "scripts/linux_worker_agent.py",
                  "scripts/linux_worker_agent_v44.py",
                  "scripts/linux_worker_extension_pair.py",
                  "scripts/linux_worker_remote_clipboard_v45.py",
                  "scripts/linux_worker_slot_agent.py",
                  "scripts/linux_worker_slot_install.sh",
                  "scripts/linux_worker_slot_install_reported.sh",
              }
              assert required <= names, sorted(required - names)
              manifest = json.load(archive.extractfile("chrome_extension/manifest.json"))
              entry = archive.extractfile("chrome_extension/background_entry.js").read().decode("utf-8")
              router = archive.extractfile("chrome_extension/conversation_routing.js").read().decode("utf-8")
              observer = archive.extractfile("chrome_extension/background_window_observer_v90.js").read().decode("utf-8")
              limiter = archive.extractfile("chrome_extension/background_window_limit_v121.js").read().decode("utf-8")
              pairer = archive.extractfile("scripts/linux_worker_extension_pair.py").read().decode("utf-8")
              slot = archive.extractfile("scripts/linux_worker_slot_install.sh").read().decode("utf-8")
          assert manifest["version"] == "0.8.34"
          assert "\"conversation_routing.js\"" in entry
          assert "single-route-window-authority-v30" in router
          assert "decision_authority: false" in observer
          assert "chrome.windows.getAll({ populate: true })" in observer
          assert "value.retireRoute(entry.key, route" in limiter
          assert "chrome.windows.create" not in limiter and "chrome.windows.remove" not in limiter
          assert "Runtime.evaluate" in pairer and "extension_pairing_code" in pairer
          assert "linux_worker_extension_pair.py" in slot and "--pairing-code" in slot
          assert Path("/app/app/linux_worker_device_authority_v124_patch.py").is_file()
          assert Path("/app/app/admin_linux_device_authority_v124.js").is_file()
          assert Path("/app/app/linux_worker_device_console_v122_patch.py").is_file()
          assert Path("/app/app/linux_worker_console_v123_patch.py").is_file()
          presentation = Path("/app/app/worker_presentation_v64_patch.py").read_text()
          assert "install_linux_worker_device_authority_v124_patch(app)" in presentation
          assert "install_linux_worker_device_console_v122_patch" not in presentation
          assert "install_linux_worker_console_v123_patch" not in presentation
          print(json.dumps({"bundle_version": manifest["version"], "linux_device_authority_v124": True, "extension_autopair": True, "sha256": digest}))
          '
      - name: Boot production ASGI entrypoint and verify health
        run: |
          set -euo pipefail
          cid="$(docker run -d -p 127.0.0.1:18765:8765 chat2api-production-smoke)"
          trap 'docker logs "$cid" || true; docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:18765/version > /tmp/chat2api-version.json; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" -eq 1 ] || { echo 'production ASGI entrypoint failed to become healthy' >&2; exit 1; }
          python - <<'PY'
          import json
          payload = json.load(open('/tmp/chat2api-version.json', encoding='utf-8'))
          assert payload['server']['runtime_aligned'] is True
          assert payload['server']['entrypoint'] == 'app.entry:app'
          assert payload['server']['runtime_version'] == '0.22.79'
          assert payload['chrome_bridge']['bundle_version'] == '0.8.34'
          assert payload['chrome_bridge']['route_window_authority_revision'] == 30
          assert payload['chrome_bridge']['window_observer_revision'] == 90
          assert payload['features']['linux_worker_device_authority_v124'] is True
          assert payload['features']['linux_worker_device_console_v122'] is False
          assert payload['features']['linux_worker_console_v123'] is False
          assert payload['features']['linux_worker_same_host_slots_v1'] is True
          assert payload['features']['linux_worker_remote_unicode_clipboard_v121'] is True
          assert payload['features']['worker_per_extension_window_limit_v121'] is True
          assert payload['features']['physical_startup_window_observer_v90'] is True
          assert payload['features']['same_api_parallel_requests'] is False
          assert payload['features']['browser_side_same_api_queue'] is False
          assert payload['features']['speculative_worker_windows'] is False
          print(json.dumps({'runtime': payload['server']['runtime_version'], 'worker_bundle': payload['chrome_bridge']['bundle_version'], 'linux_device_authority_v124': True}))
          PY