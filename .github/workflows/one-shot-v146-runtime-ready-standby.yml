name: One-shot v146 runtime-ready standby

on:
  push:
    branches:
      - fix/v146-runtime-ready-standby

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v146-runtime-ready-standby
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply v146 patch
        run: |
          # Rebase this generated test surface on main so the one-shot script
          # always sees its original v145 anchors, regardless of a prior failed run.
          git checkout origin/main -- tests/test_persistent_window_pool_v132.py
          python scripts/one_shot_v146_runtime_ready_standby.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_persistent_window_pool_v132.py')
          text = path.read_text(encoding='utf-8')
          old = "    assert 'while (rows.filter(row => row.routable).length < effectiveTarget)' in source"
          new = "    assert 'while (rows.filter(row => row.routable && (busyWindowIds(value).has(row.window_id) || row.runtime_ready === true)).length < effectiveTarget)' in source"
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: JavaScript syntax
        run: |
          node --check chrome_extension/conversation_persistent_pool_v132.js
          node --check chrome_extension/background_capacity_control_v35.js
      - name: Focused regression tests
        run: |
          python -m pip install -e '.[dev]' pytest-timeout
          pytest -q tests/test_persistent_window_pool_v132.py tests/test_worker_runtime_standby_release_v02298.py tests/test_runtime_ready_standby_v146.py tests/test_runtime_contract.py
          node tests/capacity_control_v35.mjs
      - name: Commit patch
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No patch changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chrome_extension/conversation_persistent_pool_v132.js chrome_extension/background_capacity_control_v35.js app/runtime_contract.py tests/test_persistent_window_pool_v132.py tests/test_worker_runtime_standby_release_v02298.py tests/capacity_control_v35.mjs tests/test_runtime_ready_standby_v146.py
          git commit -m 'v146: require runtime-ready standby windows'
          git push origin HEAD:fix/v146-runtime-ready-standby
