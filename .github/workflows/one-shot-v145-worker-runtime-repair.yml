name: One-shot v145 Worker runtime repair

on:
  push:
    branches:
      - fix/v145-worker-preflight-routable-standby

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v145-worker-preflight-routable-standby
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply v145 runtime and standby repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def patch(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrence(s), found {found}: {old[:120]!r}')
              text = text.replace(old, new, count)
              p.write_text(text, encoding='utf-8')

          pool = 'chrome_extension/conversation_persistent_pool_v132.js'
          patch(pool,
          '''  function snapshotFrom(rows, value, ready, isDisabled) {
            const target = normalizeTarget(state.target) || 0;
            const effective = target ? (isDisabled ? Math.min(1, target) : (ready ? target + inUse : Math.min(1, target))) : 0;
            const assigned = routeByWindow(value);
            const busy = busyWindowIds(value);
            const routedRows = rows.filter(row => assigned.has(row.window_id));
            const standbyRows = rows.filter(row => !assigned.has(row.window_id));
            const inUse = rows.filter(row => busy.has(row.window_id)).length;
          ''',
          '''  function snapshotFrom(rows, value, ready, isDisabled) {
            const target = normalizeTarget(state.target) || 0;
            const assigned = routeByWindow(value);
            const busy = busyWindowIds(value);
            const routableRows = rows.filter(row => row.routable);
            const unroutableRows = rows.filter(row => !row.routable);
            const routedRows = routableRows.filter(row => assigned.has(row.window_id));
            // “备用” means a currently routable idle window. An idle window keeps
            // serving as spare capacity even when it retains logical route affinity,
            // because v132 may reuse/reassign that idle slot on the next request.
            const standbyRows = routableRows.filter(row => !busy.has(row.window_id));
            const inUse = routableRows.filter(row => busy.has(row.window_id)).length;
            const effective = target ? (isDisabled ? Math.min(1, target) : (ready ? target + inUse : Math.min(1, target))) : 0;
          ''')
          patch(pool,
          '''      total: rows.length,
              active: inUse,
              idle: Math.max(0, rows.length - inUse),
              own: rows.length,
              warm: standbyRows.length,
              standby: standbyRows.length,
              routed: routedRows.length,
              idle_routed: routedRows.filter(row => !busy.has(row.window_id)).length,
              all_chatgpt_windows: rows.length,
          ''',
          '''      total: rows.length,
              routable_total: routableRows.length,
              unroutable_total: unroutableRows.length,
              active: inUse,
              idle: standbyRows.length,
              own: rows.length,
              warm: standbyRows.length,
              standby: standbyRows.length,
              routed: routedRows.length,
              idle_routed: routedRows.filter(row => !busy.has(row.window_id)).length,
              all_chatgpt_windows: rows.length,
              standby_semantics_revision: 145,
          ''')
          patch(pool,
          '''      excess: Math.max(0, rows.length - effective),
          ''',
          '''      excess: Math.max(0, routableRows.length - effective),
          ''')
          patch(pool,
          '''    let excess = Math.max(0, current.length - target);
          ''',
          '''    let excess = Math.max(0, current.filter(row => row.routable).length - target);
          ''')
          patch(pool,
          '''    const standby = current
              .filter(row => !assigned.has(row.window_id) && !busy.has(row.window_id))
          ''',
          '''    const standby = current
              .filter(row => row.routable && !assigned.has(row.window_id) && !busy.has(row.window_id))
          ''')
          patch(pool,
          '''    const busyBefore = busyWindowIds(value);
            const effectiveTarget = isDisabled ? Math.min(1, target) : (ready ? target + rows.filter(row => busyBefore.has(row.window_id)).length : Math.min(1, target));
          ''',
          '''    const busyBefore = busyWindowIds(value);
            const routableBefore = rows.filter(row => row.routable);
            const busyRoutableBefore = routableBefore.filter(row => busyBefore.has(row.window_id)).length;
            const effectiveTarget = isDisabled ? Math.min(1, target) : (ready ? target + busyRoutableBefore : Math.min(1, target));
          ''')
          patch(pool,
          '''      while (rows.length < effectiveTarget) {
          ''',
          '''      while (rows.filter(row => row.routable).length < effectiveTarget) {
          ''')
          patch(pool,
          '''      before_or_after_total: rows.length,
              opened,
          ''',
          '''      before_or_after_total: rows.length,
              routable_before_or_after_total: rows.filter(row => row.routable).length,
              standby_before_or_after_total: rows.filter(row => row.routable && !busyWindowIds(value).has(row.window_id)).length,
              standby_semantics_revision: 145,
              opened,
          ''')

          capacity = 'chrome_extension/background_capacity_control_v35.js'
          patch(capacity,
          '''    const reached = snapshot.login_ready === true && snapshot.worker_disabled !== true && Number(snapshot.total || 0) === target;
            let pendingReason = "";
            if (snapshot.worker_disabled === true) pendingReason = "worker_disabled";
            else if (snapshot.login_ready !== true) pendingReason = "login_not_ready";
            else if (Number(snapshot.total || 0) < target) pendingReason = "warming";
            else if (Number(snapshot.total || 0) > target) pendingReason = "busy_windows_protected";
          ''',
          '''    const standby = Number(snapshot.idle || snapshot.standby || 0);
            const reached = snapshot.login_ready === true && snapshot.worker_disabled !== true && standby === target;
            let pendingReason = "";
            if (snapshot.worker_disabled === true) pendingReason = "worker_disabled";
            else if (snapshot.login_ready !== true) pendingReason = "login_not_ready";
            else if (standby < target) pendingReason = "warming";
            else if (standby > target) pendingReason = "excess_standby";
          ''')
          patch(capacity,
          '''      reserve_window_idle: Number(snapshot?.idle || 0),
              reserve_window_target: Number(snapshot?.target || 0),
          ''',
          '''      reserve_window_idle: Number(snapshot?.idle || 0),
              reserve_window_target: Number(snapshot?.target || 0),
              reserve_window_routable_total: Number(snapshot?.routable_total || 0),
              reserve_window_unroutable_total: Number(snapshot?.unroutable_total || 0),
              reserve_window_standby_semantics_revision: Number(snapshot?.standby_semantics_revision || 145),
          ''')

          bootstrap = 'chrome_extension/content_bootstrap.js'
          patch(bootstrap,
          '''        files: ["network_stream_main_v55.js", "native_tool_stream_main_v63.js", "multimodal_main_v78.js"],
          ''',
          '''        files: ["network_stream_main_v55.js", "model_evidence_main_v144.js", "native_tool_stream_main_v63.js", "multimodal_main_v78.js"],
          ''')
          patch(bootstrap,
          '''          "content_bundle_marker_v71.js",
              "content_page_adapter_v22.js",
          ''',
          '''          "content_bundle_marker_v71.js",
              "content_page_adapter_v22.js",
              "content_model_evidence_v144.js",
          ''')

          main_evidence = 'chrome_extension/model_evidence_main_v144.js'
          patch(main_evidence,
          '''  const state = { version: 144, authority: null, sequence: 0, requests: 0, rewrites: 0, evidence: 0 };
            globalThis[KEY] = state;
          ''',
          '''  const state = { version: 144, authority: null, sequence: 0, requests: 0, rewrites: 0, evidence: 0 };
            globalThis[KEY] = state;
            try { document.documentElement?.setAttribute?.("data-chat2api-model-evidence-main-v144", "144"); } catch (_) {}
          ''')

          contract = 'chrome_extension/content_runtime_contract_v71.js'
          patch(contract,
          '''    const rich = globalThis.__CHAT2API_RICH_RESPONSE_V69__ || null;
            const choicePolicy = globalThis.__CHAT2API_CHATGPT_CHOICE_POLICY_V143__ || null;
          ''',
          '''    const rich = globalThis.__CHAT2API_RICH_RESPONSE_V69__ || null;
            const modelEvidence = globalThis.__CHAT2API_MODEL_EVIDENCE_V144__ || null;
            const choicePolicy = globalThis.__CHAT2API_CHATGPT_CHOICE_POLICY_V143__ || null;
          ''')
          patch(contract,
          '''      rich_response_v69: Boolean(rich),
              chatgpt_choice_policy_v143: Number(choicePolicy?.revision || 0) >= 143,
          ''',
          '''      rich_response_v69: Boolean(rich),
              model_evidence_v144: Number(modelEvidence?.version || 0) >= 144,
              model_evidence_main_v144: document.documentElement?.getAttribute?.("data-chat2api-model-evidence-main-v144") === "144",
              chatgpt_choice_policy_v143: Number(choicePolicy?.revision || 0) >= 143,
          ''')

          preflight = 'chrome_extension/background_runtime_preflight_v48.js'
          patch(preflight,
          '''  const MAIN_FILES = ["network_stream_main_v55.js", "multimodal_main_v78.js"];
            const NATIVE_MAIN_FILES = ["native_tool_stream_main_v63.js"];
            const CURRENT_MAIN_FILES = [MAIN_FILES[0], ...NATIVE_MAIN_FILES, MAIN_FILES[1]];
          ''',
          '''  const MAIN_FILES = ["network_stream_main_v55.js", "model_evidence_main_v144.js", "multimodal_main_v78.js"];
            const NATIVE_MAIN_FILES = ["native_tool_stream_main_v63.js"];
            const CURRENT_MAIN_FILES = [MAIN_FILES[0], MAIN_FILES[1], ...NATIVE_MAIN_FILES, MAIN_FILES[2]];
          ''')
          patch(preflight,
          '''    "content_ui_hygiene_v31.js", "content_rate_limit_guard_v52.js", "content_tool_isolation_v48.js",
          ''',
          '''    "content_model_evidence_v144.js", "content_ui_hygiene_v31.js", "content_rate_limit_guard_v52.js", "content_tool_isolation_v48.js",
          ''')
          patch(preflight,
          '''      result?.modules?.rich_response_v69 && result?.modules?.network_stream_recovery_v55 &&
          ''',
          '''      result?.modules?.rich_response_v69 && result?.modules?.model_evidence_v144 && result?.modules?.model_evidence_main_v144 &&
              result?.modules?.network_stream_recovery_v55 &&
          ''')
          patch(preflight,
          '''  async function waitForReloadOrContract(tabId, timeoutMs = RELOAD_BUDGET_MS) {
            const started = Date.now(); let last = null;
            while (Date.now() - started < timeoutMs) {
              const remaining = Math.max(100, timeoutMs - (Date.now() - started));
              last = await contract(tabId, Math.min(CONTRACT_TIMEOUT_MS, remaining));
              if (current(last)) return {ready: true, complete: false, result: last};
              let tab = null;
              try { tab = await chrome.tabs.get(tabId); } catch (_) { return {ready: false, complete: false, result: last}; }
              if (tab?.status === "complete" && /^https:\\/\\/(?:www\\.)?(?:chatgpt\\.com|chat\\.openai\\.com)\\//i.test(String(tab.url || "")))
                return {ready: false, complete: true, result: last};
              await sleep(80);
            }
            return {ready: false, complete: false, result: last};
          }
          ''',
          '''  async function waitForReloadOrContract(tabId, timeoutMs = RELOAD_BUDGET_MS) {
            const started = Date.now(); let last = null; let complete = false;
            // Do not treat the pre-reload document's transient "complete" state as
            // evidence that the replacement document is ready. Poll the contract
            // for the full bounded reload window and only report page completeness
            // as diagnostic context when the budget expires.
            while (Date.now() - started < timeoutMs) {
              const remaining = Math.max(100, timeoutMs - (Date.now() - started));
              last = await contract(tabId, Math.min(CONTRACT_TIMEOUT_MS, remaining));
              if (current(last)) return {ready: true, complete: true, result: last};
              let tab = null;
              try { tab = await chrome.tabs.get(tabId); } catch (_) { return {ready: false, complete: false, result: last}; }
              complete = tab?.status === "complete" && /^https:\\/\\/(?:www\\.)?(?:chatgpt\\.com|chat\\.openai\\.com)\\//i.test(String(tab.url || ""));
              await sleep(80);
            }
            return {ready: false, complete, result: last};
          }
          ''')
          patch(preflight,
          '''  async function recordLast(last) {
          ''',
          '''  function missingModules(result) {
            const modules = result?.modules && typeof result.modules === "object" ? result.modules : {};
            return Object.entries(modules).filter(([, ok]) => !ok).map(([name]) => name);
          }
          async function recordLast(last) {
          ''')
          patch(preflight,
          '''      await recordLast({tab_id: tabId, ok: false, mode: "repair-budget-exhausted-v87", response_terminal_owner: "request-v6",
                reloaded, hot_healed: hotHealed, result, elapsed_ms: Date.now()-started,
                budget_ms: CONTRACT_TIMEOUT_MS + HOT_HEAL_BUDGET_MS + RELOAD_BUDGET_MS + FINAL_HEAL_BUDGET_MS, at_ms: Date.now()});
              const error = new Error(`ChatGPT tab Worker runtime is stale or incomplete after the bounded preflight budget; required bundle ${REQUIRED_BUNDLE} content revision ${REQUIRED_REVISION} native-tool-stream revision 63 multimodal revision 85 terminal/prompt revision 88 conversation-quota-failover revision 95 UI-hygiene revision 101; response terminal owner request-v6`);
          ''',
          '''      const missing = missingModules(result);
              await recordLast({tab_id: tabId, ok: false, mode: "repair-budget-exhausted-v145", response_terminal_owner: "request-v6",
                reloaded, hot_healed: hotHealed, result, missing_modules: missing, elapsed_ms: Date.now()-started,
                budget_ms: CONTRACT_TIMEOUT_MS + HOT_HEAL_BUDGET_MS + RELOAD_BUDGET_MS + FINAL_HEAL_BUDGET_MS, at_ms: Date.now()});
              const marker = result?.marker ? `${String(result.marker.bundle || "?")}/${Number(result.marker.revision || 0)}` : "missing";
              const error = new Error(`ChatGPT tab Worker runtime is stale or incomplete after the bounded preflight budget; required bundle ${REQUIRED_BUNDLE} content revision ${REQUIRED_REVISION} native-tool-stream revision 63 multimodal revision 85 terminal/prompt revision 88 conversation-quota-failover revision 95 UI-hygiene revision 101 model-evidence revision 144; response terminal owner request-v6; observed marker ${marker}; missing modules ${missing.join(",") || "unknown"}`);
          ''')

          test_pool = 'tests/test_persistent_window_pool_v132.py'
          patch(test_pool,
          '''    assert 'while (rows.length < effectiveTarget)' in source
              assert 'target + rows.filter(row => busyBefore.has(row.window_id)).length' in source
              assert 'standbyRows.length === target' in source
          ''',
          '''    assert 'while (rows.filter(row => row.routable).length < effectiveTarget)' in source
              assert 'const busyRoutableBefore = routableBefore.filter(row => busyBefore.has(row.window_id)).length;' in source
              assert 'target + busyRoutableBefore' in source
              assert 'const standbyRows = routableRows.filter(row => !busy.has(row.window_id));' in source
              assert 'standbyRows.length === target' in source
          ''', 2)
          patch(test_pool,
          '''    assert 'Math.max(0, current.length - target)' in source
              assert 'all_chatgpt_windows: rows.length' in source
          ''',
          '''    assert 'Math.max(0, current.filter(row => row.routable).length - target)' in source
              assert 'routable_total: routableRows.length' in source
              assert 'unroutable_total: unroutableRows.length' in source
              assert 'standby_semantics_revision: 145' in source
              assert source.index('const inUse = routableRows.filter') < source.index('const effective = target ?')
              assert 'all_chatgpt_windows: rows.length' in source
          ''')
          patch(test_pool,
          '''    assert "persistent-prewarmed-total-window-pool-v132" in source
              assert 'window_decision_authority: "persistent-window-pool-v132"' in source
          ''',
          '''    assert "persistent-prewarmed-total-window-pool-v132" in source
              assert 'const standby = Number(snapshot.idle || snapshot.standby || 0);' in source
              assert 'standby === target' in source
              assert 'window_decision_authority: "persistent-window-pool-v132"' in source
          ''')

          preflight_test = 'tests/runtime_preflight_refresh_v71.mjs'
          patch(preflight_test,
          '''      rich_response_v69: true,
              network_stream_recovery_v55: true,
          ''',
          '''      rich_response_v69: true,
              model_evidence_v144: true,
              model_evidence_main_v144: true,
              network_stream_recovery_v55: true,
          ''')
          patch(preflight_test,
          '''  const worlds = [];
          ''',
          '''  const worlds = [];
            const injectedFiles = [];
          ''')
          patch(preflight_test,
          '''        worlds.push(options?.world || "ISOLATED");
                return [];
          ''',
          '''        worlds.push(options?.world || "ISOLATED");
                injectedFiles.push(...(options?.files || []));
                return [];
          ''')
          patch(preflight_test,
          '''  return { injected, reloads, baseEnsures, saved, worlds, state: context.__CHAT2API_BACKGROUND_RUNTIME_PREFLIGHT_V71__ };
          ''',
          '''  return { injected, reloads, baseEnsures, saved, worlds, injectedFiles, state: context.__CHAT2API_BACKGROUND_RUNTIME_PREFLIGHT_V71__ };
          ''')
          patch(preflight_test,
          '''assert.equal(hot.worlds[0], "MAIN");
          assert.equal(hot.state.last?.ok, true);
          ''',
          '''assert.equal(hot.worlds[0], "MAIN");
          assert.ok(hot.injectedFiles.includes("model_evidence_main_v144.js"));
          assert.ok(hot.injectedFiles.includes("content_model_evidence_v144.js"));
          assert.equal(hot.state.last?.ok, true);
          ''')

          model_test = 'tests/test_model_evidence_v144.py'
          patch(model_test,
          '''    assert "content_model_evidence_v144.js" in isolated_scripts
          ''',
          '''    assert "content_model_evidence_v144.js" in isolated_scripts

              bootstrap = (ROOT / "chrome_extension" / "content_bootstrap.js").read_text(encoding="utf-8")
              preflight = (ROOT / "chrome_extension" / "background_runtime_preflight_v48.js").read_text(encoding="utf-8")
              contract = (ROOT / "chrome_extension" / "content_runtime_contract_v71.js").read_text(encoding="utf-8")
              assert "model_evidence_main_v144.js" in bootstrap
              assert "content_model_evidence_v144.js" in bootstrap
              assert "model_evidence_main_v144.js" in preflight
              assert "content_model_evidence_v144.js" in preflight
              assert "model_evidence_v144" in contract
              assert "model_evidence_main_v144" in contract
          ''')

          print('v145 Worker runtime + standby repair applied')
          PY

          node --check chrome_extension/conversation_persistent_pool_v132.js
          node --check chrome_extension/background_capacity_control_v35.js
          node --check chrome_extension/content_bootstrap.js
          node --check chrome_extension/background_runtime_preflight_v48.js
          node --check chrome_extension/content_runtime_contract_v71.js
          node --check chrome_extension/model_evidence_main_v144.js
          node tests/runtime_preflight_refresh_v71.mjs
          python -m pytest -q tests/test_persistent_window_pool_v132.py tests/test_model_evidence_v144.py

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add chrome_extension tests
          if git diff --cached --quiet; then
            echo 'No patch changes remain; already applied.'
            exit 0
          fi
          git commit -m "fix: heal upgraded Worker tabs and maintain routable standby windows"
          git push origin HEAD:fix/v145-worker-preflight-routable-standby
