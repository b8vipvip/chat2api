name: Temporary v0.22.53 vision affinity stagger repair

on:
  push:
    branches:
      - fix/vision-affinity-window-stagger-v85-20260903

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/vision-affinity-window-stagger-v85-20260903
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply v0.22.53 repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          def read(path):
              return (root / path).read_text(encoding='utf-8')

          def write(path, text):
              p = root / path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding='utf-8')

          def replace(path, old, new, count=-1):
              text = read(path)
              if old not in text:
                  raise SystemExit(f'missing replacement anchor in {path}: {old[:120]!r}')
              updated = text.replace(old, new, count)
              write(path, updated)

          stagger = r'''(() => {
            const KEY = "__CHAT2API_WINDOW_OPEN_STAGGER_V85__";
            if (globalThis[KEY]) return;

            const REVISION = 85;
            const MIN_INTERVAL_MS = 15 * 1000;
            const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
            const state = {
              revision: REVISION,
              min_interval_ms: MIN_INTERVAL_MS,
              last_started_at: 0,
              sequence: 0,
              tail: Promise.resolve(),
              last: null,
            };

            async function create(options = {}, meta = {}) {
              const run = async () => {
                const now = Date.now();
                const waitMs = Math.max(0, Number(state.last_started_at || 0) + MIN_INTERVAL_MS - now);
                if (waitMs > 0) await delay(waitMs);
                const startedAt = Date.now();
                state.last_started_at = startedAt;
                state.sequence += 1;
                const reason = String(meta?.reason || "managed-chatgpt-window");
                state.last = {
                  sequence: state.sequence,
                  reason,
                  waited_ms: waitMs,
                  started_at_ms: startedAt,
                  min_interval_ms: MIN_INTERVAL_MS,
                };
                await chrome.storage.local.set({ chat2apiWindowOpenStaggerV85: state.last }).catch(() => {});
                return chrome.windows.create(options);
              };
              const task = state.tail.then(run, run);
              state.tail = task.then(() => undefined, () => undefined);
              return task;
            }

            globalThis[KEY] = state;
            globalThis.chat2apiCreateWindowStaggered = create;
          })();
          '''
          write('chrome_extension/background_window_open_stagger_v85.js', stagger)

          v85 = r'''(() => {
            const KEY = "__CHAT2API_MULTIMODAL_V4__";
            const prior = globalThis[KEY];
            if (!prior || Number(prior.revision || 0) < 84 || Number(prior.revision || 0) >= 85) return;

            const REVISION = 85;
            const CONTROLLER = "multimodal-upload-safe-submit-v85";
            const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
            const state = prior.state || {};
            state.safeSubmitGate = state.safeSubmitGate || { waits: 0, busy_seen: 0, timeouts: 0, last: null };

            function visible(element) {
              if (!element || typeof element.getBoundingClientRect !== "function") return false;
              try {
                const rect = element.getBoundingClientRect();
                const style = getComputedStyle(element);
                return rect.width > 0 && rect.height > 0 && style.display !== "none" && style.visibility !== "hidden" && Number(style.opacity || 1) !== 0;
              } catch (_) { return false; }
            }

            function composerRoot() {
              return [...document.querySelectorAll("form[data-type='unified-composer'], form")]
                .find(form => visible(form) && form.querySelector("#prompt-textarea,textarea,[contenteditable='true']")) || null;
            }

            const REMOVE_SELECTOR = [
              "[aria-label*='Remove file']", "[aria-label*='Remove attachment']",
              "[aria-label*='移除文件']", "[aria-label*='移除附件']", "[aria-label*='删除文件']",
            ].join(",");

            function unique(rows) { return [...new Set((rows || []).filter(Boolean))]; }

            function attachmentContainers() {
              const root = composerRoot();
              if (!root) return [];
              const result = [];
              const add = seed => {
                if (!seed || !root.contains(seed)) return;
                let node = seed;
                let fallback = seed.parentElement;
                for (let depth = 0; node && node !== root && depth < 8; depth += 1, node = node.parentElement) {
                  const hasMedia = Boolean(node.matches?.("img,video") || node.querySelector?.("img,video"));
                  const hasRemove = Boolean(node.matches?.(REMOVE_SELECTOR) || node.querySelector?.(REMOVE_SELECTOR));
                  if (hasMedia && hasRemove) { result.push(node); return; }
                  if (hasMedia) fallback = node;
                }
                if (fallback && root.contains(fallback)) result.push(fallback);
              };
              root.querySelectorAll(REMOVE_SELECTOR).forEach(add);
              root.querySelectorAll("img,video").forEach(media => {
                if (!visible(media)) return;
                const rect = media.getBoundingClientRect();
                if (rect.width < 32 || rect.height < 32) return;
                const label = `${media.alt || ""} ${media.getAttribute?.("aria-label") || ""} ${media.currentSrc || media.src || ""}`;
                if (/avatar|emoji|icon|logo/i.test(label)) return;
                add(media);
              });
              return unique(result);
            }

            function animatedStyle(node, pseudo = null) {
              let style;
              try { style = getComputedStyle(node, pseudo); } catch (_) { return null; }
              const name = String(style.animationName || "").trim().toLowerCase();
              const duration = String(style.animationDuration || "").trim();
              const iterations = String(style.animationIterationCount || "").trim().toLowerCase();
              if (!name || name === "none" || duration === "0s" || duration === "0ms") return null;
              return { name, duration, iterations, pseudo: pseudo || "element" };
            }

            function visualBusySnapshot() {
              const base = typeof prior.busySnapshot === "function" ? prior.busySnapshot() : null;
              if (base?.busy) return { ...base, source: "v84" };
              const evidence = typeof prior.evidence === "function" ? prior.evidence() : { chips: 0, media: 0 };
              const containers = attachmentContainers();
              const visibleAttachments = Math.max(Number(evidence?.chips || 0), Number(evidence?.media || 0), containers.length);
              for (const container of containers) {
                const svgAnimator = container.querySelector("animate,animateTransform,animateMotion");
                if (svgAnimator) return { busy: true, reason: "svg-animation", visible_attachments: visibleAttachments, marker: svgAnimator.tagName };
                const nodes = [container, ...container.querySelectorAll("*")].slice(0, 360);
                for (const node of nodes) {
                  if (!visible(node)) continue;
                  const rect = node.getBoundingClientRect();
                  if (rect.width < 5 || rect.height < 5 || rect.width > 160 || rect.height > 160) continue;
                  const label = `${node.className || ""} ${node.getAttribute?.("aria-label") || ""} ${node.getAttribute?.("data-testid") || ""}`;
                  if (/remove|close|delete|移除|删除/i.test(label)) continue;
                  for (const pseudo of [null, "::before", "::after"]) {
                    const animation = animatedStyle(node, pseudo);
                    if (!animation) continue;
                    return {
                      busy: true,
                      reason: pseudo ? "pseudo-element-animation" : "element-animation",
                      visible_attachments: visibleAttachments,
                      marker: `${animation.pseudo}:${animation.name}:${animation.duration}:${label}`.slice(0, 240),
                    };
                  }
                }
              }
              return { busy: false, reason: "quiet", visible_attachments: visibleAttachments, marker: "" };
            }

            function safetyGraceMs(bytes) {
              const size = Math.max(0, Number(bytes || 0));
              if (size <= 512 * 1024) return 8000;
              if (size <= 2 * 1024 * 1024) return 12000;
              return 18000;
            }

            async function emitDiagnostic(requestId, stage, extra = {}) {
              if (!requestId) return;
              try {
                await chrome.runtime.sendMessage({
                  type: "chat2api.event",
                  event: {
                    type: "chat.diagnostics",
                    request_id: requestId,
                    diagnostics: {
                      attachment_safe_submit_revision: REVISION,
                      attachment_safe_submit_stage: stage,
                      ...extra,
                    },
                  },
                });
              } catch (_) {}
            }

            async function waitForSafeSubmit(expectedCount, bytes, options = {}) {
              const requestId = String(options.request_id || "");
              const graceMs = Math.max(3000, Number(options.grace_ms || safetyGraceMs(bytes)));
              const timeoutMs = Math.max(90000, graceMs + 30000, Number(options.timeout_ms || 0));
              const deadline = Date.now() + timeoutMs;
              let quietSince = 0;
              let busySeen = false;
              let last = visualBusySnapshot();
              state.safeSubmitGate.waits += 1;
              await emitDiagnostic(requestId, "guarding", {
                attachment_expected_count: Number(expectedCount || 0),
                attachment_bytes: Number(bytes || 0),
                attachment_safe_grace_ms: graceMs,
                attachment_busy: Boolean(last.busy),
                attachment_busy_reason: last.reason,
              });
              while (Date.now() < deadline) {
                last = visualBusySnapshot();
                const present = last.visible_attachments >= Math.max(1, Number(expectedCount || 1));
                if (!present || last.busy) {
                  if (last.busy) {
                    busySeen = true;
                    state.safeSubmitGate.busy_seen += 1;
                  }
                  quietSince = 0;
                  await delay(160);
                  continue;
                }
                if (!quietSince) quietSince = Date.now();
                if (Date.now() - quietSince >= graceMs) {
                  const result = {
                    ok: true,
                    revision: REVISION,
                    busy_seen: busySeen,
                    grace_ms: graceMs,
                    quiet_ms: Date.now() - quietSince,
                    visible_attachments: last.visible_attachments,
                    waited_ms: timeoutMs - Math.max(0, deadline - Date.now()),
                  };
                  state.safeSubmitGate.last = { ...result, at_ms: Date.now() };
                  await emitDiagnostic(requestId, "ready", {
                    attachment_visible_count: result.visible_attachments,
                    attachment_safe_busy_seen: result.busy_seen,
                    attachment_safe_grace_ms: result.grace_ms,
                    attachment_safe_quiet_ms: result.quiet_ms,
                    attachment_safe_wait_ms: result.waited_ms,
                  });
                  return result;
                }
                await delay(160);
              }
              state.safeSubmitGate.timeouts += 1;
              state.safeSubmitGate.last = { ok: false, revision: REVISION, ...last, at_ms: Date.now() };
              await emitDiagnostic(requestId, "timeout", {
                attachment_visible_count: last.visible_attachments,
                attachment_busy: Boolean(last.busy),
                attachment_busy_reason: last.reason,
                attachment_busy_marker: last.marker,
                attachment_safe_grace_ms: graceMs,
              });
              throw new Error(`ChatGPT attachment did not remain safely upload-ready before timeout; visible=${last.visible_attachments}, busy=${Boolean(last.busy)}, reason=${last.reason}`);
            }

            async function attach(specs = [], options = {}) {
              const data = await prior.attach(specs, options);
              const count = Number(data?.attachments_count || 0);
              if (!count) return { ...data, attachment_safe_submit_v85: true, attachment_safe_submit_revision: REVISION };
              const bytes = Number(data?.attachment_bytes || 0);
              const safe = await waitForSafeSubmit(count, bytes, {
                request_id: options.request_id,
                timeout_ms: options.timeout_ms || 0,
              });
              const attempts = Array.isArray(data.attachment_attempts)
                ? data.attachment_attempts.map(item => ({
                    ...item,
                    upload_settle_revision: REVISION,
                    upload_safe_submit_revision: REVISION,
                    upload_safe_busy_seen: safe.busy_seen,
                    upload_safe_grace_ms: safe.grace_ms,
                    upload_safe_wait_ms: safe.waited_ms,
                  }))
                : data.attachment_attempts;
              return {
                ...data,
                attachments_controller: CONTROLLER,
                attachments_revision: REVISION,
                attachment_verification_revision: REVISION,
                attachment_attempts: attempts,
                attachment_safe_submit_v85: true,
                attachment_safe_submit_revision: REVISION,
                attachment_safe_busy_seen: safe.busy_seen,
                attachment_safe_grace_ms: safe.grace_ms,
                attachment_safe_wait_ms: safe.waited_ms,
                attachment_safe_quiet_ms: safe.quiet_ms,
              };
            }

            async function cleanup(names = []) { return prior.cleanup(names); }

            if (typeof prior.listener === "function") {
              try { chrome.runtime.onMessage.removeListener(prior.listener); } catch (_) {}
            }

            const listener = (message, _sender, sendResponse) => {
              if (message.type === "chat2api.attach.ping.v4") {
                sendResponse({ ok: true, controller: CONTROLLER, revision: REVISION });
                return false;
              }
              if (message.type === "chat2api.attach.prepare.v4") {
                attach(message.attachments || [], { request_id: message.request_id })
                  .then(data => sendResponse({ ok: true, data, controller: CONTROLLER, revision: REVISION }))
                  .catch(error => sendResponse({ ok: false, error: String(error?.message || error), controller: CONTROLLER, revision: REVISION }));
                return true;
              }
              if (message.type === "chat2api.attach.cleanup.v4") {
                cleanup(message.names || [])
                  .then(data => sendResponse({ ok: true, data, controller: CONTROLLER, revision: REVISION }))
                  .catch(error => sendResponse({ ok: false, error: String(error?.message || error), controller: CONTROLLER, revision: REVISION }));
                return true;
              }
              return false;
            };

            globalThis[KEY] = {
              ...prior,
              attach,
              cleanup,
              revision: REVISION,
              controller: CONTROLLER,
              listener,
              visualBusySnapshot,
              waitForSafeSubmit,
              safeSubmitGate: state.safeSubmitGate,
            };
            chrome.runtime.onMessage.addListener(listener);
          })();
          '''
          write('chrome_extension/content_multimodal_settle_v85.js', v85)

          # Five-minute same-key conversation retention and globally staggered managed window creation.
          replace('chrome_extension/conversation_routing.js', 'const IDLE_CLOSE_MS = 2 * 60 * 1000;', 'const IDLE_CLOSE_MS = 5 * 60 * 1000;')
          replace('chrome_extension/conversation_routing.js', '  const sleepLocal = ms => new Promise(resolve => setTimeout(resolve, ms));\n', '  const sleepLocal = ms => new Promise(resolve => setTimeout(resolve, ms));\n  const createManagedWindow = (options, reason) => typeof globalThis.chat2apiCreateWindowStaggered === "function"\n    ? globalThis.chat2apiCreateWindowStaggered(options, { reason })\n    : chrome.windows.create(options);\n')
          replace('chrome_extension/conversation_routing.js', 'const created = await chrome.windows.create({ url: requestedUrl, focused: false, type: "normal" });', 'const created = await createManagedWindow({ url: requestedUrl, focused: false, type: "normal" }, "routed-conversation");')

          replace('chrome_extension/background_reserve_pool_v29.js', 'const ROUTE_IDLE_CLOSE_MS = 2 * 60 * 1000;', 'const ROUTE_IDLE_CLOSE_MS = 5 * 60 * 1000;')
          replace('chrome_extension/background_reserve_pool_v29.js', '  const sleepReserve = ms => new Promise(resolve => setTimeout(resolve, ms));\n', '  const sleepReserve = ms => new Promise(resolve => setTimeout(resolve, ms));\n  const createManagedWindow = (options, reason) => typeof globalThis.chat2apiCreateWindowStaggered === "function"\n    ? globalThis.chat2apiCreateWindowStaggered(options, { reason })\n    : chrome.windows.create(options);\n')
          replace('chrome_extension/background_reserve_pool_v29.js', 'const created = await chrome.windows.create({ url: "https://chatgpt.com/", focused: false, type: "normal" });', 'const created = await createManagedWindow({ url: "https://chatgpt.com/", focused: false, type: "normal" }, "reserve-pool");')

          replace('chrome_extension/conversation_warm_pool_v2.js', '  const sleepWarm = ms => new Promise(resolve => setTimeout(resolve, ms));\n', '  const sleepWarm = ms => new Promise(resolve => setTimeout(resolve, ms));\n  const createManagedWindow = (options, reason) => typeof globalThis.chat2apiCreateWindowStaggered === "function"\n    ? globalThis.chat2apiCreateWindowStaggered(options, { reason })\n    : chrome.windows.create(options);\n')
          replace('chrome_extension/conversation_warm_pool_v2.js', 'const created = await chrome.windows.create({ url: WARM_URL, focused: false, type: "normal" });', 'const created = await createManagedWindow({ url: WARM_URL, focused: false, type: "normal" }, "warm-pool");')

          replace('chrome_extension/background_external_warm_v28.js', '  globalThis[KEY] = state;\n', '  globalThis[KEY] = state;\n  const createManagedWindow = (options, reason) => typeof globalThis.chat2apiCreateWindowStaggered === "function"\n    ? globalThis.chat2apiCreateWindowStaggered(options, { reason })\n    : chrome.windows.create(options);\n', 1)
          replace('chrome_extension/background_external_warm_v28.js', 'const created = await chrome.windows.create({ url: "https://chatgpt.com/", focused: false, type: "normal" });', 'const created = await createManagedWindow({ url: "https://chatgpt.com/", focused: false, type: "normal" }, "external-warm-bootstrap");')

          replace('chrome_extension/background_tab_supervisor_v32.js', '  globalThis[KEY] = state;\n', '  globalThis[KEY] = state;\n  const createManagedWindow = (options, reason) => typeof globalThis.chat2apiCreateWindowStaggered === "function"\n    ? globalThis.chat2apiCreateWindowStaggered(options, { reason })\n    : chrome.windows.create(options);\n', 1)
          replace('chrome_extension/background_tab_supervisor_v32.js', 'const created = await chrome.windows.create({ url: INIT_URL, focused: false, type: "normal" });', 'const created = await createManagedWindow({ url: INIT_URL, focused: false, type: "normal" }, "initialization");')
          old_overflow = '''      const target = await targetLimit();
      const surviving = [...current.workerTabs.values()].filter(row => liveIds.has(row.tab_id));
      const excess = Math.max(0, surviving.length - target);
      let closedOverflow = 0;
      if (excess > 0) {
        const candidates = surviving
          .filter(row => !row.active && row.tab_id !== current.loginTabId && row.tab_id !== init.id)
          .sort((a, b) => a.priority - b.priority || Number(a.last_active_at || 0) - Number(b.last_active_at || 0));
        closedOverflow = await removeTabs(candidates.slice(0, excess).map(row => row.tab_id));
      }
'''
          new_overflow = '''      const target = await targetLimit();
      const surviving = [...current.workerTabs.values()].filter(row => liveIds.has(row.tab_id));
      // reserve_window_target is a SPARE target. Routed same-key conversation
      // windows are intentionally retained by their own idle alarm and must never
      // be reclaimed merely because spare + routed exceeds the spare target.
      const spareKinds = new Set(["reserve", "warm", "external-warm"]);
      const spareSurviving = surviving.filter(row => spareKinds.has(row.kind));
      const routedSurviving = surviving.filter(row => row.kind === "route" || row.kind === "request");
      const excess = Math.max(0, spareSurviving.length - target);
      let closedOverflow = 0;
      if (excess > 0) {
        const candidates = spareSurviving
          .filter(row => !row.active && row.tab_id !== current.loginTabId && row.tab_id !== init.id)
          .sort((a, b) => a.priority - b.priority || Number(a.last_active_at || 0) - Number(b.last_active_at || 0));
        closedOverflow = await removeTabs(candidates.slice(0, excess).map(row => row.tab_id));
      }
'''
          replace('chrome_extension/background_tab_supervisor_v32.js', old_overflow, new_overflow)
          replace('chrome_extension/background_tab_supervisor_v32.js', '        managed_worker_tabs: surviving.length,\n        active_worker_tabs: surviving.filter(row => row.active).length,', '        managed_worker_tabs: surviving.length,\n        spare_worker_tabs: spareSurviving.length,\n        routed_worker_tabs: routedSurviving.length,\n        worker_target_semantics: "spares-only-v85",\n        active_worker_tabs: surviving.filter(row => row.active).length,')

          replace('chrome_extension/background_entry.js', '  "browser_tabs.js",\n', '  "browser_tabs.js",\n  "background_window_open_stagger_v85.js",\n')

          # Worker bundle / content runtime v85.
          manifest = read('chrome_extension/manifest.json').replace('"version": "0.8.22"', '"version": "0.8.23"')
          manifest = manifest.replace('        "content_multimodal_settle_v84.js",\n', '        "content_multimodal_settle_v84.js",\n        "content_multimodal_settle_v85.js",\n')
          write('chrome_extension/manifest.json', manifest)

          preflight = read('chrome_extension/background_runtime_preflight_v48.js')
          preflight = preflight.replace('Worker bundle 0.8.22', 'Worker bundle 0.8.23')
          preflight = preflight.replace('v84 attachment readiness gate', 'v84 readiness plus the v85 conservative safe-submit gate')
          preflight = preflight.replace('const REQUIRED_BUNDLE = "0.8.22";', 'const REQUIRED_BUNDLE = "0.8.23";')
          preflight = preflight.replace('    "content_multimodal_settle_v84.js",\n', '    "content_multimodal_settle_v84.js",\n    "content_multimodal_settle_v85.js",\n')
          preflight = preflight.replace('    multimodal_revision: 84,', '    multimodal_revision: 85,')
          preflight = preflight.replace('      result?.modules?.multimodal_v84 &&\n', '      result?.modules?.multimodal_v84 &&\n      result?.modules?.multimodal_v85 &&\n')
          preflight = preflight.replace('multimodal revision 84`', 'multimodal revision 85`')
          write('chrome_extension/background_runtime_preflight_v48.js', preflight)

          contract = read('chrome_extension/content_runtime_contract_v71.js')
          contract = contract.replace('const REQUIRED_BUNDLE = "0.8.22";', 'const REQUIRED_BUNDLE = "0.8.23";')
          contract = contract.replace('      multimodal_v84: Number(multimodal?.revision || 0) >= 84 && typeof multimodal?.waitForReady === "function",\n', '      multimodal_v84: Number(multimodal?.revision || 0) >= 84 && typeof multimodal?.waitForReady === "function",\n      multimodal_v85: Number(multimodal?.revision || 0) >= 85 && typeof multimodal?.waitForSafeSubmit === "function",\n')
          write('chrome_extension/content_runtime_contract_v71.js', contract)

          for marker in ['chrome_extension/content_bundle_marker_v48.js', 'chrome_extension/content_runtime_contract_v48.js']:
              text = read(marker).replace('0.8.22', '0.8.23')
              write(marker, text)
          marker = read('chrome_extension/content_bundle_marker_v71.js').replace('0.8.22', '0.8.23').replace('multimodal_revision: 84', 'multimodal_revision: 85')
          write('chrome_extension/content_bundle_marker_v71.js', marker)

          runtime = read('app/runtime_contract.py')
          runtime = runtime.replace('SERVER_RUNTIME_VERSION = "0.22.52"', 'SERVER_RUNTIME_VERSION = "0.22.53"')
          runtime = runtime.replace('CHROME_BRIDGE_BUNDLE_VERSION = "0.8.22"', 'CHROME_BRIDGE_BUNDLE_VERSION = "0.8.23"')
          runtime = runtime.replace('multimodal-upload-ready-v84-release-v02252"', 'multimodal-upload-ready-v84-multimodal-safe-submit-v85-affinity-idle-5m-window-stagger-v85-spare-target-semantics-v85-release-v02253"')
          runtime = runtime.replace('multimodal-upload-ready-v84-release-v0822"', 'multimodal-upload-ready-v84-multimodal-safe-submit-v85-affinity-idle-5m-window-stagger-v85-spare-target-semantics-v85-release-v0823"')
          runtime = runtime.replace('"multimodal_revision": 84,', '"multimodal_revision": 85,')
          feature_anchor = '            "multimodal_upload_ready_v84": True,\n'
          if '"multimodal_safe_submit_v85"' not in runtime:
              runtime = runtime.replace(feature_anchor, feature_anchor + '            "multimodal_safe_submit_v85": True,\n            "conversation_affinity_idle_5m_v85": True,\n            "managed_window_open_stagger_v85": True,\n            "reserve_spare_target_semantics_v85": True,\n')
          write('app/runtime_contract.py', runtime)

          # CI syntax coverage for the new files.
          ci = read('.github/workflows/ci.yml')
          ci = ci.replace('          node --check chrome_extension/content_multimodal_v4.js\n', '          node --check chrome_extension/content_multimodal_v4.js\n          node --check chrome_extension/content_multimodal_settle_v84.js\n          node --check chrome_extension/content_multimodal_settle_v85.js\n')
          ci = ci.replace('          node --check chrome_extension/browser_tabs.js\n', '          node --check chrome_extension/browser_tabs.js\n          node --check chrome_extension/background_window_open_stagger_v85.js\n')
          write('.github/workflows/ci.yml', ci)

          # Move all current-version test expectations with the release contract.
          for path in (root / 'tests').rglob('*'):
              if not path.is_file() or path.suffix not in {'.py', '.mjs', '.js'}:
                  continue
              text = path.read_text(encoding='utf-8')
