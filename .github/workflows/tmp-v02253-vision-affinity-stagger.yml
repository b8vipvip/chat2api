name: Temporary v0.22.53 vision affinity stagger repair

on:
  push:
    branches:
      - fix/vision-affinity-window-stagger-v85-20260903

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/vision-affinity-window-stagger-v85-20260903
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Apply repairs
        run: |
          python scripts/tmp_v02253_repair.py
          python scripts/tmp_v02253_fix_tests.py
          # GITHUB_TOKEN cannot push workflow-file updates. CI syntax coverage for
          # the new JS files is performed explicitly below, so keep ci.yml unchanged.
          git checkout -- .github/workflows/ci.yml
      - name: Verify contracts
        run: |
          grep -q 'SERVER_RUNTIME_VERSION = "0.22.53"' app/runtime_contract.py
          grep -q 'CHROME_BRIDGE_BUNDLE_VERSION = "0.8.23"' app/runtime_contract.py
          grep -q '"multimodal_revision": 85' app/runtime_contract.py
          grep -q '"version": "0.8.23"' chrome_extension/manifest.json
          grep -q 'const IDLE_CLOSE_MS = 5 \* 60 \* 1000' chrome_extension/conversation_routing.js
          grep -q 'const ROUTE_IDLE_CLOSE_MS = 5 \* 60 \* 1000' chrome_extension/background_reserve_pool_v29.js
          grep -q 'const MIN_INTERVAL_MS = 15 \* 1000' chrome_extension/background_window_open_stagger_v85.js
      - name: JavaScript syntax
        run: |
          node --check chrome_extension/background_window_open_stagger_v85.js
          node --check chrome_extension/content_multimodal_settle_v85.js
          node --check chrome_extension/conversation_routing.js
          node --check chrome_extension/conversation_warm_pool_v2.js
          node --check chrome_extension/background_external_warm_v28.js
          node --check chrome_extension/background_reserve_pool_v29.js
          node --check chrome_extension/background_tab_supervisor_v32.js
          node --check chrome_extension/background_runtime_preflight_v48.js
          node --check chrome_extension/content_runtime_contract_v71.js
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Full test suite
        run: pytest -q
      - name: VM contracts
        run: |
          node tests/tab_supervisor_v32.mjs
          node tests/reserve_pool_v29.mjs
          node tests/runtime_preflight_refresh_v71.mjs
      - name: Commit repaired release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app chrome_extension tests docs
          git rm scripts/tmp_v02253_repair.py scripts/tmp_v02253_fix_tests.py
          if git diff --cached --quiet; then
            echo 'No repair changes to commit.'
          else
            git commit -m 'Release v0.22.53 with safe vision submit and 5m affinity'
            git push origin HEAD:fix/vision-affinity-window-stagger-v85-20260903
          fi