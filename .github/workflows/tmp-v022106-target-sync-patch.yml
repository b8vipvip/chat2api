name: Temporary v0.22.106 target sync patch

on:
  push:
    branches:
      - fix/v022106-standby-target-sync

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v022106-standby-target-sync
          fetch-depth: 0
      - name: Apply server-authoritative reconnect target sync
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
          python -m py_compile app/main.py app/worker_limits_clipboard_v121_patch.py
          python -m pytest -q tests/test_worker_limits_clipboard_v121.py tests/test_persistent_window_pool_v132.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/main.py app/worker_limits_clipboard_v121_patch.py tests/test_worker_limits_clipboard_v121.py
          git commit -m "fix(worker): sync standby target immediately on reconnect"
          git push origin HEAD:fix/v022106-standby-target-sync
