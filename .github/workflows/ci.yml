name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -e '.[dev]'
      - name: Python compile
        run: |
          python -m compileall -q app
          python -m py_compile scripts/linux_worker_agent.py scripts/linux_worker_proxy.py scripts/linux_worker_remote_login.py
      - name: JavaScript syntax
        run: |
          node --check chrome_extension/content.js
          node --check chrome_extension/content_page_adapter_v22.js
          node --check chrome_extension/content_login_v27.js
          node --check chrome_extension/content_page_driver_v22.js
          node --check chrome_extension/content_page_smoke_v22.js
          node --check chrome_extension/content_request_v2.js
          node --check chrome_extension/content_request_v3.js
          node --check chrome_extension/content_request_v4.js
          node --check chrome_extension/content_request_v5.js
          node --check chrome_extension/content_request_perf_v21.js
          node --check chrome_extension/content_completion_v6.js
          node --check chrome_extension/content_completion_fast_v21.js
          node --check chrome_extension/content_reasoning_transport_v20.js
          node --check chrome_extension/content_format_v20.js
          node --check chrome_extension/content_account_v20.js
          node --check chrome_extension/content_model_v5.js
          node --check chrome_extension/content_model_fast_v21.js
          node --check chrome_extension/content_model_v6.js
          node --check chrome_extension/content_model_cache_migrate_v7.js
          node --check chrome_extension/content_model_v7.js
          node --check chrome_extension/content_model_transition_v15.js
          node --check chrome_extension/content_reasoning_v7.js
          node --check chrome_extension/content_multimodal.js
          node --check chrome_extension/content_multimodal_v4.js
          node --check chrome_extension/content_guard.js
          node --check chrome_extension/content_image.js
          node --check chrome_extension/content_image_v3.js
          node --check chrome_extension/content_voice.js
          node --check chrome_extension/content_voice_v2.js
          node --check chrome_extension/content_voice_fix_v3.js
          node --check chrome_extension/content_voice_fix_v4.js
          node --check chrome_extension/content_voice_live.js
          node --check chrome_extension/content_voice_live_text_v24.js
          node --check chrome_extension/content_runtime_log.js
          node --check chrome_extension/content_dictation.js
          node --check chrome_extension/content_dictation_v3.js
          node --check chrome_extension/content_dictation_v4.js
          node --check chrome_extension/voice_main.js
          node --check chrome_extension/voice_main_v2.js
          node --check chrome_extension/voice_live_main.js
          node --check chrome_extension/content_bootstrap.js
          node --check chrome_extension/model_routing.js
          node --check chrome_extension/model_routing_v2.js
          node --check chrome_extension/model_prefetch_fast_v21.js
          node --check chrome_extension/model_affinity_v23.js
          node --check chrome_extension/model_contract_v25.js
          node --check chrome_extension/image_routing.js
          node --check chrome_extension/image_routing_v3.js
          node --check chrome_extension/voice_routing.js
          node --check chrome_extension/audio_routing_v2.js
          node --check chrome_extension/audio_routing_v3.js
          node --check chrome_extension/audio_routing_v4.js
          node --check chrome_extension/audio_routing_live.js
          node --check chrome_extension/browser_tabs.js
          node --check chrome_extension/background.js
          node --check chrome_extension/background_page_smoke_v22.js
          node --check chrome_extension/background_device_v17.js
          node --check chrome_extension/background_account_v20.js
          node --check chrome_extension/background_time_v14.js
          node --check chrome_extension/background_platform_v26.js
          node --check chrome_extension/background_network_v26.js
          node --check chrome_extension/background_login_v27.js
          node --check chrome_extension/background_worker_binding_v30.js
          node --check chrome_extension/background_external_warm_v28.js
          node --check chrome_extension/background_tab_supervisor_v32.js
          node --check chrome_extension/background_hardening.js
          node --check chrome_extension/background_socket_singleflight_v21.js
          node --check chrome_extension/background_logging.js
          node --check chrome_extension/conversation_routing.js
          node --check chrome_extension/conversation_warm_pool_v2.js
          node --check chrome_extension/conversation_workers_v24.js
          node --check chrome_extension/conversation_dispatch.js
          node --check chrome_extension/popup.js
          node --check chrome_extension/popup_page_smoke_v22.js
          node --check chrome_extension/popup_logging.js
          node --check app/admin_v6.js
          node --check app/admin_v7.js
          node --check app/admin_v8.js
          node --check app/admin_v9.js
          node --check app/admin_v10.js
          node --check app/admin_v11.js
          node --check app/admin_v12.js
          node --check app/admin_v13.js
          node --check app/admin_v14.js
          node --check app/admin_v15.js
          node --check app/admin_v16.js
          node --check app/admin_v17.js
          node --check app/admin_v17_1.js
          node --check app/admin_v18.js
          node --check app/admin_v20.js
          node --check app/admin_v20_1.js
          node --check app/admin_v20_2.js
          node --check app/admin_v20_3.js
          node --check app/admin_v21.js
          node --check app/admin_v21_1.js
          node --check app/admin_v21_3.js
          node --check app/admin_v21_4.js
          node --check app/admin_v21_5.js
          node --check app/admin_v21_6.js
          node --check app/admin_extension_columns.js
          node --check app/admin_linux_workers.js
          python - <<'PY'
          import re
          from pathlib import Path
          from app.admin import ADMIN_HTML
          match = re.search(r"<script>(.*)</script>", ADMIN_HTML, re.S)
          assert match, "admin console script not found"
          Path("/tmp/chat2api-admin.js").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/chat2api-admin.js
      - name: Linux worker installer syntax
        run: |
          bash -n scripts/install_linux_worker_autostart.sh
          bash -n scripts/bootstrap_linux_worker.sh
          bash -n scripts/linux_worker_proxy_apply.sh
      - name: Page Driver VM contract
        run: node tests/page_driver_dispatch_key_v22.mjs
      - name: Reasoning key fallback VM contract
        run: node tests/reasoning_key_fallback_v9.mjs
      - name: Network and platform VM contract
        run: node tests/network_platform_v26.mjs
      - name: Login readiness VM contract
        run: node tests/login_readiness_v27.mjs
      - name: Login authority VM contract
        run: node tests/login_authority_v32.mjs
      - name: Worker tab supervisor VM contract
        run: node tests/tab_supervisor_v32.mjs
      - name: External warm bootstrap VM contract
        run: node tests/external_warm_bootstrap_v28.mjs
      - name: Tests
        run: pytest -q
