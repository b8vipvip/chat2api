          node --check chrome_extension/content_probe_supervisor_v1.js
          node --check app/admin_extension_columns.js
          node --check app/admin_linux_workers.js
          python - <<'PY'
          import re
          from pathlib import Path
          from app.admin import ADMIN_HTML
          match = re.search(r"<script>(.*)</script>", ADMIN_HTML, re.S)
          assert match, "admin console script not found"
          Path("/tmp/chat2api-admin.js").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/chat2api-admin.js
