          node --check chrome_extension/content_model_v5.js
          node --check chrome_extension/content_model_fast_v21.js
          node --check chrome_extension/content_model_v6.js
          node --check chrome_extension/content_model_cache_migrate_v7.js
          node --check chrome_extension/content_model_v7.js
          node --check chrome_extension/content_model_transition_v15.js
          node --check chrome_extension/content_reasoning_v7.js
          node --check chrome_extension/content_multimodal.js
