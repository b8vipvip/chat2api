name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -e '.[dev]' pytest-timeout
      - name: Python compile
        run: |
          python -m compileall -q app
          python -m py_compile scripts/linux_worker_agent.py scripts/linux_worker_proxy.py scripts/linux_worker_remote_login.py
      - name: JavaScript syntax
        run: |
          node --check chrome_extension/content.js
          node --check chrome_extension/content_page_adapter_v22.js
          node --check chrome_extension/content_login_v27.js
          node --check chrome_extension/content_page_driver_v22.js
          node --check chrome_extension/content_page_smoke_v22.js
          node --check chrome_extension/content_request_v2.js
          node --check chrome_extension/content_request_v3.js
