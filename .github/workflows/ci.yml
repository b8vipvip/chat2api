name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -e '.[dev]'
      - name: Python compile
        run: python -m compileall -q app
      - name: JavaScript syntax
        run: |
          node --check chrome_extension/content.js
          node --check chrome_extension/content_model_v5.js
          node --check chrome_extension/content_model_v6.js
          node --check chrome_extension/model_routing.js
          node --check chrome_extension/background.js
      - name: Tests
        run: pytest -q
