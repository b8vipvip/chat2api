name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -e '.[dev]'
      - name: Python compile
        run: python -m compileall -q app
      - name: JavaScript syntax
        run: |
          node --check chrome_extension/content.js
          node --check chrome_extension/content_request_v2.js
          node --check chrome_extension/content_request_v3.js
          node --check chrome_extension/content_request_v4.js
          node --check chrome_extension/content_model_v5.js
          node --check chrome_extension/content_model_v6.js
          node --check chrome_extension/content_multimodal.js
          node --check chrome_extension/content_multimodal_v4.js
          node --check chrome_extension/content_guard.js
          node --check chrome_extension/content_image.js
          node --check chrome_extension/content_image_v3.js
          node --check chrome_extension/content_voice.js
          node --check chrome_extension/content_voice_v2.js
          node --check chrome_extension/content_voice_fix_v3.js
          node --check chrome_extension/content_voice_fix_v4.js
          node --check chrome_extension/content_runtime_log.js
          node --check chrome_extension/content_dictation.js
          node --check chrome_extension/content_dictation_v3.js
          node --check chrome_extension/content_dictation_v4.js
          node --check chrome_extension/voice_main.js
          node --check chrome_extension/voice_main_v2.js
          node --check chrome_extension/content_bootstrap.js
          node --check chrome_extension/model_routing.js
          node --check chrome_extension/image_routing.js
          node --check chrome_extension/image_routing_v3.js
          node --check chrome_extension/voice_routing.js
          node --check chrome_extension/audio_routing_v2.js
          node --check chrome_extension/audio_routing_v3.js
          node --check chrome_extension/audio_routing_v4.js
          node --check chrome_extension/browser_tabs.js
          node --check chrome_extension/background.js
          node --check chrome_extension/background_hardening.js
          node --check chrome_extension/background_logging.js
          node --check chrome_extension/popup.js
          node --check chrome_extension/popup_logging.js
          node --check app/admin_v6.js
          node --check app/admin_v7.js
          node --check app/admin_v8.js
          node --check app/admin_v9.js
          node --check app/admin_v10.js
          node --check app/admin_v11.js
          python - <<'PY'
          import re
          from pathlib import Path
          from app.admin import ADMIN_HTML
          match = re.search(r"<script>(.*)</script>", ADMIN_HTML, re.S)
          assert match, "admin console script not found"
          Path("/tmp/chat2api-admin.js").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/chat2api-admin.js
      - name: Tests
        run: pytest -q
