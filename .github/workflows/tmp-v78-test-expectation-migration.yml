name: Temporary v78 runtime test expectation migration

on:
  push:
    branches:
      - fix/vision-routing-upload-v78-release-20260903

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/vision-routing-upload-v78-release-20260903
          fetch-depth: 0
      - name: Update runtime epoch assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          for path in Path('tests').glob('test_*.py'):
              text = path.read_text(encoding='utf-8')
              text = text.replace('bundle-0817', 'bundle-0818')
              text = text.replace(
                  'const MAIN_FILES = ["network_stream_main_v55.js"]',
                  'const MAIN_FILES = ["network_stream_main_v55.js", "multimodal_main_v78.js"]',
              )
              path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/tmp-v78-test-expectation-migration.yml
      - name: Commit migrated assertions and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'chat2api-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tests .github/workflows/tmp-v78-test-expectation-migration.yml
          git commit -m 'Align runtime epoch tests with multimodal v78'
          git push origin HEAD:fix/vision-routing-upload-v78-release-20260903
