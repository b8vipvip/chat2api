name: Actions Recovery

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Source workflow run ID
        required: true
        type: string
      source_workflow_id:
        description: Source workflow ID
        required: true
        type: string
      source_workflow_name:
        description: Source workflow name
        required: true
        type: string
      source_branch:
        description: Source branch
        required: false
        type: string
      source_head_sha:
        description: Source head SHA
        required: true
        type: string
      source_event:
        description: Source event
        required: false
        type: string
      source_workflow_path:
        description: Source workflow path
        required: false
        type: string
      source_run_attempt:
        description: Source run attempt
        required: false
        default: '1'
        type: string
      recovery_reason:
        description: Recovery reason
        required: true
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: actions-recovery-${{ inputs.source_workflow_id }}-${{ inputs.source_run_id }}
  cancel-in-progress: true

jobs:
  recover:
    name: Repair and summarize abnormal workflow
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_head_sha }}
          fetch-depth: 0

      - name: Collect source run evidence
        id: evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_WORKFLOW_PATH: ${{ inputs.source_workflow_path }}
        run: |
          set -Eeuo pipefail
          mkdir -p .actions-recovery
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" > .actions-recovery/run.json
          gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json jobs > .actions-recovery/jobs.json 2>/dev/null || echo '{"jobs":[]}' > .actions-recovery/jobs.json
          gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --log > .actions-recovery/source.log 2>&1 || true
          workflow_path="$SOURCE_WORKFLOW_PATH"
          if [[ -z "$workflow_path" ]]; then
            workflow_path="$(jq -r '.path // ""' .actions-recovery/run.json)"
          fi
          echo "workflow_path=$workflow_path" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$(jq -r '.run_attempt // 1' .actions-recovery/run.json)" >> "$GITHUB_OUTPUT"
          echo "default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')" >> "$GITHUB_OUTPUT"

      - name: Load current GitHub Agent repair logic
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ steps.evidence.outputs.default_branch }}
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git show "origin/$DEFAULT_BRANCH:.github/scripts/actions_strategy_autofix.py" > /tmp/actions_strategy_autofix.py
          if git cat-file -e "origin/$DEFAULT_BRANCH:.github/actions-recovery.sh" 2>/dev/null; then
            git show "origin/$DEFAULT_BRANCH:.github/actions-recovery.sh" > /tmp/actions-recovery.sh
            chmod +x /tmp/actions-recovery.sh
          fi

      - name: Apply deterministic automatic repair
        id: repair
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_WORKFLOW_NAME: ${{ inputs.source_workflow_name }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_HEAD_SHA: ${{ inputs.source_head_sha }}
          SOURCE_EVENT: ${{ inputs.source_event }}
          RECOVERY_REASON: ${{ inputs.recovery_reason }}
          ACTIONS_RECOVERY_LOG: ${{ github.workspace }}/.actions-recovery/source.log
          WORKFLOW_PATH: ${{ steps.evidence.outputs.workflow_path }}
        run: |
          set -Eeuo pipefail
          repaired=false
          if [[ -n "$WORKFLOW_PATH" && -f "$WORKFLOW_PATH" && -f /tmp/actions_strategy_autofix.py ]]; then
            before="$(git status --porcelain)"
            python /tmp/actions_strategy_autofix.py "$WORKFLOW_PATH"
            after="$(git status --porcelain)"
            [[ "$after" != "$before" ]] && repaired=true
          fi
          if [[ -f /tmp/actions-recovery.sh ]]; then
            before="$(git status --porcelain)"
            bash /tmp/actions-recovery.sh
            after="$(git status --porcelain)"
            [[ "$after" != "$before" ]] && repaired=true
          fi
          echo "repaired=$repaired" >> "$GITHUB_OUTPUT"
          git status --short

      - name: Submit deterministic repair
        if: steps.repair.outputs.repaired == 'true'
        id: submit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          DEFAULT_BRANCH: ${{ steps.evidence.outputs.default_branch }}
        run: |
          set -Eeuo pipefail
          repair_branch="actions-recovery/run-${SOURCE_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$repair_branch"
          git add -A
          git reset -- .actions-recovery 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "repair_ref=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "ci(recovery): repair Actions run ${SOURCE_RUN_ID}"
          git push --force origin "HEAD:${repair_branch}"
          base="$SOURCE_BRANCH"
          [[ -z "$base" ]] && base="$DEFAULT_BRANCH"
          existing_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$repair_branch" --state open --json url --jq '.[0].url // ""')"
          if [[ -z "$existing_pr" ]]; then
            pr_body="GitHub Agent deterministic recovery."$'\n\n'"Source run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}"$'\n\n'"This PR contains only policy-level or repository-defined deterministic repairs."
            existing_pr="$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$base" --head "$repair_branch" --title "ci(recovery): repair abnormal Actions run ${SOURCE_RUN_ID}" --body "$pr_body")"
          fi
          echo "repair_ref=$repair_branch" >> "$GITHUB_OUTPUT"
          echo "repair_pr=$existing_pr" >> "$GITHUB_OUTPUT"

      - name: Classify workflow and evidence
        id: classify
        shell: bash
        env:
          WORKFLOW_NAME: ${{ inputs.source_workflow_name }}
        run: |
          set -Eeuo pipefail
          lower="$(tr '[:upper:]' '[:lower:]' <<<"$WORKFLOW_NAME")"
          side_effectful=false
          if [[ "$lower" == *release* || "$lower" == *deploy* || "$lower" == *publish* || "$lower" == *store*package* ]]; then side_effectful=true; fi
          echo "side_effectful=$side_effectful" >> "$GITHUB_OUTPUT"
          transient=false
          if grep -Eiq 'ECONNRESET|ETIMEDOUT|ENOTFOUND|temporary failure|connection reset|connection timed out|runner.*lost|service unavailable|HTTP (502|503|504)|TLS handshake timeout' .actions-recovery/source.log; then
            transient=true
          fi
          echo "transient=$transient" >> "$GITHUB_OUTPUT"

      - name: Resubmit repaired workflow
        if: steps.repair.outputs.repaired == 'true' && steps.classify.outputs.side_effectful != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_ID: ${{ inputs.source_workflow_id }}
          REPAIR_REF: ${{ steps.submit.outputs.repair_ref }}
        run: |
          set -Eeuo pipefail
          [[ -n "$REPAIR_REF" ]]
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_ID/dispatches" -f ref="$REPAIR_REF"

      - name: Retry clearly transient failure once
        if: steps.repair.outputs.repaired != 'true' && steps.classify.outputs.side_effectful != 'true' && steps.classify.outputs.transient == 'true'
        id: retry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RUN_ATTEMPT: ${{ steps.evidence.outputs.run_attempt }}
        run: |
          set -Eeuo pipefail
          if (( RUN_ATTEMPT >= 2 )); then
            echo "retry_started=false" >> "$GITHUB_OUTPUT"
            echo "retry_exhausted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/rerun" >/dev/null
          echo "retry_started=true" >> "$GITHUB_OUTPUT"
          echo "retry_exhausted=false" >> "$GITHUB_OUTPUT"

      - name: Build AI Repair Brief
        if: always() && (steps.repair.outputs.repaired != 'true' || steps.classify.outputs.side_effectful == 'true' || failure())
        id: brief
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_WORKFLOW_NAME: ${{ inputs.source_workflow_name }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_HEAD_SHA: ${{ inputs.source_head_sha }}
          SOURCE_EVENT: ${{ inputs.source_event }}
          RECOVERY_REASON: ${{ inputs.recovery_reason }}
          WORKFLOW_PATH: ${{ steps.evidence.outputs.workflow_path }}
          RUN_ATTEMPT: ${{ steps.evidence.outputs.run_attempt }}
          REPAIRED: ${{ steps.repair.outputs.repaired }}
          SIDE_EFFECTFUL: ${{ steps.classify.outputs.side_effectful }}
          TRANSIENT: ${{ steps.classify.outputs.transient }}
          REPAIR_PR: ${{ steps.submit.outputs.repair_pr }}
          RETRY_STARTED: ${{ steps.retry.outputs.retry_started }}
        run: |
          set -Eeuo pipefail
          mkdir -p .actions-recovery
          failing_jobs="$(jq -r '.jobs[]? | select((.conclusion // "") != "success" and (.conclusion // "") != "skipped") | "- Job: **" + (.name // "unknown") + "** — conclusion: `" + (.conclusion // "unknown") + "`" + (([.steps[]? | select((.conclusion // "") == "failure") | .name] | if length > 0 then " — failed step(s): " + join(", ") else "" end))' .actions-recovery/jobs.json 2>/dev/null || true)"
          [[ -z "$failing_jobs" ]] && failing_jobs="- GitHub did not expose a failed job/step summary; inspect the source Run directly."
          signal_lines="$(grep -Ein 'error|failed|failure|traceback|assert|exception|timeout|timed out|fatal|hang|cancelled|canceled|ECONNRESET|ETIMEDOUT|ENOTFOUND|502|503|504' .actions-recovery/source.log 2>/dev/null | tail -n 40 | cut -c1-360 || true)"
          [[ -z "$signal_lines" ]] && signal_lines="No high-signal error lines extracted automatically. Read the full source Run log."
          {
            echo "# GitHub Agent — AI Repair Brief"
            echo
            echo "GitHub Agent could not safely determine a complete code fix. **No coding-agent provider is called automatically.** This Issue is the handoff package for the AI chosen by the user."
            echo
            echo "## Source"
            echo
            echo "- Repository: \`$GITHUB_REPOSITORY\`"
            echo "- Source Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID"
            echo "- Workflow: **$SOURCE_WORKFLOW_NAME**"
            echo "- Workflow file: \`${WORKFLOW_PATH:-unknown}\`"
            echo "- Branch: \`${SOURCE_BRANCH:-unknown}\`"
            echo "- Commit: https://github.com/$GITHUB_REPOSITORY/commit/$SOURCE_HEAD_SHA"
            echo "- Event: \`${SOURCE_EVENT:-unknown}\`"
            echo "- Run attempt: \`${RUN_ATTEMPT:-unknown}\`"
            echo "- Governor / Recovery reason: **$RECOVERY_REASON**"
            echo
            echo "## GitHub Agent classification"
            echo
            echo "- Deterministic repair produced: **${REPAIRED:-false}**"
            echo "- Deterministic repair PR: ${REPAIR_PR:-none}"
            echo "- Side-effectful workflow: **${SIDE_EFFECTFUL:-unknown}**"
            echo "- Transient infrastructure signature detected: **${TRANSIENT:-unknown}**"
            echo "- Fresh rerun started: **${RETRY_STARTED:-false}**"
            echo
            echo "## Failed jobs / steps"
            echo
            printf '%s\n' "$failing_jobs"
            echo
            echo "## High-signal log lines"
            echo
            echo '```text'
            printf '%s\n' "$signal_lines"
            echo '```'
            echo
            echo "> The excerpt is only a locator. The AI must inspect the full Run log before changing code."
            echo
            echo "## Task for the AI"
            echo
            echo "1. Read this Issue, the full source Run, the source Commit, and the relevant repository code."
            echo "2. Check whether the source Commit has already been superseded by a newer fix; do not repair obsolete code blindly."
            echo "3. Identify the root cause, including why the job hung/failed and why existing tests or guards did not catch it earlier."
            echo "4. Create a dedicated repair branch; **do not write directly to main**."
            echo "5. Modify workflow/code/tests/configuration as required by the actual root cause."
            echo "6. Re-run the original failing test/job plus related regression tests and GitHub Agent Policy Check."
            echo "7. Open/update a PR containing: root cause, files changed, verification evidence, remaining risk."
            echo "8. Do not blindly replay Release / Deploy / Publish / Store Package side effects."
            echo
            echo "## Acceptance criteria"
            echo
            echo "- Original failure/hang is reproducibly addressed."
            echo "- The relevant CI no longer hangs indefinitely."
            echo "- New/changed Workflow remains compliant with GitHub Agent guards."
            echo "- No unrelated behavior is weakened just to make CI green."
            echo "- The repair is auditable through branch + commit + PR + CI."
          } > .actions-recovery/ai-repair-brief.md

      - name: Open or update AI Repair Issue
        if: always() && (steps.repair.outputs.repaired != 'true' || steps.classify.outputs.side_effectful == 'true' || failure())
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_WORKFLOW_NAME: ${{ inputs.source_workflow_name }}
        run: |
          set -Eeuo pipefail
          title="[GitHub Agent][AI Repair] ${SOURCE_WORKFLOW_NAME} run ${SOURCE_RUN_ID}"
          body_file=".actions-recovery/ai-repair-brief.md"
          if [[ ! -f "$body_file" ]]; then
            printf '# GitHub Agent — AI Repair Brief\n\nSource Run: https://github.com/%s/actions/runs/%s\n\nAutomatic evidence packaging failed; ask the AI to inspect the full Run directly.\n' "$GITHUB_REPOSITORY" "$SOURCE_RUN_ID" > "$body_file"
          fi
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // ""')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body_file"
          fi
