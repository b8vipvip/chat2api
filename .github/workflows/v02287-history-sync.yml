name: v0.22.87 history sync

on:
  workflow_dispatch:
  push:
    branches:
      - release/login-ready-v02287

permissions:
  contents: write

concurrency:
  group: v02287-history-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/login-ready-v02287
      - name: Preserve oldest compatibility history marker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('app/runtime_contract.py')
          text = path.read_text(encoding='utf-8')
          old = 'PREVIOUS_PREVIOUS_PREVIOUS_PREVIOUS_SERVER_RUNTIME_VERSION = "0.22.83"'
          new = 'PREVIOUS_PREVIOUS_PREVIOUS_PREVIOUS_SERVER_RUNTIME_VERSION = "0.22.82"'
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          elif new not in text:
              raise SystemExit('expected compatibility history marker is missing')
          PY
          if git diff --quiet -- app/runtime_contract.py; then
            echo 'Compatibility history already preserved.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/runtime_contract.py
          git commit -m 'fix: preserve legacy runtime history marker for v0.22.87'
          git push origin HEAD:release/login-ready-v02287
