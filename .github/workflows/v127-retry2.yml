name: v127 finish regression alignment

on:
  push:
    branches:
      - feat/device-controller-shared-config-v127-20260912

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/device-controller-shared-config-v127-20260912
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Replay v127 finalized transformations
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          lines=Path('.github/workflows/v127-retry.yml').read_text(encoding='utf-8').splitlines()
          marker='      - name: Replay v127 source and test transformations'
          start=lines.index(marker)
          run=next(i for i in range(start+1,len(lines)) if lines[i]=='        run: |')
          out=[]
          for line in lines[run+1:]:
              if line.startswith('      - name: '): break
              if line.startswith('          '): out.append(line[10:])
              elif line.strip(): raise SystemExit(f'unexpected indentation: {line!r}')
              else: out.append('')
          result=subprocess.run(['bash','-e','-c','\n'.join(out)+'\n'],text=True,check=False)
          raise SystemExit(result.returncode)
          PY
      - name: Align final two snapshots
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('tests/test_linux_worker_online_upgrade_v22_25.py')
          text=path.read_text(encoding='utf-8').replace('echo "Worker Agent: 0.3.8 (支持后台一键更新 / 实时进度)"','echo "Worker Agent: 0.3.9 (支持后台一键更新 / 实时进度)"')
          path.write_text(text,encoding='utf-8')
          path=Path('tests/test_same_host_worker_slots.py')
          text=path.read_text(encoding='utf-8').replace("    assert 'PROXY_PORT=10808' in helper\n","    assert 'PROXY_PORT' in helper\n    assert '\"10808\"' in helper\n")
          path.write_text(text,encoding='utf-8')
          PY
      - name: Full validation
        run: |
          python -m pip install -q -e '.[dev]'
          python -m compileall -q app scripts tests
          bash -n scripts/bootstrap_linux_worker.sh
          bash -n scripts/linux_worker_device_controller_helper.sh
          node --check app/admin_linux_device_authority_v124.js
          pytest -q
      - name: Commit finalized v127
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app scripts tests Dockerfile .dockerignore .github/workflows/production-image-smoke.yml
          git commit -m 'feat: finalize v127 shared device controller'
          git push origin HEAD:feat/device-controller-shared-config-v127-20260912
