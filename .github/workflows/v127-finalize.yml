name: v127 finalize shared device controller

on:
  push:
    branches:
      - feat/device-controller-shared-config-v127-20260912

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/device-controller-shared-config-v127-20260912
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Finalize single-controller architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text): Path(path).write_text(text, encoding='utf-8')
          def one(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing anchor: {label}')
              return text.replace(old, new, 1)

          path='app/linux_worker_device_authority_v124_patch.py'; text=read(path)

          # Device rows have exactly one persisted install authority. Historical
          # slot-install records and pre-v127 slot Workers are legacy, never a
          # second current-device authority.
          start=text.index('def _device_rows(app: FastAPI) -> list[dict[str, Any]]:')
          end=text.index('\ndef _create_controller_child', start)
          replacement='''def _device_rows(app: FastAPI) -> list[dict[str, Any]]:\n    installs = app.state.linux_worker_installs.list_admin()\n    workers = app.state.linux_workers.list_public()\n    result: list[dict[str, Any]] = []\n    for device in [row for row in installs if _is_device_install(row)]:\n        meta = _install_meta(device)\n        device_id = _device_id(device)\n        primary_id = str(device.get("worker_id") or "")\n        worker_rows: list[dict[str, Any]] = []\n        for source in workers:\n            worker_id = str(source.get("worker_id") or "")\n            worker_meta = source.get("metadata") if isinstance(source.get("metadata"), dict) else {}\n            is_primary = bool(primary_id and worker_id == primary_id)\n            is_controller_child = (\n                int(worker_meta.get("device_controller_revision") or 0) == 127\n                and str(worker_meta.get("controller_worker_id") or "") == primary_id\n                and str(worker_meta.get("device_id_v124") or "") == device_id\n            )\n            if not is_primary and not is_controller_child:\n                continue\n            worker = dict(source)\n            try:\n                slot = int(worker_meta.get("worker_slot") or (1 if is_primary else 0))\n            except (TypeError, ValueError):\n                slot = 1 if is_primary else 0\n            if slot < 1:\n                continue\n            worker["worker_slot"] = slot\n            worker_rows.append(worker)\n        worker_rows.sort(key=lambda row: int(row.get("worker_slot") or 1))\n        result.append({\n            "device_id": device_id,\n            "device_name": str(meta.get("device_name") or device.get("name") or "Linux 设备"),\n            "device_pairing_id": str(meta.get("pairing_id") or ""),\n            "proxy_id": str(meta.get("proxy_id") or ""),\n            "proxy_name": str(meta.get("proxy_name") or ""),\n            "install_id": str(device.get("install_id") or ""),\n            "install_state": str(device.get("state") or "pending"),\n            "install_stage": str(device.get("stage") or ""),\n            "install_message": str(device.get("message") or ""),\n            "install_command": str(device.get("install_command") or ""),\n            "install_enabled": bool(device.get("enabled", True)),\n            "install_created_at": device.get("created_at"),\n            "install_updated_at": device.get("updated_at"),\n            "workers": worker_rows,\n            "worker_count": len(worker_rows),\n            "authority": "linux-device-v124",\n            "device_controller_revision": 127,\n        })\n    result.sort(key=lambda row: str(row.get("install_created_at") or ""), reverse=True)\n    return result\n\n'''
          text=text[:start]+replacement+text[end+1:]

          start=text.index('def _legacy_snapshot(app: FastAPI) -> dict[str, Any]:')
          end=text.index('\n\nasync def _release_pairing', start)
          replacement='''def _legacy_snapshot(app: FastAPI) -> dict[str, Any]:\n    installs = app.state.linux_worker_installs.list_admin()\n    workers = app.state.linux_workers.list_public()\n    device_installs = [row for row in installs if _is_device_install(row)]\n    current_primary_ids = {str(row.get("worker_id") or "") for row in device_installs if row.get("worker_id")}\n    current_device_ids = {_device_id(row) for row in device_installs}\n    current_worker_ids = set(current_primary_ids)\n    for row in workers:\n        worker_id = str(row.get("worker_id") or "")\n        metadata = row.get("metadata") if isinstance(row.get("metadata"), dict) else {}\n        if (\n            int(metadata.get("device_controller_revision") or 0) == 127\n            and str(metadata.get("controller_worker_id") or "") in current_primary_ids\n            and str(metadata.get("device_id_v124") or "") in current_device_ids\n        ):\n            current_worker_ids.add(worker_id)\n    legacy_workers = [row for row in workers if str(row.get("worker_id") or "") not in current_worker_ids]\n    # Any non-device install row, including the retired v126 worker_slot rows, is\n    # explicit legacy data. v127 never reads such a row to make device decisions.\n    legacy_installs = [row for row in installs if not _is_device_install(row)]\n    return {\n        "workers": [\n            {\n                "worker_id": str(row.get("worker_id") or ""),\n                "name": str(row.get("name") or row.get("device_id") or "Linux Worker"),\n                "last_seen_at": row.get("last_seen_at"),\n                "revoked": bool(row.get("revoked_at")),\n                "online": _recent(row),\n                "pairing_id": str(\n                    ((row.get("metadata") or {}).get("worker_pairing") or {}).get("pairing_id")\n                    or (row.get("metadata") or {}).get("device_pairing_id")\n                    or ""\n                ),\n                "extension_client_id": str(row.get("extension_client_id") or ""),\n            }\n            for row in legacy_workers\n        ],\n        "installations": [\n            {"install_id": str(row.get("install_id") or ""), "name": str(row.get("name") or "Linux Worker")}\n            for row in legacy_installs\n        ],\n    }\n'''
          text=text[:start]+replacement+text[end:]

          # Enrollment install creation is device-only. The retired slot command
          # path is deleted rather than kept as a compatibility fallback.
          pattern=re.compile(r'    def create_install\(\n.*?\n        return \{"install": row, "install_command": command, "device_id": device_id, \*\*metadata\}\n', re.S)
          match=pattern.search(text)
          if not match: raise SystemExit('device create_install block not found')
          replacement='''    def create_install(\n        request: Request,\n        *,\n        pairing: dict[str, Any],\n        pairing_code: str,\n        proxy: dict[str, Any],\n    ) -> dict[str, Any]:\n        device_name = str(pairing.get("device_name") or "Linux 设备").strip()[:80] or "Linux 设备"\n        install = installs.create(device_name)\n        device_id = str(install.get("install_id") or "")\n        metadata = {\n            "device_authority_revision": PATCH_REVISION,\n            "device_controller_revision": 127,\n            "device_id": device_id,\n            "device_name": device_name,\n            "pairing_id": str(pairing.get("pairing_id") or ""),\n            "pairing_prefix": str(pairing.get("prefix") or ""),\n            "proxy_id": str(proxy.get("proxy_id") or ""),\n            "proxy_name": str(proxy.get("name") or ""),\n            "proxy_share_link": str(proxy.get("share_link") or ""),\n            "worker_slot": 1,\n            "install_kind": "device",\n            "parent_device_id": "",\n        }\n        server = _server_url(app, request)\n        code = str(install.get("code") or "")\n        command = (\n            f"curl -fsSL {shlex.quote(server + '/bootstrap/linux-worker.sh')} | "\n            f"sudo bash -s -- --server {shlex.quote(server)} --enroll-code {shlex.quote(code)} "\n            f"--pairing-code {shlex.quote(pairing_code)} --device-name {shlex.quote(device_name)}"\n        )\n        _persist_install_fields(installs, str(install["install_id"]), metadata=metadata, install_command=command)\n        digest = code_hash(code.strip().upper())\n        with workers._lock:\n            workers.data.setdefault("enrollments", {})[digest] = {\n                "code_hash": digest,\n                "name": device_name,\n                "created_at": install.get("created_at") or _utc_iso(),\n                "expires_at": "9999-12-31T23:59:59Z",\n                "used_at": None,\n                "install_id": str(install.get("install_id") or ""),\n                "metadata": copy.deepcopy(metadata),\n            }\n            workers._save()\n        row = installs.get(str(install["install_id"])) or {}\n        return {"install": row, "install_command": command, "device_id": device_id, **metadata}\n'''
          text=text[:match.start()]+replacement+text[match.end():]
          text=one(text,'return create_install(request, pairing=pairing, pairing_code=pairing_code, proxy=proxy, slot=1)','return create_install(request, pairing=pairing, pairing_code=pairing_code, proxy=proxy)','device create call')

          # First enrollment is always the controller/Worker 1 identity.
          text=one(text,'slot = max(1, int(enroll_meta.get("worker_slot") or 1))','slot = 1','primary slot')
          text=one(text,'"device_authority_revision": PATCH_REVISION,\n            "device_id_v124":','"device_authority_revision": PATCH_REVISION,\n            "device_controller_revision": 127,\n            "device_id_v124":','primary controller metadata')

          # No slot-install command repair or deletion paths remain active.
          loop='''            for slot in device.get("slot_installations", []):\n                slot_install_id = str(slot.get("install_id") or "")\n                slot_command = str(slot.get("command") or "")\n                repaired_slot = _repair_install_command_origin(slot_command, public_url)\n                if slot_install_id and repaired_slot and repaired_slot != slot_command:\n                    _persist_install_fields(installs, slot_install_id, install_command=repaired_slot)\n                    slot["command"] = repaired_slot\n'''
          if loop in text: text=text.replace(loop,'',1)
          text=text.replace('''        install_ids = [str(device.get("install_id") or "")]\n        install_ids.extend(str(row.get("install_id") or "") for row in device.get("slot_installations", []))\n''','''        install_ids = [str(device.get("install_id") or "")]\n''',1)

          # Add Worker only runs once the primary has actually upgraded to the
          # v127 controller, avoiding a create-then-fail loop on Agent 0.3.8.
          anchor='''        if not primary:\n            raise HTTPException(409, "请先完成设备首次安装，再增加 Worker")\n        occupied = {int(row.get("worker_slot") or 0) for row in device.get("workers", [])}\n'''
          replacement='''        if not primary:\n            raise HTTPException(409, "请先完成设备首次安装，再增加 Worker")\n        if str(primary.get("agent_version") or "") != "0.3.9":\n            raise HTTPException(409, "请先点击设备列表中的更新，将该设备升级到总控 Agent 0.3.9 后再增加 Worker")\n        occupied = {int(row.get("worker_slot") or 0) for row in device.get("workers", [])}\n'''
          text=one(text,anchor,replacement,'controller readiness gate')
          write(path,text)

          # Shared proxy is a device authority. Child Worker commands cannot mutate it.
          path='scripts/linux_worker_device_controller.py'; text=read(path)
          old='''    if command == "apply_proxy_config":\n        return legacy.base._apply_proxy(arguments)\n'''
          new='''    if command == "apply_proxy_config":\n        if not primary:\n            return {"ok": False, "error": "shared_proxy_via_primary_only"}\n        return legacy.base._apply_proxy(arguments)\n'''
          text=one(text,old,new,'shared proxy primary authority')
          write(path,text)

          # Remove the unused command-output area from the Worker manager UI.
          path='app/admin_linux_device_authority_v124.js'; text=read(path)
          text=text.replace('<div id="managerWorkersV124" style="margin-top:12px"></div><div id="managerCommandV124" style="margin-top:12px"></div>','<div id="managerWorkersV124" style="margin-top:12px"></div>',1)
          write(path,text)

          # A v0.22.83 upgrade retires old per-slot Agents/Xray exactly once. It
          # preserves Chrome Profiles; later v127 upgrades do not touch current
          # controller-managed Chrome/Xvfb slots because they have no slot Agent/Xray.
          path='scripts/bootstrap_linux_worker.sh'; text=read(path)
          anchor='''else\n  echo "[cleanup] 检测到完整 Worker 身份，按幂等升级处理，不删除身份和 Profile"\nfi\n\nset_stage "packages"'''
          migration='''else\n  echo "[cleanup] 检测到完整 Worker 身份，按幂等升级处理，不删除身份和 Profile"\n  for slot in $(seq 2 32); do\n    agent_unit="chat2api-worker-agent-slot${slot}.service"\n    xray_unit="chat2api-xray-slot${slot}.service"\n    if [[ -e "/etc/systemd/system/${agent_unit}" || -e "/etc/systemd/system/${xray_unit}" ]]; then\n      echo "[cleanup] 退役旧 Slot ${slot} 独立 Agent/Xray 控制层（保留 Chrome Profile）"\n      for unit in "$agent_unit" "$xray_unit" "chat2api-chrome-slot${slot}.service" "chat2api-xvfb-slot${slot}.service"; do\n        systemctl disable --now "$unit" >/dev/null 2>&1 || true\n        rm -f "/etc/systemd/system/${unit}"\n      done\n      rm -rf "/etc/chat2api-worker-slot${slot}" "/var/lib/chat2api-worker-slot${slot}" "/opt/chat2api-worker-venv-slot${slot}"\n    fi\n  done\n  systemctl daemon-reload\nfi\n\nset_stage "packages"'''
          text=one(text,anchor,migration,'retire old per-slot agents')
          old='''[[ -f "$BUNDLE_TMP/chrome_extension/manifest.json" && -f "$BUNDLE_TMP/scripts/linux_worker_agent.py" && -f "$BUNDLE_TMP/scripts/linux_worker_chrome_launcher.sh" ]] || { LAST_MESSAGE="Worker Bundle 内容不完整"; exit 1; }'''
          new='''[[ -f "$BUNDLE_TMP/chrome_extension/manifest.json" && -f "$BUNDLE_TMP/scripts/linux_worker_device_controller.py" && -f "$BUNDLE_TMP/scripts/linux_worker_device_controller_helper.sh" && -f "$BUNDLE_TMP/scripts/linux_worker_chrome_launcher.sh" ]] || { LAST_MESSAGE="Worker Bundle 内容不完整"; exit 1; }'''
          text=one(text,old,new,'controller bundle completeness')
          write(path,text)

          # Retired v126 slot Agent/installers are removed from production entirely.
          path='Dockerfile'; text=read(path)
          text=text.replace(' scripts/linux_worker_slot_agent.py','')
          text=text.replace(' scripts/linux_worker_slot_install.sh scripts/linux_worker_slot_install_reported.sh','')
          text=text.replace(' /app/worker_payload/scripts/linux_worker_slot_install.sh /app/worker_payload/scripts/linux_worker_slot_install_reported.sh','')
          write(path,text)
          path='.dockerignore'; text=read(path)
          for line in ('!scripts/linux_worker_slot_agent.py\n','!scripts/linux_worker_slot_install.sh\n','!scripts/linux_worker_slot_install_reported.sh\n'):
              text=text.replace(line,'')
          write(path,text)

          # Rewrite the historical same-host-slot test into the new single-controller contract.
          path='tests/test_linux_worker_same_host_slots_v1.py'
          write(path, '''from pathlib import Path\nimport subprocess\n\nROOT = Path(__file__).resolve().parents[1]\n\n\ndef test_v127_single_device_controller_retires_per_slot_agents_and_installers():\n    runtime = (ROOT / "app" / "runtime_contract.py").read_text(encoding="utf-8")\n    docker = (ROOT / "Dockerfile").read_text(encoding="utf-8")\n    bootstrap = (ROOT / "scripts" / "bootstrap_linux_worker.sh").read_text(encoding="utf-8")\n    assert 'SERVER_RUNTIME_VERSION = "0.22.83"' in runtime\n    assert '\"linux_worker_device_controller_agent_v127\": True' in runtime\n    assert '\"linux_worker_shared_device_pairing_v127\": True' in runtime\n    assert '\"linux_worker_shared_device_proxy_v127\": True' in runtime\n    assert '\"linux_worker_profile_only_isolation_v127\": True' in runtime\n    assert '\"linux_worker_same_host_slots_v1\": False' in runtime\n    assert 'linux_worker_device_controller.py' in bootstrap\n    assert 'linux_worker_slot_agent.py' not in docker\n    assert 'linux_worker_slot_install.sh' not in docker\n    assert 'linux_worker_slot_install_reported.sh' not in docker\n\n\ndef test_v127_worker_add_is_direct_and_shares_device_pairing_and_proxy():\n    authority = (ROOT / "app" / "linux_worker_device_authority_v124_patch.py").read_text(encoding="utf-8")\n    ui = (ROOT / "app" / "admin_linux_device_authority_v124.js").read_text(encoding="utf-8")\n    assert '"provision_worker"' in authority\n    assert 'shared_device_pairing' in authority\n    assert 'shared_device_proxy' in authority\n    assert 'profile_only_isolation' in authority\n    add = authority.split('async def add_linux_device_worker',1)[1].split('@app.delete',1)[0]\n    assert 'pairing_id' not in add\n    assert 'proxy_id' not in add\n    assert 'create_install(' not in add\n    assert 'provision_worker' in add\n    assert 'linux_worker_slot_install' not in authority\n    assert 'slot_installations' not in authority\n    assert 'id="linuxAddWorkerV124"' not in ui\n    assert 'Worker ${r.worker_slot} 已由设备总控 Agent 创建' in ui\n\n\ndef test_v127_device_and_worker_ui_contract():\n    ui = (ROOT / "app" / "admin_linux_device_authority_v124.js").read_text(encoding="utf-8")\n    header = ui.split('id="linuxDeviceTableV124"',1)[1].split('</thead>',1)[0]\n    assert '<th>状态</th>' in header\n    assert '<th>ChatGPT</th>' not in header\n    assert 'deviceInstallStatus' in ui\n    manager = ui.split('function renderManager()',1)[1].split('function renamePairingHeader',1)[0]\n    assert '<th>代理</th>' not in manager\n    assert '<th>ChatGPT</th>' in manager\n    assert 'data-worker-action="initialize"' in manager\n    assert 'data-login-worker=' in manager\n    assert 'data-diagnostics=' in manager\n\n\ndef test_controller_and_root_helper_parse():\n    py = subprocess.run(['python','-m','py_compile',str(ROOT/'scripts/linux_worker_device_controller.py')],capture_output=True,text=True,check=False)\n    assert py.returncode == 0, py.stderr\n    sh = subprocess.run(['bash','-n',str(ROOT/'scripts/linux_worker_device_controller_helper.sh')],capture_output=True,text=True,check=False)\n    assert sh.returncode == 0, sh.stderr\n''')
          PY
      - name: Rewrite production smoke for v127
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/production-image-smoke.yml')
          text=path.read_text(encoding='utf-8')
          for token in (
              '                  "scripts/linux_worker_slot_agent.py",\n',
              '                  "scripts/linux_worker_slot_install.sh",\n',
              '                  "scripts/linux_worker_slot_install_reported.sh",\n',
          ):
              text=text.replace(token,'')
          text=text.replace('                  "scripts/linux_worker_agent_v44.py",\n','                  "scripts/linux_worker_agent_v44.py",\n                  "scripts/linux_worker_device_controller.py",\n                  "scripts/linux_worker_device_controller_helper.sh",\n                  "scripts/linux_worker_slot_chrome_launcher.sh",\n',1)
          text=text.replace('              slot = archive.extractfile("scripts/linux_worker_slot_install.sh").read().decode("utf-8")\n','              controller = archive.extractfile("scripts/linux_worker_device_controller.py").read().decode("utf-8")\n              controller_helper = archive.extractfile("scripts/linux_worker_device_controller_helper.sh").read().decode("utf-8")\n',1)
          text=text.replace('          assert "linux_worker_extension_pair.py" in slot and "--pairing-code" in slot\n','          assert "worker.heartbeat" in controller and "target_worker_id" in controller\n          assert "provision_worker" in controller and "shared_proxy_via_primary_only" in controller\n          assert "provision) provision" in controller_helper and "chat2api-xray.service" in controller_helper\n          assert "scripts/linux_worker_slot_agent.py" not in names\n          assert "scripts/linux_worker_slot_install.sh" not in names\n          assert "scripts/linux_worker_slot_install_reported.sh" not in names\n',1)
          text=text.replace('          slot_installer = Path("/app/worker_payload/scripts/linux_worker_slot_install.sh").read_text()\n','          controller_source = Path("/app/worker_payload/scripts/linux_worker_device_controller.py").read_text()\n          controller_helper_source = Path("/app/worker_payload/scripts/linux_worker_device_controller_helper.sh").read_text()\n',1)
          text=text.replace('          assert "\\\"linux_worker_isolated_management_v126\\\": True" in runtime\n          assert "\\\"linux_worker_slot_isolated_ops_v126\\\": True" in runtime\n','          assert "\\\"linux_worker_isolated_management_v126\\\": False" in runtime\n          assert "\\\"linux_worker_slot_isolated_ops_v126\\\": False" in runtime\n          assert "\\\"linux_worker_device_controller_agent_v127\\\": True" in runtime\n          assert "\\\"linux_worker_shared_device_proxy_v127\\\": True" in runtime\n          assert "\\\"linux_worker_profile_only_isolation_v127\\\": True" in runtime\n',1)
          text=text.replace('          assert "chat2api-worker-initialize-slot([0-9]+)" in initialize_helper\n          assert "chat2api-worker-diagnostics-slot([0-9]+)" in diagnostics_helper\n          assert "CHAT2API_INITIALIZE_HELPER=${INITIALIZE_HELPER}" in slot_installer\n          assert "CHAT2API_DIAGNOSTICS_HELPER=${DIAGNOSTICS_HELPER}" in slot_installer\n','          assert "linux_worker_device_controller.py" in bootstrap.read_text()\n          assert "worker.heartbeat" in controller_source\n          assert "chat2api-xray.service" in controller_helper_source\n          assert "linux_worker_slot_install" not in authority\n          assert "slot_installations" not in authority\n',1)
          text=text.replace('"isolated_management_v126": True','"device_controller_v127": True')
          text=text.replace("payload['server']['runtime_version'] == '0.22.82'","payload['server']['runtime_version'] == '0.22.83'")
          text=text.replace("payload['features']['linux_worker_isolated_management_v126'] is True","payload['features']['linux_worker_isolated_management_v126'] is False")
          text=text.replace("payload['features']['linux_worker_slot_isolated_ops_v126'] is True","payload['features']['linux_worker_slot_isolated_ops_v126'] is False")
          text=text.replace("payload['features']['linux_worker_same_host_slots_v1'] is True","payload['features']['linux_worker_same_host_slots_v1'] is False")
          marker="          assert payload['features']['linux_worker_same_host_slots_v1'] is False\n"
          if marker in text and "linux_worker_device_controller_agent_v127" not in text.split(marker,1)[1][:500]:
              text=text.replace(marker,marker+"          assert payload['features']['linux_worker_device_controller_agent_v127'] is True\n          assert payload['features']['linux_worker_shared_device_pairing_v127'] is True\n          assert payload['features']['linux_worker_shared_device_proxy_v127'] is True\n          assert payload['features']['linux_worker_profile_only_isolation_v127'] is True\n",1)
          text=text.replace("'isolated_management_v126': True","'device_controller_v127': True")
          text=text.replace("          assert 'Worker版本' in v124\n","          assert 'Worker版本' in v124\n          device_header = v124.split('id=\\\"linuxDeviceTableV124\\\"',1)[1].split('</thead>',1)[0]\n          assert '<th>ChatGPT</th>' not in device_header\n          manager = v124.split('function renderManager()',1)[1].split('function renamePairingHeader',1)[0]\n          assert '<th>代理</th>' not in manager\n          assert '增加 Worker' in v124\n",1)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Syntax and full regression suite
        run: |
          python -m pip install -q -e '.[dev]'
          python -m compileall -q app scripts
          bash -n scripts/bootstrap_linux_worker.sh
          bash -n scripts/linux_worker_device_controller_helper.sh
          node --check app/admin_linux_device_authority_v124.js
          pytest -q
      - name: Commit finalized v127
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app scripts tests Dockerfile .dockerignore .github/workflows/production-image-smoke.yml
          git commit -m 'feat: finalize single-controller Linux device authority'
          git push origin HEAD:feat/device-controller-shared-config-v127-20260912
