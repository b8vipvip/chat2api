name: Temporary v0.22.106 version alignment

on:
  push:
    branches:
      - release/v0.22.106-standby-target-sync

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.22.106-standby-target-sync
          fetch-depth: 0
      - name: Align runtime and test contracts to v0.22.106
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          names = subprocess.check_output(
              ['git', 'grep', '-l', '0.22.105', '--', 'app', 'chrome_extension', 'tests'],
              text=True,
          ).splitlines()
          changed = []
          for name in names:
              path = Path(name)
              data = path.read_text(encoding='utf-8')
              updated = data.replace('0.22.105', '0.22.106')
              if updated != data:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(name)
          if not changed:
              raise SystemExit('no v0.22.105 runtime/test contract files found')
          print(f'aligned {len(changed)} files')
          for name in changed:
              print(name)
          PY
          node --check chrome_extension/background.js
          node --check chrome_extension/conversation_persistent_pool_v132.js
          python -m py_compile app/runtime_contract.py app/worker_limits_clipboard_v121_patch.py app/main.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app chrome_extension tests
          git commit -m "release: align runtime contract to v0.22.106"
          git push origin HEAD:release/v0.22.106-standby-target-sync
